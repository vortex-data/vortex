<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530"
     role="img" aria-labelledby="title description">
  <!-- SPDX-License-Identifier: CC-BY-4.0 -->
  <!-- SPDX-FileCopyrightText: Copyright the Vortex contributors -->
  <title id="title">Decimal encoding changes retain support for the v1 wire format</title>
  <desc id="description">
    The rows compare the decimal-byte-parts implementation before and after multi-child support.
    Before the change, the array held one signed integer child and values had to fit in 64 bits.
    It read and wrote vortex.decimal_byte_parts, called v1 here. After the change, the array holds
    one signed child and up to three unsigned children, adding support for 128-bit and 256-bit
    values. Its plugin still writes v1 for a single child, but writes vortex.decimal_byte_parts.v2
    for two to four children. Both wire formats deserialize into the updated array type. The v1
    contract still requires exactly one signed child. The v2 contract permits one to four children,
    so it can be read with one child even though the serializer chooses v1 for that shape.
    The vertical arrow marks a change to the implementation, not a conversion of stored data.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
            markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="530" rx="12" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="24" y="34" font-size="24" font-weight="bold">Decimal encoding changes retain support for the v1 wire format</text>
    <text x="24" y="78" font-size="17" font-weight="bold">IN-MEMORY IMPLEMENTATION</text>
    <text x="636" y="78" font-size="17" font-weight="bold">SERIALIZED DATA</text>

    <rect x="24" y="102" width="368" height="126" rx="8" fill="#f6f7f9" stroke="#94a3b8"/>
    <text x="44" y="131" font-size="20" font-weight="bold">Before multi-child support</text>
    <text x="44" y="158" font-size="18">DecimalBytePartsArray</text>
    <text x="44" y="188" font-size="18">One signed integer child</text>
    <text x="44" y="214" font-size="18">Values must fit in 64 bits.</text>

    <rect x="636" y="102" width="380" height="126" rx="8" fill="#eaf3fc" stroke="#2563a6"/>
    <text x="654" y="135" font-size="20" font-weight="bold">v1</text>
    <text x="654" y="170" font-size="18" font-family="monospace">vortex.decimal_byte_parts</text>
    <text x="654" y="206" font-size="18">Exactly one signed child</text>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 408 148 H 620"/>
      <path d="M 620 190 H 408"/>
    </g>
    <g font-size="17" fill="#475569" text-anchor="middle">
      <text x="514" y="137">write</text>
      <text x="514" y="216">read</text>
    </g>

    <path d="M 24 267 H 1016" stroke="#cbd5e1" stroke-dasharray="5 5"/>
    <rect x="40" y="246" width="336" height="40" fill="#ffffff"/>
    <path d="M 55 238 V 296" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="76" y="272" font-size="17" fill="#475569">Add support for multiple children</text>

    <rect x="24" y="306" width="368" height="200" rx="8" fill="#f0f7f6" stroke="#52867f"/>
    <text x="44" y="336" font-size="20" font-weight="bold">After multi-child support</text>
    <text x="44" y="364" font-size="18">DecimalBytePartsArray</text>
    <text x="44" y="398" font-size="18">One signed child and up to three</text>
    <text x="44" y="423" font-size="18">unsigned children</text>
    <text x="44" y="458" font-size="18">Adds 128-bit and 256-bit values.</text>
    <text x="44" y="488" font-size="18">The plugin reads both v1 and v2.</text>

    <rect x="636" y="306" width="380" height="88" rx="8" fill="#eaf3fc" stroke="#2563a6"/>
    <text x="654" y="333" font-size="19" font-weight="bold">v1: the wire contract is unchanged</text>
    <text x="654" y="359" font-size="18" font-family="monospace">vortex.decimal_byte_parts</text>
    <text x="654" y="384" font-size="17">Exactly one signed child</text>

    <rect x="636" y="418" width="380" height="88" rx="8" fill="#eaf3fc" stroke="#2563a6"/>
    <text x="654" y="445" font-size="19" font-weight="bold">v2: an additional wire contract</text>
    <text x="654" y="471" font-size="18" font-family="monospace">vortex.decimal_byte_parts.v2</text>
    <text x="654" y="496" font-size="17">One signed + 0 to 3 unsigned children</text>

    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 408 341 H 620"/>
      <path d="M 620 367 H 408"/>
      <path d="M 408 453 H 620"/>
      <path d="M 620 479 H 408"/>
    </g>
    <g font-size="17" fill="#475569" text-anchor="middle">
      <text x="514" y="329">write: 1 child</text>
      <text x="514" y="390">read: 1 child</text>
      <text x="514" y="441">write: 2 to 4 children</text>
      <text x="514" y="502">read: 1 to 4 children</text>
    </g>
  </g>
</svg>
