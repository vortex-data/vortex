[package]
name = "vortex-morsel"
authors.workspace = true
description = "Experimental morsel-driven scan executor for Vortex layouts"
edition = { workspace = true }
homepage = { workspace = true }
categories = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
_test-harness = [
    "vortex-layout/_test-harness",
    "vortex-array/_test-harness",
    "vortex-io/tokio",
    "dep:tokio",
    "dep:vortex-btrblocks",
    "dep:vortex-arrow",
    "dep:arrow-schema",
    "dep:arrow-array",
    "dep:arrow-cast",
    "dep:parquet",
    "dep:vortex-morsel-push",
    "dep:tpchgen",
    "dep:tpchgen-arrow",
    "dep:vortex",
    "dep:rustix",
]

[dependencies]
vortex-array = { workspace = true }
vortex-buffer = { workspace = true }
vortex-error = { workspace = true }
vortex-layout = { workspace = true }
vortex-mask = { workspace = true }
vortex-scan = { workspace = true }
vortex-session = { workspace = true }
vortex-utils = { workspace = true }

futures = { workspace = true }
vortex-io = { workspace = true }
vortex-btrblocks = { workspace = true, optional = true }
vortex-arrow = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
arrow-schema = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-cast = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
vortex-morsel-push = { workspace = true, optional = true, features = ["_test-harness"] }
tpchgen = { workspace = true, optional = true }
tpchgen-arrow = { workspace = true, optional = true }
vortex = { workspace = true, optional = true, features = ["files"] }
itertools = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
rustix = { workspace = true, features = ["fs"], optional = true }

[dev-dependencies]
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
parquet = { workspace = true }
vortex-array = { workspace = true, features = ["_test-harness"] }
vortex-layout = { workspace = true, features = ["_test-harness"] }
vortex-io = { workspace = true, features = ["tokio"] }
vortex-btrblocks = { workspace = true }
vortex-arrow = { workspace = true }
arrow-schema = { workspace = true }
tpchgen = { workspace = true }
tpchgen-arrow = { workspace = true }
vortex = { workspace = true, features = ["files"] }
vortex-scan = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bin]]
name = "morsel-eval"
path = "src/bin/morsel-eval.rs"
required-features = ["_test-harness"]

[[bin]]
name = "tpch-eval"
path = "src/bin/tpch-eval.rs"
required-features = ["_test-harness"]

[lints]
workspace = true
