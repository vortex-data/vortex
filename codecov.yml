coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
  after_n_builds: 3

ignore:
  - "**/examples/**"
  - "**/tests/**"
  - "**/tests.rs"
  - "**/test.rs"
  - "**/e2e_test/**"
  - "**/*_tests.rs"
  - "**/*_test.rs"
  - "**/conformance/**"
  - "**/test_harness/**"
  - "**/test_harness.rs"
  - "**/arbitrary/**"
  - "**/arbitrary.rs"
  - "**/generated/**"
  - "benchmarks/**"
  - "fuzz/**"
  - "vortex-bench/**"
  - "vortex-cuda/**"
  - "vortex-python-cuda/**"
  - "vortex-sqllogictest/**"
  - "vortex-test/**"
  - "vortex-tui/**"
  - "xtask/**"
