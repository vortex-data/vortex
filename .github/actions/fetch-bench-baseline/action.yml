name: "Fetch benchmark baseline"
description: >-
  Write the develop baseline for a PR benchmark run, read from the benchmarks Postgres as the
  read-only bench_read role. Without a password (fork PRs get no secrets), it writes no
  baseline and the report says the baseline could not be read.

inputs:
  pr-records:
    description: "The PR run's --ingest-jsonl output"
    required: true
  output:
    description: "Where to write the baseline records"
    required: true
  password:
    description: "Password of the bench_read Postgres role"
    required: false
    default: ""
  endpoint:
    description: "Hostname of the benchmarks RDS instance"
    required: true
  database:
    description: "Name of the benchmarks database"
    required: true

runs:
  using: "composite"
  steps:
    - name: Fetch baseline
      shell: bash
      env:
        PR_RECORDS: ${{ inputs.pr-records }}
        OUTPUT: ${{ inputs.output }}
        PGPASSWORD: ${{ inputs.password }}
        RDS_BENCH_INSTANCE_ENDPOINT: ${{ inputs.endpoint }}
        RDS_BENCH_DB_NAME: ${{ inputs.database }}
      run: |
        set -Eeu -o pipefail
        if [[ -z "$PGPASSWORD" ]]; then
          # No baseline file tells the report that the baseline could not be read.
          echo "::warning::No benchmarks database credential; reporting without a baseline."
          exit 0
        fi
        curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
          -o "${RUNNER_TEMP}/rds-global-bundle.pem"
        DSN="postgresql://bench_read@${RDS_BENCH_INSTANCE_ENDPOINT}:5432/${RDS_BENCH_DB_NAME}?sslmode=verify-full&sslrootcert=${RUNNER_TEMP}/rds-global-bundle.pem"
        uv run --no-project scripts/fetch-benchmark-baseline.py "$PR_RECORDS" "$OUTPUT" --postgres "$DSN"
