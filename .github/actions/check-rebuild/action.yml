name: "Build and verify rebuild is a no-op"
description: "Run a cargo command, then re-run it to verify all artifacts are cached"
inputs:
  command:
    description: "The cargo build command to run and verify"
    required: true
  message-format-flag:
    description: "The flag used to request Cargo compiler-artifact JSON during the verification run"
    required: false
    default: "--message-format"
runs:
  using: "composite"
  steps:
    - name: "Build"
      shell: bash
      run: bash -c -- "$INPUTS_COMMAND"
      env:
        INPUTS_COMMAND: ${{ inputs.command }}
    - name: "Verify rebuild is a no-op"
      shell: bash
      run: |
        verify_command=${INPUTS_COMMAND}' "$@"'
        stale=$(bash -c -- "$verify_command" _ \
          "$INPUTS_MESSAGE_FORMAT_FLAG" json 2>/dev/null \
          | jq -r 'select(.reason == "compiler-artifact" and .fresh == false) | .target.name')
        if [ -n "$stale" ]; then
          echo "ERROR: Rebuild recompiled crates that should have been cached:"
          echo "$stale"
          exit 1
        fi
      env:
        INPUTS_COMMAND: ${{ inputs.command }}
        INPUTS_MESSAGE_FORMAT_FLAG: ${{ inputs.message-format-flag }}
