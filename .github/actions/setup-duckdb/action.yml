name: "Setup DuckDB"
description: "Download the DuckDB CLI and put it on PATH"
inputs:
  duckdb_version:
    # Keep this on the DuckDB minor version that `vortex-duckdb/build.rs` links (2.0), so the CLI
    # that writes the `duckdb` database matches the DuckDB the queries run on.
    description: "Version of the DuckDB CLI"
    default: "2.0.1"
runs:
  using: "composite"
  steps:
    - name: Download DuckDB
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) duckdb_arch=amd64 ;;
          aarch64|arm64) duckdb_arch=arm64 ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        # Since 2.0, the release ships the CLI as a tarball that holds the `duckdb` binary.
        wget -qO- \
          "https://github.com/duckdb/duckdb/releases/download/v${{ inputs.duckdb_version }}/duckdb-cli-linux-${duckdb_arch}.tar.gz" \
          | tar -xz duckdb
        chmod +x duckdb
        ./duckdb --version
        echo "$PWD" >> "$GITHUB_PATH"
