name: "Setup flatc"
description: "Download and install flatc binary"
inputs:
  flatc_version:
    description: "Version of the flatc binary"
    default: "25.12.19"
runs:
  using: "composite"
  steps:
    - name: Download flatc
      id: download-flatc
      shell: bash
      run: |
        wget -O /tmp/flatc.zip "https://github.com/google/flatbuffers/releases/download/v${INPUTS_FLATC_VERSION}/Linux.flatc.binary.clang++-18.zip"
        unzip /tmp/flatc.zip flatc
        mv flatc /usr/local/bin/
      env:
        INPUTS_FLATC_VERSION: ${{ inputs.flatc_version }}
