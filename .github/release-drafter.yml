name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
categories:
  - type: "pre-exclude"
    when:
      labels:
        - "changelog/skip"
        - "changelog/ci"

  # Any features or breaks will trigger a minor version bump (while we are 0.x)
  - title: "📜 Editions"
    semver-increment: "minor"
    when:
      label: "changelog/edition"
  - title: "⚠️ Breaks"
    semver-increment: "minor"
    when:
      label: "changelog/break"
  - title: "🚧 Deprecation"
    when:
      label: "changelog/deprecation"
  - title: "✨ Features"
    semver-increment: "minor"
    when:
      label: "changelog/feature"
  - title: "🚀 Performance"
    when:
      label: "changelog/performance"
  - title: "🐛 Bug Fixes"
    collapse-after: 8
    when:
      label: "changelog/fix"
  - title: "📖 Documentation"
    collapse-after: 3
    when:
      label: "changelog/docs"
  - title: "🧰 Maintenance"
    collapse-after: 3
    when:
      label: "changelog/chore"

  # We must explicitly label a PR with "major" to trigger a major version bump.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "major"
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  ## Changes

  $CHANGES
