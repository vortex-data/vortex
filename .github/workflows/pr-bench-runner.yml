# Runs one non-SQL benchmark for a pull request.

name: PR Benchmark Runner

concurrency:
  # The group causes runs to queue instead of running in parallel.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ inputs.benchmark_id }}${{ inputs.variant_id }}
  # Don't cancel benchmarks that are already running, instead just queue them up.
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      benchmark_id:
        required: true
        type: string
      benchmark_name:
        required: true
        type: string
      with_lance:
        required: false
        type: boolean
        default: false
      variant_id:
        description: >-
          Suffix distinguishing runs of the same benchmark, e.g. "-s3". Keeps the PR comment
          tag and the concurrency group of a variant separate from the default run.
        required: false
        type: string
        default: ""
      remote_data_dir:
        description: >-
          Public S3 fixture prefix for Random Access. An empty value uses local disk.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  build:
    timeout-minutes: 60
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-bench/tag={1}{2}', github.run_id, inputs.benchmark_id, github.event.pull_request.head.repo.fork == false && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.event.pull_request.head.repo.fork == false
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              fetch-depth: 0
      - parallel:
          - uses: ./.github/actions/assert-cpu
            if: github.repository == 'vortex-data/vortex'
          - uses: ./.github/actions/setup-prebuild
            with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              enable-sccache: ${{ github.event.pull_request.head.repo.fork == false && 'true' || 'false' }}
      - name: Build binary
        shell: bash
        env:
          RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
        run: |
          cargo build --package ${{ inputs.benchmark_id }} --profile release_debug \
            ${{ inputs.with_lance && '--features lance' || '' }}
      - name: Upload benchmark binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ inputs.benchmark_id }}-binary
          path: target/release_debug/${{ inputs.benchmark_id }}

  # The debuginfo upload takes minutes. Running it in its own job keeps it off the path to the
  # bench job; Polar Signals matches debuginfo to profiles by build ID whenever it lands.
  upload-debuginfo:
    needs: build
    if: github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-medium/image=ubuntu26-full-arm64-pre-v2/extras=s3-cache/tag=upload-debuginfo-{1}', github.run_id, inputs.benchmark_id)
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          # Wires up the RunsOn artifact proxy that download-artifact uses.
          - uses: runs-on/action@v2
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Download benchmark binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.benchmark_id }}-binary
          path: target/release_debug/
      - name: Pre-upload benchmark debuginfo to Polar Signals
        uses: ./.github/actions/upload-parca-debuginfo
        continue-on-error: true
        with:
          paths: |
            target/release_debug/${{ inputs.benchmark_id }}
          polarsignals-cloud-token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
          project-id: "e5d846e1-b54c-46e7-9174-8bf055a3af56"

  bench:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 120
    env:
      # Keeps mimalloc from returning freed memory to the OS between scans, whose decode
      # buffers would otherwise fault their pages in again.
      MIMALLOC_PURGE_DELAY: "-1"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=bench-dedicated/family=c8gd.metal-24xl/image=ubuntu26-full-arm64-pre-v2/tag={1}{2}', github.run_id, inputs.benchmark_id, github.event.pull_request.head.repo.fork == false && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          # `extras=s3-cache` points ACTIONS_RESULTS_URL at the RunsOn artifact proxy, but only
          # this action wires the runner up to it. Without it `download-artifact` talks to an
          # uninitialised proxy and fails ListArtifacts with a non-JSON body. The build job
          # above already does this, which is why the upload half worked.
          - uses: runs-on/action@v2
            if: github.event.pull_request.head.repo.fork == false
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              # `compare-benchmark-jsons.py` resolves its baseline by walking `git rev-list HEAD`,
              # which reaches only the tip of a shallow clone.
              fetch-depth: 0

      # Older PR heads may still need local files or emit unversioned S3 measurements.
      - name: Check S3 benchmark capabilities
        id: remote-data
        if: inputs.remote_data_dir != ''
        shell: bash
        run: |
          if git grep -q -F 'fn relative_path(&self, format: Format) -> String;' -- vortex-bench/src/random_access/mod.rs; then
            echo "skip-local=true" >> "$GITHUB_OUTPUT"
          fi
          if git grep -q -F 'const S3_TIMING_VERSION:' -- benchmarks/random-access-bench/src/lib.rs; then
            echo "versioned-records=true" >> "$GITHUB_OUTPUT"
          fi

      # Every install and download below is independent of the others.
      - parallel:
          - name: Install DuckDB
            uses: ./.github/actions/setup-duckdb
          - uses: ./.github/actions/system-info
          - name: Download benchmark binary
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
            with:
              name: ${{ inputs.benchmark_id }}-binary
              path: target/release_debug/
          - name: Setup Polar Signals
            if: github.event.pull_request.head.repo.fork == false
            uses: polarsignals/gh-actions-ps-profiling@cd2cb45af81fbe1ca629c2ac479348207598160e  # v0.9.0
            # Profiling is observability only, so a flaky agent download must not fail the benchmark.
            continue-on-error: true
            with:
              polarsignals_cloud_token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
              labels: "branch=${{ github.ref_name }};gh_run_id=${{ github.run_id }};commit_sha=${{ github.event.pull_request.head.sha }};benchmark=${{ inputs.benchmark_id }}"
              project_uuid: "e5d846e1-b54c-46e7-9174-8bf055a3af56"
              job_name: "${{ inputs.benchmark_id }}"
              profiling_frequency: 199
              extra_args: "--debuginfo-strip=false"
              parca_agent_version: "0.49.0"
          - name: Setup AWS CLI
            if: inputs.remote_data_dir == '' && github.event.pull_request.head.repo.fork == false
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
            with:
              role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
              aws-region: us-east-1
          - name: Install uv
            uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
            with:
              sync: false
          # Parquet and LitData do not depend on Vortex code, so they are cached; LitData alone is
          # about 80% of data generation time. Vortex, Arrow IPC and Lance are written every run.
          # The key covers the dataset generators, the crates that write and seed the Parquet files,
          # and the LitData conversion. Keep the litdata version in sync with the Install LitData step.
          - name: Compute benchmark data cache key
            id: data-cache-key
            if: inputs.benchmark_id == 'random-access-bench' && steps.remote-data.outputs.skip-local != 'true'
            shell: bash
            run: |
              set -Eeu -o pipefail
              crates=$(awk '/^\[\[package\]\]/ { name = "" }
                /^name = / { name = $3 }
                /^version = / && name ~ /^"(parquet|arrow-.*|rand.*)"$/ { print name, $3 }' Cargo.lock \
                | sort | sha256sum | cut -c1-16)
              echo "crates=$crates" >> "$GITHUB_OUTPUT"

      # These need the binary, uv, or the cache key from the group above.
      - parallel:
          - name: Make benchmark binary executable
            shell: bash
            run: chmod +x target/release_debug/${{ inputs.benchmark_id }}
          - name: Install LitData
            # LitData is Python-only, so random-access-bench times it through
            # scripts/litdata-random-access.py, run by the interpreter named in LITDATA_PYTHON.
            if: inputs.benchmark_id == 'random-access-bench' && inputs.remote_data_dir == ''
            shell: bash
            run: |
              set -Eeu -o pipefail -x

              uv venv --python 3.12 .venv-litdata
              uv pip install --python .venv-litdata \
                --index-strategy unsafe-best-match \
                --extra-index-url https://download.pytorch.org/whl/cpu \
                litdata==0.2.76 torch pyarrow numpy
              echo "LITDATA_PYTHON=$PWD/.venv-litdata/bin/python" >> "$GITHUB_ENV"
          - name: Restore benchmark data
            id: data-cache
            if: inputs.benchmark_id == 'random-access-bench' && steps.remote-data.outputs.skip-local != 'true'
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: |
                vortex-bench/data/taxi/taxi.parquet
                vortex-bench/data/random_access/*/*.parquet
                vortex-bench/data/random_access/*/*.litdata
              key: >-
                random-access-data-v1-${{ inputs.remote_data_dir != '' && 's3' || 'local' }}-litdata0.2.76-${{ steps.data-cache-key.outputs.crates }}-${{
                  hashFiles(
                    'vortex-bench/src/datasets/**',
                    'vortex-bench/src/random_access/**',
                    'vortex-bench/src/utils/parquet.rs',
                    'scripts/litdata-random-access.py',
                    'benchmarks/random-access-bench/src/litdata.rs') }}
          # string-bench reads most of its columns from Hugging Face, which rate limits
          # unauthenticated downloads. The key covers the sources and row caps in lib.rs and the
          # shared Parquet writer settings, whose layout version decides when a file is stale.
          - name: Restore string-bench data
            id: string-data-cache
            if: inputs.benchmark_id == 'string-bench'
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: vortex-bench/data/string-bench/*.parquet
              key: >-
                string-bench-data-v1-${{ hashFiles(
                  'benchmarks/string-bench/src/lib.rs',
                  'vortex-bench/src/utils/parquet.rs') }}

      # Download and convert all benchmark data up front, so the benchmark step below only
      # contains timed runs. The data is written with the same settings the benchmark uses.
      - name: Generate ${{ inputs.benchmark_name }} data
        if: steps.remote-data.outputs.skip-local != 'true'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bench="${{ inputs.benchmark_id }}"
          python3 "scripts/${bench%-bench}-split.py" --prepare-data \
            ${{ inputs.remote_data_dir != '' && format('--remote-data-dir {0}', inputs.remote_data_dir) || '' }}

      # Save the data cache before setup-benchmark.sh pins processes to the housekeeping CPUs.
      - parallel:
          - name: Save benchmark data
            if: >-
              inputs.benchmark_id == 'random-access-bench' && steps.remote-data.outputs.skip-local != 'true'
              && steps.data-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: |
                vortex-bench/data/taxi/taxi.parquet
                vortex-bench/data/random_access/*/*.parquet
                vortex-bench/data/random_access/*/*.litdata
              key: ${{ steps.data-cache.outputs.cache-primary-key }}
          - name: Save string-bench data
            if: inputs.benchmark_id == 'string-bench' && steps.string-data-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: vortex-bench/data/string-bench/*.parquet
              key: ${{ steps.string-data-cache.outputs.cache-primary-key }}

      - name: Setup benchmark environment
        run: sudo bash scripts/setup-benchmark.sh

      - name: Run ${{ inputs.benchmark_name }} benchmark (per-combination)
        if: inputs.benchmark_id == 'random-access-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
          AWS_REGION: "us-east-1"
          AWS_SKIP_SIGNATURE: ${{ inputs.remote_data_dir != '' }}
          REMOTE_DATA_DIR: ${{ inputs.remote_data_dir }}
          VERSIONED_RECORDS: ${{ steps.remote-data.outputs.versioned-records }}
        run: |
          python3 scripts/random-access-split.py --emit-ingest-records \
            ${{ inputs.remote_data_dir != '' && format('--remote-data-dir {0}', inputs.remote_data_dir) || '' }}

          # Keep legacy PR timings visible without matching historical or current baselines.
          if [[ -n "$REMOTE_DATA_DIR" && "$VERSIONED_RECORDS" != "true" ]]; then
            jq -c --arg fixture "$REMOTE_DATA_DIR" \
              '.dataset |= ("legacy-" + ($fixture | rtrimstr("/") | @uri) + "-" + .)' \
              results.ingest.jsonl > results.legacy.ingest.jsonl
            mv results.legacy.ingest.jsonl results.ingest.jsonl
          fi

      - name: Run ${{ inputs.benchmark_name }} benchmark (per-dataset)
        if: inputs.benchmark_id == 'compress-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
        run: |
          python3 scripts/compress-split.py --emit-ingest-records

      - name: Run ${{ inputs.benchmark_name }} benchmark (per-column-encoder)
        if: inputs.benchmark_id == 'string-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
        run: |
          python3 scripts/string-split.py

      # A fork PR's job has no OIDC token, so pr-bench-report.yml reads its baseline.
      - name: Fetch baseline from the benchmarks database
        if: github.event.pull_request.head.repo.fork != true
        uses: ./.github/actions/fetch-bench-baseline
        with:
          role-arn: ${{ vars.GH_BENCH_READ_ROLE_ARN }}
          region: ${{ vars.RDS_BENCH_REGION }}
          endpoint: ${{ vars.RDS_BENCH_INSTANCE_ENDPOINT }}
          database: ${{ vars.RDS_BENCH_DB_NAME }}

      - name: Compare results
        shell: bash
        run: |
          set -Eeu -o pipefail -x

          uv run --no-project scripts/compare-benchmark-jsons.py base.ingest.jsonl results.json \
            "${{ inputs.benchmark_name }}" --pr-records results.ingest.jsonl > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # A fork PR's job has no OIDC token, so pr-bench-report.yml reads its baseline and comments.
      - name: Upload report for pr-bench-report.yml
        if: (success() || failure()) && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        uses: ./.github/actions/upload-fork-bench-report
        with:
          benchmark-name: ${{ inputs.benchmark_name }}
          comment-tag: bench-pr-comment-${{ inputs.benchmark_id }}${{ inputs.variant_id }}
          failed: ${{ job.status == 'failure' }}

      - name: Comment PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3
        with:
          file-path: comment.md
          comment-tag: bench-pr-comment-${{ inputs.benchmark_id }}${{ inputs.variant_id }}

      - name: Comment PR on failure
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3
        with:
          message: |
            # BENCHMARK FAILED

            Benchmark `${{ inputs.benchmark_name }}` failed! Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          comment-tag: bench-pr-comment-${{ inputs.benchmark_id }}${{ inputs.variant_id }}
