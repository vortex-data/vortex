name: Minimize All Fuzz Corpora

concurrency:
  group: fuzz
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 * * 0"  # every Sunday at midnight UTC
  workflow_dispatch: { }

jobs:
  # ============================================================================
  # IO Fuzzer
  # ============================================================================
  io_fuzz_minimize:
    name: "Minimize IO Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: file_io
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  # ============================================================================
  # Array Operations Fuzzer
  # ============================================================================
  ops_fuzz_minimize:
    name: "Minimize Array Ops Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: array_ops
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  ops_unstable_fuzz_minimize:
    name: "Minimize Array Ops (unstable) Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: array_ops
      fuzz_name: array_ops_unstable_encodings
      extra_features: "vortex/unstable_encodings"
      extra_env: "VORTEX_EXPERIMENTAL_PATCHED_ARRAY=1"
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  fsst_like_fuzz_minimize:
    name: "Minimize FSST LIKE Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: fsst_like
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  row_encode_fuzz_minimize:
    name: "Minimize Row Encoding Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: row_encode
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  # ============================================================================
  # Compress Roundtrip Fuzzer
  # ============================================================================
  compress_fuzz_minimize:
    name: "Minimize Compress Roundtrip Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: compress_roundtrip
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}

  # ============================================================================
  # GPU Compress Fuzzer (CUDA)
  # ============================================================================
  gpu_compress_fuzz_minimize:
    name: "Minimize GPU Compress Fuzz Corpus"
    uses: ./.github/workflows/minimize_fuzz_corpus_workflow.yml
    with:
      fuzz_target: compress_gpu
      extra_features: "cuda"
    secrets:
      R2_FUZZ_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
      R2_FUZZ_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
