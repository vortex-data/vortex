# Temporary experiment on ji/runend-ci-comparison; does not publish CodSpeed results.
name: Runend paired comparison

on:
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-avx2
            family: c7i.4xlarge
            image: ubuntu24-full-x64-pre-v2
            rustflags: "-C target-feature=+avx2 -C force-frame-pointers=yes"
          - name: x86-native
            family: c7i.4xlarge
            image: ubuntu24-full-x64-pre-v2
            rustflags: "-C target-cpu=native -C force-frame-pointers=yes"
          - name: arm-native
            family: c8g.4xlarge
            image: ubuntu24-full-arm64-pre-v2
            rustflags: "-C target-cpu=native -C force-frame-pointers=yes"
    name: "Paired runend (${{ matrix.name }})"
    runs-on: >-
      runs-on=${{ github.run_id }}/runner=bench-dedicated/family=${{ matrix.family }}/image=${{ matrix.image }}/extras=s3-cache/tag=runend-${{ matrix.name }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      PR_SHA: cafcf0b351bcf89cee860ed1f9c690d9978e15f9
    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Record environment and materialize the unmodified PR kernel
        run: |
          mkdir -p results encodings/runend/benches/ci_support
          git show "${PR_SHA}:encodings/runend/src/fill.rs" > encodings/runend/benches/ci_support/pr.rs
          lscpu > results/cpu.txt
          rustc -vV > results/rustc.txt
          git diff "$PR_SHA" -- encodings/runend/src/fill.rs > results/candidate.patch
          printenv RUSTFLAGS > results/rustflags.txt
      - name: Build paired native benchmark
        run: |
          cargo bench --locked -p vortex-runend --bench run_end_ci --no-run --message-format=json > results/build.jsonl
          python3 - <<'PY'
          import json, pathlib
          for line in pathlib.Path("results/build.jsonl").read_text().splitlines():
              item = json.loads(line)
              if item.get("target", {}).get("name") == "run_end_ci" and item.get("executable"):
                  pathlib.Path("results/executable.txt").write_text(item["executable"])
          PY
      - name: Check crate tests
        run: cargo test --locked -p vortex-runend --lib
      - name: Measure on one pinned core
        run: |
          cpu=$(python3 -c 'import os; print(sorted(os.sched_getaffinity(0))[-1])')
          taskset -c "$cpu" "$(cat results/executable.txt)" > results/timings.csv
          python3 scripts/runend-ci-summary.py results/timings.csv > results/summary.md
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: runend-${{ matrix.name }}
          path: results/
