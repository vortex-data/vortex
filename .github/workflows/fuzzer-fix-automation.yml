name: Fuzzer Fix Automation

# Distinct from the caller's `fuzzer-fix-<issue>` group: this reusable workflow runs inside the caller's run, so sharing the name would make it cancel its own parent (cancel-in-progress).
concurrency:
  group: fuzzer-fix-automation-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to analyze and fix"
        required: true
        # Use string, not number: a `number` input is rendered as a float in
        # expression interpolation (e.g. `8189` becomes `8189.0`), which breaks
        # `gh issue view`, the fix branch name, and every issue comment.
        type: string
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number to analyze and fix"
        required: true
        # See the workflow_dispatch note above: string avoids the `8189.0`
        # float rendering. The `issues` caller passes
        # `github.event.issue.number`, which coerces cleanly to a string.
        type: string

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13

jobs:
  attempt-fix:
    name: "Attempt to Fix Fuzzer Crash"
    # A called reusable workflow inherits the caller's github.event_name, so the
    # job sees the caller's event, never "workflow_call". Allow each caller:
    # - workflow_dispatch: a manual run of this workflow or of fuzz.yml.
    # - schedule: the in-pipeline attempt-fix-* jobs in fuzz.yml.
    # - issues: fuzzer-issue-autofix.yml.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'issues'

    runs-on: ubuntu-latest
    timeout-minutes: 120

    environment:
      # The GitHub App private key lives only in this environment, so only this
      # job can mint an App installation token. Using the App token (not
      # GITHUB_TOKEN) means the draft PR opened below triggers normal CI.
      name: claude-automation
      deployment: false

    permissions:
      # actions: read is needed for `gh run download` of the crash artifact.
      actions: read
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Don't leave the built-in GITHUB_TOKEN in git config; the fix is
          # committed and pushed with the App token so its PR triggers CI.
          persist-credentials: false

      - name: Fetch issue details
        id: fetch_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          # The issue title and body are untrusted input: a person can edit them at any
          # time before this job reads them. Thus, no script in this workflow contains
          # an Actions expression. Each script gets its data from `env` or from a file,
          # so the shell never parses issue data as code.
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ The issue number must contain only digits"
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body > "$RUNNER_TEMP/issue.json"

          # The body stays in a file and never becomes a step output. A multi-line
          # output lets the body end the output early and add outputs of its own.
          jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue_body.txt"

          # A step output holds one line, so remove the line breaks from the title.
          ISSUE_TITLE=$(jq -r '.title // ""' "$RUNNER_TEMP/issue.json" | tr -d '\r\n')

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "issue_title=$ISSUE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - name: Install llvm
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm

      - uses: ./.github/actions/setup-fuzz-linker

      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@66c9585ef5ca780ee69399975a5e911f47905995
        with:
          tool: cargo-fuzz

      - name: Extract crash details from issue
        id: extract
        shell: bash
        run: |
          # Each value below comes from the untrusted issue body. Validate each value
          # before it becomes a step output, and stop the job if a value is not valid.
          # Do not print a value that failed validation.
          BODY_FILE="$RUNNER_TEMP/issue_body.txt"

          # Use only the first match. More than one match gives a multi-line value,
          # and a multi-line value can add outputs of its own.
          TARGET=$(grep -oP '(?<=\*\*Target\*\*: `)[^`]+' "$BODY_FILE" | head -n 1 || true)
          TARGET="${TARGET:-file_io}"

          CRASH_FILE=$(grep -oP '(?<=\*\*Crash File\*\*: `)[^`]+' "$BODY_FILE" | head -n 1 || true)

          ARTIFACT_URL=$(grep -oP 'https://[^\s]+/artifacts/[0-9]+' "$BODY_FILE" | head -n 1 || true)

          # Later steps do not use the body, so do not keep the untrusted text.
          rm -f "$RUNNER_TEMP/issue.json" "$BODY_FILE"

          # The target must be the name of a fuzz target in this repository.
          if [[ ! "$TARGET" =~ ^[a-z0-9_]+$ ]] || [[ ! -f "fuzz/fuzz_targets/$TARGET.rs" ]]; then
            echo "❌ The target in the issue is not a fuzz target of this repository"
            exit 1
          fi

          # libFuzzer names a crash file `<kind>-<hash>`. The pattern permits no path
          # separator, and the first character cannot be `.` or `-`.
          if [[ ! "$CRASH_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "❌ The issue has no crash file name, or the name is not valid"
            exit 1
          fi

          # The artifact must belong to a workflow run of this repository.
          URL_PREFIX="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          URL_SUFFIX="${ARTIFACT_URL#"$URL_PREFIX"}"

          if [[ "$ARTIFACT_URL" != "$URL_PREFIX"* ]] || [[ ! "$URL_SUFFIX" =~ ^([0-9]+)/artifacts/([0-9]+)$ ]]; then
            echo "❌ The issue has no artifact URL, or the URL is not an artifact of this repository"
            exit 1
          fi

          RUN_ID="${BASH_REMATCH[1]}"
          ARTIFACT_ID="${BASH_REMATCH[2]}"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "crash_file=$CRASH_FILE" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          echo "✅ Extracted: target=$TARGET, crash_file=$CRASH_FILE, run=$RUN_ID, artifact=$ARTIFACT_ID"

      - name: Validate issue details
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          # Check if issue exists and has fuzzer label
          ISSUE_LABELS=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels --jq '.labels[].name')

          if ! echo "$ISSUE_LABELS" | grep -q "fuzzer"; then
            echo "❌ Issue #$ISSUE_NUM does not have 'fuzzer' label"
            exit 1
          fi

          echo "✅ Issue #$ISSUE_NUM has 'fuzzer' label"

      - name: Download and verify crash artifact
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          ARTIFACT_ID: ${{ steps.extract.outputs.artifact_id }}
        run: |
          echo "Downloading artifact $ARTIFACT_ID"

          # Download by artifact ID, not by name. A re-run of the fuzz workflow uploads a
          # second artifact with the same name, and `gh run download --name` then gets the
          # artifact of the latest attempt, which does not contain this crash file.
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/crash-artifact.zip"

          # Extract only the crash file, and never replace a file that exists. The
          # artifact ID comes from the issue, so the archive can be from a different
          # workflow. A full extract into the workspace lets such an archive replace
          # build files, for example `.cargo/config.toml`.
          CRASH_FILE_PATH="$TARGET/$CRASH_FILE"

          if ! unzip -q -n "$RUNNER_TEMP/crash-artifact.zip" "$CRASH_FILE_PATH"; then
            echo "❌ Crash file not found in the artifact: $CRASH_FILE_PATH"
            exit 1
          fi

          rm "$RUNNER_TEMP/crash-artifact.zip"

          # The crash file must be a regular file, not a symbolic link.
          if [ ! -f "$CRASH_FILE_PATH" ] || [ -L "$CRASH_FILE_PATH" ]; then
            echo "❌ Crash file not found: $CRASH_FILE_PATH"
            exit 1
          fi

          echo "✅ Downloaded crash file: $CRASH_FILE_PATH"
          echo "crash_file_path=$CRASH_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build fuzzer target
        id: build
        env:
          TARGET: ${{ steps.extract.outputs.target }}
        run: |
          echo "Building fuzzer target: $TARGET (debug mode for faster build)"

          # Build the fuzzer target in debug mode (faster than release)
          if cargo +$NIGHTLY_TOOLCHAIN fuzz build --dev --sanitizer=none "$TARGET" 2>&1 | tee fuzzer_build.log; then
            echo "✅ Fuzzer target built successfully"
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Fuzzer target failed to build"
            echo "build_success=false" >> $GITHUB_OUTPUT

            # Show the build errors
            echo "Build errors:"
            tail -50 fuzzer_build.log
            exit 1
          fi

      - name: Reproduce crash
        id: reproduce
        continue-on-error: true
        env:
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE_PATH: ${{ steps.download.outputs.crash_file_path }}
        run: |
          echo "Attempting to reproduce crash with fuzzer (debug mode)..."

          # Run fuzzer with crash file (debug mode, no sanitizer, full backtrace)
          RUST_BACKTRACE=full timeout 30s cargo +$NIGHTLY_TOOLCHAIN fuzz run --dev --sanitizer=none "$TARGET" "$CRASH_FILE_PATH" -- -runs=1 -rss_limit_mb=0 2>&1 | tee crash_reproduction.log

          FUZZ_EXIT_CODE=${PIPESTATUS[0]}

          if [ $FUZZ_EXIT_CODE -eq 0 ]; then
            echo "⚠️  Fuzzer did not crash - may have been fixed already"
            echo "crash_reproduced=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Crash reproduced (exit code: $FUZZ_EXIT_CODE)"
            echo "crash_reproduced=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if crash still exists
        if: steps.reproduce.outputs.crash_reproduced == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE_PATH: ${{ steps.download.outputs.crash_file_path }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "## 🤖 Automated Analysis

          I attempted to reproduce this crash but the fuzzer completed successfully without crashing.

          **This likely means the issue has already been fixed.**

          ### Verification Steps

          I ran:
          \`\`\`bash
          cargo +nightly fuzz run --sanitizer=none $TARGET $CRASH_FILE_PATH -- -runs=1 -rss_limit_mb=0
          \`\`\`

          The fuzzer exited with code 0 (success).

          ### Next Steps

          - Verify if a recent commit fixed this issue
          - If confirmed fixed, close this issue
          - If not fixed, the crash may be non-deterministic and requires further investigation"

          echo "Crash could not be reproduced - skipping fix attempt"
          exit 0

      - name: Generate short-lived GitHub App token
        id: app-token
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Attempt to fix crash with Claude
        id: claude
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.fetch_issue.outputs.issue_title }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          CRASH_FILE_PATH: ${{ steps.download.outputs.crash_file_path }}
          ARTIFACT_URL: ${{ steps.extract.outputs.artifact_url }}
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        with:
          # This job runs in the claude-automation environment, so the OIDC subject is
          # `environment:claude-automation`. Only the `vortex-claude-write` rule matches
          # that subject. The `vortex-claude-ci` rule fails the token exchange with 401.
          # The write rule also requires this workflow as `job_workflow_ref`. If you
          # rename this file, update the rule, or the token exchange fails with 401.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_WRITE }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Use the App token (not GITHUB_TOKEN) so the committed fix branch and
          # its draft PR trigger normal pull_request CI workflows.
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          prompt: |
            # Fuzzer crash fix for issue #${{ env.ISSUE_NUMBER }}

            The fuzz target `${{ env.TARGET }}` crashes on the input at
            `${{ env.CRASH_FILE_PATH }}`. The crash is already reproduced, and
            `crash_reproduction.log` has the output with `RUST_BACKTRACE=full`.

            Find the root cause. If the fix is local and clear, such as a missing
            bounds check, missing validation, an unhandled edge case or an off-by-one,
            make the smallest fix and add a regression test that uses the crash input.
            If the fix needs an architecture change or domain knowledge that you do not
            have, do not change the code. Explain the cause and suggest an approach.

            A later step commits your changes to files that git already tracks and
            opens a draft pull request. Thus, do not run git or open a pull request.
            Put the regression test in an existing test file, and put the crash bytes
            in the test itself, because the downloaded crash file is not committed.

            To run the target again, use
            `cargo +$NIGHTLY_TOOLCHAIN fuzz run --dev --sanitizer=none ${{ env.TARGET }} <crash_file> -- -rss_limit_mb=0`.
            The `--dev` flag makes the build faster. Follow `AGENTS.md` and the nested
            `AGENTS.md` files that apply to the code that you change.

            Maintainers review your work on the issue, and the run can stop at the turn
            limit. Thus, post a comment with `gh issue comment ${{ env.ISSUE_NUMBER }}`
            after each stage: after the analysis, after the fix and after the test.
            Each comment must contain the related code in fenced blocks, so that each
            comment is complete without the others. The analysis shows the root cause,
            the crash location and the code at that location. The fix comment shows the
            full changed function or section. The last comment shows the fix, the full
            regression test and the test result, or, if you did not fix the crash, why
            a person must fix it and the approach that you suggest.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(cargo:*),Bash(gh issue comment:*),Bash(gh run download:*),Bash(curl:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(RUST_BACKTRACE=* cargo:*)"

      - name: Verify Claude posted comments
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          # Check for comments from claude-code[bot]
          COMMENT_COUNT=$(gh api "repos/$REPO/issues/$ISSUE_NUM/comments" \
            --jq '[.[] | select(.user.login == "claude-code[bot]" or .user.type == "Bot")] | length')

          if [ "$COMMENT_COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: Claude did not post any comments on issue #$ISSUE_NUM"
            echo "This may indicate Claude encountered an error early on"
            exit 1
          else
            echo "✅ Claude posted $COMMENT_COUNT comment(s) on issue #$ISSUE_NUM"

            # Show summary of what was posted
            echo "Comment titles:"
            gh api "repos/$REPO/issues/$ISSUE_NUM/comments" \
              --jq '.[] | select(.user.login == "claude-code[bot]" or .user.type == "Bot") | "- " + (.body | split("\n") | .[0])'
          fi

      - name: Commit and push fix branch
        id: commit
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.fetch_issue.outputs.issue_title }}
        run: |
          # claude-code-action only auto-creates a branch when it has an issue/PR
          # event to anchor to. This workflow runs via workflow_dispatch /
          # workflow_call, so we commit Claude's edits ourselves. `git add -u`
          # stages only modifications to already-tracked files, which captures the
          # source fix and regression test while ignoring the downloaded crash
          # artifacts, build outputs, and logs this job leaves untracked.
          git config user.name "vortex-claude[bot]"
          git config user.email "274007616+vortex-claude[bot]@users.noreply.github.com"

          git add -u
          # Never commit lockfile churn from the fuzz build.
          git reset -q -- '*Cargo.lock' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No tracked source changes to commit — Claude produced no persistable fix."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="fuzzer-fix/issue-${ISSUE_NUMBER}"
          git checkout -b "$branch"

          crash_desc="${ISSUE_TITLE#Fuzzing Crash: }"
          git commit -s \
            -m "fix(fuzz): $crash_desc (#$ISSUE_NUMBER)" \
            -m "Automated fix for fuzzer issue #$ISSUE_NUMBER."

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/$branch"

          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request for fix branch
        # Only when a fix branch was pushed. The App token ensures the PR triggers
        # normal CI; a draft keeps the fuzzer firehose low-noise until a maintainer
        # marks it ready.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: ${{ steps.commit.outputs.branch }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.fetch_issue.outputs.issue_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_pr="$(
            gh pr list --repo "$REPO" --head "$BRANCH_NAME" --state all \
              --json url --jq '.[0].url // ""'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request already exists: $existing_pr"
            exit 0
          fi

          # Fuzzer issue titles look like "Fuzzing Crash: <variant> in <target>".
          # Drop that prefix so the PR title reads "fix(fuzz): <variant> in <target>"
          # instead of doubling up the "Fuzzing Crash:" wording.
          crash_desc="${ISSUE_TITLE#Fuzzing Crash: }"
          pr_title="fix(fuzz): $crash_desc (#$ISSUE_NUMBER)"

          # Deliberately no "Closes #N": the nightly close-fixed-fuzzer-issues
          # workflow re-runs the crash and closes the issue only once it no longer
          # reproduces, so merging this PR should not close the issue on its own.
          pr_body="$(cat <<EOF
          Automated draft fix for fuzzer issue #$ISSUE_NUMBER.

          - **Target**: \`$TARGET\`
          - **Crash file**: \`$CRASH_FILE\`

          Claude reproduced the crash, applied a minimal fix, and added a regression
          test. The full analysis, diff, and test output are posted on issue
          #$ISSUE_NUMBER.

          This is a **draft**: please review carefully before marking it ready. The
          linked issue is closed automatically by the nightly retest workflow once
          the crash no longer reproduces, so this PR does not close it on merge.

          [View Claude run]($RUN_URL)
          EOF
          )"

          # changelog/fix satisfies the required changelog-label check; create the owned fuzzer-fix label if missing so a fresh repo/fork doesn't error.
          gh label create "fuzzer-fix" --repo "$REPO" \
            --color "b60205" \
            --description "A fix auto-generated from a fuzzer issue" \
            2>/dev/null || true

          pr_url="$(
            gh pr create \
              --repo "$REPO" \
              --draft \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$pr_title" \
              --body "$pr_body" \
              --label "fuzzer-fix" \
              --label "changelog/fix"
          )"
          echo "Created draft pull request: $pr_url"

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "🔀 Opened a draft pull request with the proposed fix: $pr_url"
