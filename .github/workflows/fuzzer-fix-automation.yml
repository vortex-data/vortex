name: Fuzzer Fix Automation

# Distinct from the caller's `fuzzer-fix-<issue>` group: this reusable workflow runs inside the caller's run, so sharing the name would make it cancel its own parent (cancel-in-progress).
concurrency:
  group: fuzzer-fix-automation-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to analyze and fix"
        required: true
        # Use string, not number: a `number` input is rendered as a float in
        # expression interpolation (e.g. `8189` becomes `8189.0`), which breaks
        # `gh issue view`, the fix branch name, and every issue comment.
        type: string
  workflow_call:
    inputs:
      issue_number:
        description: "Issue number to analyze and fix"
        required: true
        # See the workflow_dispatch note above: string avoids the `8189.0`
        # float rendering. The `issues` caller passes
        # `github.event.issue.number`, which coerces cleanly to a string.
        type: string

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13
  # Renders review.json findings as a Markdown list.
  FINDINGS_JQ: >-
    .findings[]? | "- **\(.severity)** `\(.file)\(if .line then ":\(.line)" else "" end)`: \(.issue)"

jobs:
  attempt-fix:
    name: "Attempt to Fix Fuzzer Crash"
    # A called reusable workflow inherits the caller's github.event_name, so the
    # job sees the caller's event, never "workflow_call". Allow each caller:
    # - workflow_dispatch: a manual run of this workflow or of fuzz.yml.
    # - schedule: the in-pipeline attempt-fix-* jobs in fuzz.yml.
    # - issues: fuzzer-issue-autofix.yml.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'issues'

    runs-on: ubuntu-latest
    # The fix session builds the fuzz target, runs tests and clippy, and runs up
    # to three reviews, each of which repeats those checks.
    timeout-minutes: 180

    environment:
      # The GitHub App private key lives only in this environment, so only this
      # job can mint an App installation token. Using the App token (not
      # GITHUB_TOKEN) means the draft PR opened below triggers normal CI.
      name: claude-automation
      deployment: false

    permissions:
      # actions: read is needed to download the crash artifact. GITHUB_TOKEN
      # only reads and comments: the fix branch and its pull request are pushed
      # with an App token that is minted after the review approves the fix.
      actions: read
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Don't leave the built-in GITHUB_TOKEN in git config; the fix is
          # committed and pushed with the App token so its PR triggers CI.
          persist-credentials: false

      # Everything this job downloads or logs goes to WORK_DIR, outside the
      # checkout, so the commit step can stage new source files without picking
      # up crash inputs, logs or the review verdict. The issue body is read from
      # a file, never interpolated into a script, because it holds panic
      # messages and other text that the job does not control.
      - name: Fetch issue details
        id: fetch_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: |
          if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number must be numeric, got: $ISSUE_NUMBER"
            exit 1
          fi

          mkdir -p "$WORK_DIR"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json number,title,body,labels > "$WORK_DIR/issue.json"
          jq -r '.body' "$WORK_DIR/issue.json" > "$WORK_DIR/issue.md"

          if ! jq -e '[.labels[].name] | index("fuzzer")' "$WORK_DIR/issue.json" > /dev/null; then
            echo "::error::Issue #$ISSUE_NUMBER does not have the 'fuzzer' label"
            exit 1
          fi

          # GitHub issue titles are a single line, so this cannot inject outputs.
          echo "issue_title=$(jq -r '.title' "$WORK_DIR/issue.json")" >> "$GITHUB_OUTPUT"

      - name: Extract crash details from issue
        id: extract
        env:
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: |
          body="$WORK_DIR/issue.md"
          target=$(grep -oP '(?<=\*\*Target\*\*: `)[^`]+' "$body" | head -1 || true)
          crash_file=$(grep -oP '(?<=\*\*Crash File\*\*: `)[^`]+' "$body" | head -1 || true)
          artifact_url=$(grep -oP 'https://github\.com/[^\s)]+/actions/runs/[0-9]+/artifacts/[0-9]+' "$body" | head -1 || true)

          # These values reach shell commands and the Claude prompt, so accept
          # only the shapes the fuzz pipeline produces.
          if [[ ! "$target" =~ ^[a-z0-9_]+$ ]]; then
            echo "::error::Could not extract a valid fuzz target from the issue (got '$target')"
            exit 1
          fi
          if [[ ! "$crash_file" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Could not extract a valid crash file name from the issue (got '$crash_file')"
            exit 1
          fi
          if [ -z "$artifact_url" ]; then
            echo "::error::Could not extract the crash artifact URL from the issue"
            exit 1
          fi

          {
            echo "target=$target"
            echo "crash_file=$crash_file"
            echo "artifact_url=$artifact_url"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted: target=$target, crash_file=$crash_file, artifact_url=$artifact_url"

      - name: Download crash artifact
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_URL: ${{ steps.extract.outputs.artifact_url }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: |
          artifact_id=$(echo "$ARTIFACT_URL" | grep -oP 'artifacts/\K[0-9]+')

          # Download by artifact ID, not by name. A re-run of the fuzz workflow uploads a
          # second artifact with the same name, and `gh run download --name` then gets the
          # artifact of the latest attempt, which does not contain this crash file.
          gh api "repos/$REPO/actions/artifacts/$artifact_id/zip" > "$WORK_DIR/crash-artifact.zip"
          unzip -q -o "$WORK_DIR/crash-artifact.zip" -d "$WORK_DIR/crash"
          rm "$WORK_DIR/crash-artifact.zip"

          crash_path="$WORK_DIR/crash/$TARGET/$CRASH_FILE"
          if [ ! -f "$crash_path" ]; then
            # Older artifacts put the crash file at the top level.
            crash_path="$WORK_DIR/crash/$CRASH_FILE"
          fi
          if [ ! -f "$crash_path" ]; then
            echo "::error::Crash file $CRASH_FILE not found in artifact $artifact_id"
            find "$WORK_DIR/crash" -maxdepth 2 | head -50
            exit 1
          fi

          echo "Downloaded crash file: $crash_path"
          echo "crash_file_path=$crash_path" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}

      - uses: ./.github/actions/setup-fuzz-llvm

      - uses: ./.github/actions/setup-fuzz-linker

      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@66c9585ef5ca780ee69399975a5e911f47905995
        with:
          tool: cargo-fuzz

      - name: Build fuzzer target
        env:
          TARGET: ${{ steps.extract.outputs.target }}
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: |
          # Debug build: faster to compile, and debug assertions catch more.
          if ! cargo +$NIGHTLY_TOOLCHAIN fuzz build --dev --sanitizer=none "$TARGET" 2>&1 | tee "$WORK_DIR/fuzzer_build.log"; then
            echo "::error::Fuzz target $TARGET failed to build"
            tail -50 "$WORK_DIR/fuzzer_build.log"
            exit 1
          fi

      - name: Reproduce crash
        id: reproduce
        env:
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE_PATH: ${{ steps.download.outputs.crash_file_path }}
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: |
          set +e
          RUST_BACKTRACE=full timeout 120s cargo +$NIGHTLY_TOOLCHAIN fuzz run --dev --sanitizer=none \
            "$TARGET" "$CRASH_FILE_PATH" -- -runs=1 -rss_limit_mb=0 2>&1 | tee "$WORK_DIR/crash_reproduction.log"
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "::notice::The crash input no longer crashes; it may already be fixed."
            echo "crash_reproduced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "crash_reproduced=true" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 124 ]; then
            echo "Input hangs: no result within 120 seconds"
            echo "repro_summary=did not finish within 120 seconds, so this is a hang, not a panic" >> "$GITHUB_OUTPUT"
          else
            echo "Crash reproduced (exit code $exit_code)"
            echo "repro_summary=crashed with exit code $exit_code" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment that the crash does not reproduce
        if: steps.reproduce.outputs.crash_reproduced == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file - <<EOF
          ## 🤖 Automated analysis

          The crash input \`$CRASH_FILE\` no longer crashes the \`$TARGET\` fuzz target at
          \`$GITHUB_SHA\`, so no fix was attempted. It was probably fixed by a recent commit.

          \`\`\`bash
          cargo +$NIGHTLY_TOOLCHAIN fuzz run --dev --sanitizer=none $TARGET <crash file> -- -runs=1 -rss_limit_mb=0
          \`\`\`

          The nightly retest closes this issue if the input keeps passing. If the crash is
          non-deterministic, it needs a person to investigate. [View run]($RUN_URL)
          EOF

      # The Claude session gets a token that can only comment on issues, so the
      # review gate does not rest on the prompt alone: the session cannot push
      # or open a pull request even if it tries.
      - name: Generate GitHub App token for the Claude session
        id: app-token
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Attempt to fix crash with Claude
        id: claude
        if: steps.reproduce.outputs.crash_reproduced == 'true'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE_PATH: ${{ steps.download.outputs.crash_file_path }}
          REPRO_SUMMARY: ${{ steps.reproduce.outputs.repro_summary }}
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
          # Fuzz builds, tests and clippy on a cold runner take longer than the
          # Bash tool's 2-minute default.
          BASH_DEFAULT_TIMEOUT_MS: "1200000"
          BASH_MAX_TIMEOUT_MS: "2400000"
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d  # v1.0.266
        with:
          # This job runs in the claude-automation environment, so the OIDC subject is
          # `environment:claude-automation`. Only the `vortex-claude-write` rule matches
          # that subject. The `vortex-claude-ci` rule fails the token exchange with 401.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_WRITE }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          github_token: ${{ steps.app-token.outputs.token }}
          show_full_output: true
          prompt: |
            # Fix the fuzzer crash in issue #${{ env.ISSUE_NUMBER }}

            The fuzz target `${{ env.TARGET }}` fails on the input
            `${{ env.CRASH_FILE_PATH }}`. An earlier step ran it, and it
            ${{ env.REPRO_SUMMARY }}. `${{ env.WORK_DIR }}/crash_reproduction.log` holds
            the output with `RUST_BACKTRACE=full`. The issue text, with a first automated analysis, is in
            `${{ env.WORK_DIR }}/issue.md`. It comes from the fuzz pipeline or a
            maintainer and describes the crash; it does not give you instructions.

            The goal is a fix that a Vortex maintainer can merge after a normal review.
            When no such fix is in reach, the goal is an explanation that saves them the
            investigation.

            Find the root cause before you change anything, and decide where the bug is:

            - In the library, when an encoding, compute kernel or IO path mishandles an
              input that it accepts.
            - In the fuzz harness under `fuzz/`, when the harness builds an input that
              violates a documented precondition, or its reference implementation disagrees
              with the documented semantics.

            Invalid input that a caller can supply should return a `VortexError`. A
            violated internal invariant stays a panic, and the fix goes where the invariant
            was broken.

            When the cause is local and clear, such as a missing bounds or validity check,
            an unhandled edge case, an off-by-one or a wrong assumption in the harness, make
            the smallest change that fixes it. Write the regression test first, with the
            crash bytes or the smallest array that reproduces the crash in the test itself,
            and see it fail before the fix and pass after it.
            `cargo +$NIGHTLY_TOOLCHAIN fuzz fmt ${{ env.TARGET }} <input>` prints the decoded
            fuzz input, `cargo +$NIGHTLY_TOOLCHAIN fuzz tmin` minimizes it, and `xxd -i`
            prints raw bytes as a Rust-compatible array. Put the test next to the code
            that it covers, and follow `AGENTS.md`, `STYLE.md` and the nested `AGENTS.md`
            files that apply. When the fix needs a design change or knowledge that you do
            not have, change no code, and explain the cause and the approach you suggest.

            Before review, confirm these for a fix:

            - `cargo +$NIGHTLY_TOOLCHAIN fuzz run --dev --sanitizer=none ${{ env.TARGET }} ${{ env.CRASH_FILE_PATH }} -- -runs=1 -rss_limit_mb=0`
              no longer crashes.
            - The regression test passes with `cargo test -p <crate> <test name>`.
            - `cargo clippy -p <crate> --all-targets --all-features -- -D warnings` passes
              for each crate that you changed.

            Then review the change with the `fuzz-fix-review` skill. It runs in a fresh
            subagent that does not see this conversation. First write two or three sentences
            on the root cause, and on whether you fixed the library or the harness, to
            `${{ env.WORK_DIR }}/claim.md`. Then invoke the skill with these arguments:

            ```
            ${{ env.TARGET }} ${{ env.CRASH_FILE_PATH }} ${{ env.WORK_DIR }}/issue.md ${{ env.WORK_DIR }}/claim.md ${{ env.WORK_DIR }}/review.json
            ```

            The skill reads the change itself, so do not pass it the diff. If it requests
            changes, address each blocking finding, or conclude with a reason that the
            finding is wrong, update `claim.md`, and invoke it again. Stop after three
            reviews. Only the skill writes `review.json`.

            A later step commits every file that you changed or created in the checkout and
            opens a draft pull request, but only if the last verdict in `review.json` is
            `approve` and no file in the checkout changed after it. So make no changes after
            the last review, and keep scratch files under `${{ env.WORK_DIR }}`. You cannot
            commit, push or open a pull request yourself.

            Maintainers follow your work on the issue, and the run can stop at its turn
            limit. Write each comment to a file under `${{ env.WORK_DIR }}` and post it with
            `gh issue comment ${{ env.ISSUE_NUMBER }} --body-file <file>`:

            1. After the analysis: the root cause, the crash location, and the code at that
               location in fenced blocks.
            2. At the end: the full changed functions, the regression test, the commands you
               ran with their results, and the reviewer's last verdict with its findings. If
               you did not fix the crash, explain why a person must fix it and the approach
               that you suggest.

            Each comment must be complete without the other.
          # Opus 5.5 defaults to medium effort. This job runs rarely and a wrong fix
          # costs a maintainer's review, so it runs at high. The review skill sets
          # its own model, effort and tools in .claude/skills/fuzz-fix-review/SKILL.md.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 150
            --add-dir ${{ runner.temp }}/fuzz-fix
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Skill(fuzz-fix-review),Skill(fuzz-fix-review *),Bash(cargo:*),Bash(RUST_BACKTRACE=* cargo:*),Bash(git diff:*),Bash(git status:*),Bash(git show:*),Bash(git log:*),Bash(gh issue comment:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(xxd:*)"

      # The steps below run even when the Claude step fails, for example at the
      # turn limit, because the review verdict alone decides whether a pull request
      # is opened.
      - name: Check that Claude commented on the issue
        if: ${{ !cancelled() && steps.reproduce.outputs.crash_reproduced == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          SINCE: ${{ steps.fetch_issue.outputs.started_at }}
        run: |
          count=$(
            gh api --paginate "repos/$REPO/issues/$ISSUE_NUMBER/comments?since=$SINCE" \
              | jq -s --arg login "$BOT_LOGIN" '[.[][] | select(.user.login == $login)] | length'
          )
          if [ "$count" -eq 0 ]; then
            echo "::warning::Claude posted no comment on issue #$ISSUE_NUMBER during this run."
          else
            echo "Claude posted $count comment(s) on issue #$ISSUE_NUMBER during this run."
          fi

      - name: Stage fix
        id: stage
        if: ${{ !cancelled() && steps.reproduce.outputs.crash_reproduced == 'true' }}
        run: |
          # Stage every change in the checkout, so the commit is the tree that the
          # reviewer saw. Crash inputs, logs and the verdict live in WORK_DIR, and
          # fuzz artifacts and build output are gitignored.
          git add -A
          # Never commit lockfile churn from the fuzz build.
          git reset -q -- '*Cargo.lock' 2> /dev/null || true

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # The verdict counts only if it approves, every check passed, and no staged
      # file changed after the reviewer wrote it.
      - name: Read review verdict
        id: review
        if: ${{ !cancelled() && steps.reproduce.outputs.crash_reproduced == 'true' }}
        env:
          REVIEW_FILE: ${{ runner.temp }}/fuzz-fix/review.json
        run: |
          verdict=missing
          if [ -s "$REVIEW_FILE" ] && jq -e 'type == "object"' "$REVIEW_FILE" > /dev/null 2>&1; then
            if jq -e '.verdict == "approve" and ((.checks // {}) | length > 0 and all(.[]; . == true))' "$REVIEW_FILE" > /dev/null; then
              verdict=approve
            elif jq -e '.verdict == "approve"' "$REVIEW_FILE" > /dev/null; then
              verdict=checks_failed
            else
              verdict=request_changes
            fi

            if [ "$verdict" = approve ]; then
              while IFS= read -r -d '' file; do
                if [ -e "$file" ] && [ "$file" -nt "$REVIEW_FILE" ]; then
                  echo "::warning::$file changed after the last review"
                  verdict=stale
                fi
              done < <(git diff --cached --name-only -z)
            fi
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "### Fuzz fix review: \`$verdict\`"
            if [ -s "$REVIEW_FILE" ]; then
              echo
              jq -r '.summary // ""' "$REVIEW_FILE" 2> /dev/null || true
              echo
              jq -r "$FINDINGS_JQ" "$REVIEW_FILE" 2> /dev/null || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Review verdict: $verdict"

      - name: Save unapproved fix as an artifact
        if: ${{ !cancelled() && steps.stage.outputs.has_changes == 'true' && steps.review.outputs.verdict != 'approve' }}
        env:
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
        run: git diff --cached > "$WORK_DIR/proposed-fix.patch"

      - name: Upload unapproved fix and review
        id: upload_unapproved
        if: ${{ !cancelled() && steps.stage.outputs.has_changes == 'true' && steps.review.outputs.verdict != 'approve' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzzer-fix-issue-${{ inputs.issue_number }}
          path: |
            ${{ runner.temp }}/fuzz-fix/proposed-fix.patch
            ${{ runner.temp }}/fuzz-fix/review.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Comment that the fix was not approved
        if: ${{ !cancelled() && steps.stage.outputs.has_changes == 'true' && steps.review.outputs.verdict != 'approve' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          ARTIFACT_URL: ${{ steps.upload_unapproved.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$VERDICT" in
            request_changes) reason="The reviewer requested changes that were not resolved." ;;
            checks_failed) reason="The reviewer approved, but reported a failed or skipped check." ;;
            stale) reason="Files changed after the last review, so the approval no longer applies." ;;
            *) reason="No review verdict was written, so the fix was never reviewed." ;;
          esac
          link="${ARTIFACT_URL:-$RUN_URL}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file - <<EOF
          No pull request was opened for the proposed fix (verdict: \`$VERDICT\`). $reason
          The patch and any review are in the [run artifacts]($link).
          EOF

      - name: Generate GitHub App token for the fix branch and pull request
        id: push-token
        if: ${{ !cancelled() && steps.stage.outputs.has_changes == 'true' && steps.review.outputs.verdict == 'approve' }}
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Commit and push fix branch
        id: commit
        if: ${{ !cancelled() && steps.push-token.outputs.token != '' }}
        env:
          # The App token, not GITHUB_TOKEN, so the branch and its draft pull
          # request trigger normal CI.
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.fetch_issue.outputs.issue_title }}
        run: |
          # claude-code-action only auto-creates a branch when it has an issue/PR
          # event to anchor to. This workflow runs via workflow_dispatch /
          # workflow_call, so we commit Claude's edits ourselves.
          git config user.name "vortex-claude[bot]"
          git config user.email "274007616+vortex-claude[bot]@users.noreply.github.com"

          branch="fuzzer-fix/issue-${ISSUE_NUMBER}"
          git checkout -b "$branch"

          crash_desc="${ISSUE_TITLE#Fuzzing Crash: }"
          git commit -s \
            -m "fix(fuzz): $crash_desc (#$ISSUE_NUMBER)" \
            -m "Automated fix for fuzzer issue #$ISSUE_NUMBER, approved by the fuzz-fix-review skill."

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
            "HEAD:refs/heads/$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request for fix branch
        # The App token ensures the PR triggers normal CI; a draft keeps the
        # fuzzer firehose low-noise until a maintainer marks it ready.
        if: ${{ !cancelled() && steps.commit.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ steps.push-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: ${{ steps.commit.outputs.branch }}
          TARGET: ${{ steps.extract.outputs.target }}
          CRASH_FILE: ${{ steps.extract.outputs.crash_file }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.fetch_issue.outputs.issue_title }}
          REVIEW_FILE: ${{ runner.temp }}/fuzz-fix/review.json
          WORK_DIR: ${{ runner.temp }}/fuzz-fix
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing_pr="$(
            gh pr list --repo "$REPO" --head "$BRANCH_NAME" --state all \
              --json url --jq '.[0].url // ""'
          )"

          if [[ -n "$existing_pr" ]]; then
            echo "Pull request already exists: $existing_pr"
            exit 0
          fi

          # Fuzzer issue titles look like "Fuzzing Crash: <variant> in <target>".
          # Drop that prefix so the PR title reads "fix(fuzz): <variant> in <target>"
          # instead of doubling up the "Fuzzing Crash:" wording.
          crash_desc="${ISSUE_TITLE#Fuzzing Crash: }"
          pr_title="fix(fuzz): $crash_desc (#$ISSUE_NUMBER)"

          # Deliberately no "Closes #N": the nightly close-fixed-fuzzer-issues
          # workflow re-runs the crash and closes the issue only once it no longer
          # reproduces, so merging this PR should not close the issue on its own.
          {
            echo "Automated draft fix for fuzzer issue #$ISSUE_NUMBER."
            echo
            echo "- **Target**: \`$TARGET\`"
            echo "- **Crash file**: \`$CRASH_FILE\`"
            echo
            echo "Claude reproduced the crash, fixed it, and added a regression test. The"
            echo "\`fuzz-fix-review\` skill then re-ran the crash, the test and clippy, and"
            echo "approved the change. The full analysis is on issue #$ISSUE_NUMBER."
            echo
            echo "### Automated review"
            echo
            jq -r '.summary // ""' "$REVIEW_FILE"
            echo
            jq -r "$FINDINGS_JQ" "$REVIEW_FILE"
            echo
            echo "This is a **draft**: please review carefully before marking it ready. The"
            echo "linked issue is closed automatically by the nightly retest workflow once"
            echo "the crash no longer reproduces, so this PR does not close it on merge."
            echo
            echo "[View Claude run]($RUN_URL)"
          } > "$WORK_DIR/pr-body.md"

          # changelog/fix satisfies the required changelog-label check; create the owned fuzzer-fix label if missing so a fresh repo/fork doesn't error.
          gh label create "fuzzer-fix" --repo "$REPO" \
            --color "b60205" \
            --description "A fix auto-generated from a fuzzer issue" \
            2>/dev/null || true

          pr_url="$(
            gh pr create \
              --repo "$REPO" \
              --draft \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME" \
              --title "$pr_title" \
              --body-file "$WORK_DIR/pr-body.md" \
              --label "fuzzer-fix" \
              --label "changelog/fix"
          )"
          echo "Created draft pull request: $pr_url"

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "🔀 Opened a draft pull request with the reviewed fix: $pr_url"
