name: Vortex Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [develop]
  workflow_dispatch: { }

permissions:
  # Weirdly, we need write permissions to see draft releases.
  # See https://github.com/cli/cli/issues/3037
  contents: write

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml

  web:
    name: Build Explorer
    permissions:
      contents: read
    uses: ./.github/workflows/web-build.yml

  # One Vercel project serves the docs and the Explorer.
  deploy:
    name: Deploy to Vercel
    needs: [build, web]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-vercel.yml
    # A called workflow only sees the secrets its caller passes, including
    # the secrets of the environment the called job deploys to.
    secrets: inherit
    with:
      environment: vercel-docs
      artifact-ids: ${{ needs.build.outputs.artifact-id }},${{ needs.web.outputs.artifact-id }}
      config: docs/vercel-output-config.json
      pages-html-handling: true
      production: ${{ github.ref == 'refs/heads/develop' }}
