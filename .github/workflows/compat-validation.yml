name: Compat Validation

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 6am UTC
  workflow_call:
    inputs:
      mode:
        description: "Validation mode"
        required: true
        default: "all"
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: "Validation mode"
        required: true
        default: "last"
        type: choice
        options:
          - last
          - all

jobs:
  compat-test:
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=compat-validation', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}
      - name: Run compat tests
        run: |
          MODE="${{ inputs.mode || 'last' }}"
          uv run vortex-test/compat-gen/scripts/compat.py check \
            --mode "$MODE"
