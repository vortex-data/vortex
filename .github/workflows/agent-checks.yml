name: Agent Checks

# Periodic agent-driven code checks. Each check is `.agents/checks/<id>/CHECK.md`; the runner is
# `scripts/agent_checks.py`. `.agents/checks/README.md` documents the whole system.
#
# Jobs
# - plan: reads each check's state from S3 and the repository's PRs and issues, picks the crates
#   that need review (new or changed files, rubric version bumps) for every check that is due,
#   and emits one matrix entry per check.
# - review: agent-checks-review.yml, called once per check; checks run in parallel. It reviews the
#   check's crates one after another through agent-checks-shard.yml, which runs the agent on one
#   runner and publishes from a separate, fresh runner.
# - record: merges the published shards' reviews, rejected findings and `last_run` into each
#   check's `state.json` with compare-and-swap, and archives the run under the check's `runs/`.
#
# Fault tolerance: a shard that fails or times out records nothing and is offered again on the
# next run; the other shards are unaffected. A partial results file still records the files the
# agent finished. One check's state failing does not stop the other checks.
#
# Setup (see the README): the `claude-automation` environment, the GitHub App secrets, the
# `CLAUDE_APP_LOGIN` variable and the Anthropic variables that fuzzer-fix-automation.yml uses. The
# `vortex-claude-write` federation rule must allow agent-checks-shard.yml as `job_workflow_ref`.
# State lives in S3: set AGENT_CHECKS_STATE_URI (s3://bucket/prefix), AGENT_CHECKS_AWS_ROLE_ARN and,
# optionally, AGENT_CHECKS_AWS_REGION. Only the plan and record jobs below assume that role; they
# run without an environment, so their OIDC subject is `repo:<repo>:ref:refs/heads/develop`, which
# the agent's job (subject `...:environment:claude-automation`) never has.

on:
  # TEMPORARY: dry-run trial of a few shards on the PR that adds this workflow. Remove before merging.
  pull_request:
    paths:
      - ".github/workflows/agent-checks*.yml"
      - "scripts/agent_checks.py"
      - ".agents/checks/**"
  schedule:
    # Weekly, Mondays. A check also waits for its `cadence_days`, so one with a longer cadence
    # skips some weeks.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      check:
        description: "Check id (empty: all enabled checks)"
        required: false
        type: string
      shard:
        description: "Only this crate, e.g. vortex-array"
        required: false
        type: string
      max_shards:
        description: "Override max_shards_per_run"
        required: false
        type: string
      force:
        description: "Ignore cadence_days"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Review and report in the job summary only: no PRs, issues or state"
        required: false
        type: boolean
        default: false

concurrency:
  # Overlapping runs would plan the same crates. State writes are compare-and-swap either way.
  # The temporary PR trial gets its own group, so it never displaces a scheduled run.
  group: agent-checks-${{ github.event_name == 'pull_request' && 'trial' || 'main' }}
  cancel-in-progress: false

permissions: { }

env:
  # s3://bucket/prefix; each check's state is <prefix>/<check>/state.json.
  STATE: ${{ vars.AGENT_CHECKS_STATE_URI }}
  TRUSTED_AUTHOR: ${{ vars.CLAUDE_APP_LOGIN }}
  PR_LABEL: agent-checks
  DRY_RUN: ${{ inputs.dry_run == true || github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    # TEMPORARY: only the same-repository PR that adds this workflow runs the trial.
    if: >-
      github.event_name != 'pull_request' || (
        github.head_ref == 'ji/quirky-curie-docl3a' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      # The state store's AWS role.
      id-token: write
    outputs:
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Check the configuration
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'develop' }}
        run: |
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Only dry runs may start from $GITHUB_REF_NAME: PRs and state must come from $DEFAULT_BRANCH."
            exit 1
          fi
          if [[ -z "$TRUSTED_AUTHOR" && "$DRY_RUN" != "true" ]]; then
            echo "::error::Set the CLAUDE_APP_LOGIN variable: only that login's markers are trusted."
            exit 1
          fi
          if [[ -n "$STATE" ]]; then
            echo "STATE_SPEC=$STATE" >> "$GITHUB_ENV"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::AGENT_CHECKS_STATE_URI is not set; this dry run plans from empty state."
            echo "STATE_SPEC=$RUNNER_TEMP/empty-state" >> "$GITHUB_ENV"
          else
            echo "::error::Set the AGENT_CHECKS_STATE_URI variable (s3://bucket/prefix)."
            exit 1
          fi

      - name: Configure AWS credentials for the state store
        if: vars.AGENT_CHECKS_STATE_URI != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AGENT_CHECKS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_CHECKS_AWS_REGION || 'us-east-1' }}

      - name: List pull requests and issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Open PRs are listed regardless of label: their branch names mark the crates in use.
          # Authors are listed so that only the App's own markers are trusted.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,state,body,mergedAt,headRefName,author,isCrossRepository > open-prs.json
          gh pr list --repo "$GITHUB_REPOSITORY" --label "$PR_LABEL" --state closed --limit 500 \
            --json number,state,body,mergedAt,headRefName,author,isCrossRepository > closed-prs.json
          gh issue list --repo "$GITHUB_REPOSITORY" --label "$PR_LABEL" --state closed --limit 500 \
            --json number,state,stateReason,body,author,comments > closed-issues.json
          jq -s 'add' open-prs.json closed-prs.json closed-issues.json > github.json

      - name: Plan
        id: plan
        env:
          CHECK: ${{ inputs.check }}
          SHARD: ${{ inputs.shard }}
          MAX_SHARDS: ${{ inputs.max_shards }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(plan --state "$STATE_SPEC" --github github.json --out plan.json)
          [[ -n "$TRUSTED_AUTHOR" ]] && args+=(--trusted-author "$TRUSTED_AUTHOR")
          [[ -n "$CHECK" ]] && args+=(--check "$CHECK")
          [[ -n "$SHARD" ]] && args+=(--shard "$SHARD")
          [[ -n "$MAX_SHARDS" ]] && args+=(--max-shards "$MAX_SHARDS")
          [[ "$FORCE" == "true" ]] && args+=(--force)
          # Only scheduled runs move a check's weekly clock.
          [[ "$EVENT" == "schedule" ]] && args+=(--scheduled)
          if [[ "$EVENT" == "pull_request" ]]; then
            # TEMPORARY trial: two small crates for each check.
            args+=(--force --shard vortex-compute --shard vortex-mask --max-shards 2)
          fi
          python3 scripts/agent_checks.py "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: agent-checks-plan
          path: |
            plan.json
            github.json

  review:
    name: "Review ${{ matrix.check }}"
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      # Checks run in parallel; within a check, crates run one at a time.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
    # A called workflow gets no more than these.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/agent-checks-review.yml
    with:
      check: ${{ matrix.check }}
      shards: ${{ matrix.shards }}
      dry_run: ${{ inputs.dry_run == true || github.event_name == 'pull_request' }}
    secrets: inherit

  record:
    name: Record state
    needs: [plan, review]
    # Record whatever finished, including after partial review failures. Shards that failed hand
    # over no state update and are offered again next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.dry_run != true && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: agent-checks-plan
          path: plan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: agent-checks-state-*
          path: updates
          merge-multiple: true

      - name: Configure AWS credentials for the state store
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AGENT_CHECKS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_CHECKS_AWS_REGION || 'us-east-1' }}

      - name: Record
        run: |
          shopt -s nullglob
          # Compare-and-swap per check document, retried on conflict. A failure for one check is
          # reported at the end, after every other check is recorded.
          python3 scripts/agent_checks.py record --state "$STATE" --trusted-author "$TRUSTED_AUTHOR" \
            --plan plan/plan.json --github plan/github.json updates/*.json

      # One directory per artifact under archive/, each tagged with its check and shard by meta.json.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: ${{ !cancelled() }}
        with:
          pattern: agent-checks-agent-*
          path: archive

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: ${{ !cancelled() }}
        with:
          pattern: agent-checks-out-*
          path: archive

      - name: Archive the run
        # Write-once records under <prefix>/<check>/runs/<run>/, so a re-run never rewrites history.
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          python3 scripts/agent_checks.py archive --state "$STATE" --plan plan/plan.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" archive/*/
