name: Agent Checks

# Periodic agent-driven code checks. Each check is `.agents/checks/<id>/CHECK.md`; the runner is
# `scripts/agent_checks.py`. See `.agents/checks/README.md`.
#
# Jobs
# - plan: reads the state branch and the PR list, picks the crates that need review (new or
#   changed files, rubric version bumps) for every check whose `cadence_days` has passed, and
#   emits one matrix entry per (check, crate).
# - review: agent-checks-review.yml, called once per check, all checks in parallel. Within a
#   check, shards (crates) run one after another, each on its own runner. Claude reviews the
#   assigned files and writes a results file.
#   The runner validates it, reverts edits outside the shard's scope, compiles the edits with the
#   check's `verify` commands. Then, on its own and from live GitHub state, it decides whether to
#   open a draft PR, add new findings to the shard's issue, or publish nothing, deduplicating
#   findings against open agent PRs and issues.
# - record: merges the published shards' reviews, the rejected findings and `last_run` into the
#   state store, with compare-and-swap.
#
# Fault tolerance: a shard that fails or times out records nothing and is offered again on the
# next run; the other shards are unaffected. A partial results file still records the files the
# agent finished. State writes are compare-and-swap on the S3 object's ETag and retry on conflict.
#
# Setup: the same `claude-automation` environment, App secrets and Anthropic variables as
# fuzzer-fix-automation.yml. The `vortex-claude-write` federation rule must also allow the reusable
# review workflow as `job_workflow_ref`
# (vortex-data/vortex/.github/workflows/agent-checks-review.yml@refs/heads/develop); otherwise the
# agent's token exchange fails with 401. State lives in S3: set the variables
# AGENT_CHECKS_STATE_URI (s3://bucket/prefix), AGENT_CHECKS_AWS_ROLE_ARN (a role this repository's
# OIDC token can assume, with s3:GetObject, s3:PutObject and s3:ListBucket on that prefix) and,
# optionally, AGENT_CHECKS_AWS_REGION. Turn on bucket versioning to keep the history. The role's
# trust policy should admit only this file as `job_workflow_ref`: agents run in
# agent-checks-review.yml, which can then never write the state.

on:
  # TEMPORARY: dry-run trial of a few shards on the PR that adds this workflow. Remove before merging.
  pull_request:
    paths: [".github/workflows/agent-checks.yml", "scripts/agent_checks.py", ".agents/checks/**"]
  schedule:
    # Weekly, Mondays. A check also waits for its `cadence_days`, so one with a longer cadence
    # skips some weeks.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      check:
        description: "Check id (empty: all enabled checks)"
        required: false
        type: string
      shard:
        description: "Only this crate, e.g. vortex-array"
        required: false
        type: string
      max_shards:
        description: "Override max_shards_per_run"
        required: false
        type: string
      force:
        description: "Ignore cadence_days"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Review and report in the job summary only: no PRs, no state update"
        required: false
        type: boolean
        default: false

concurrency:
  # Overlapping runs would plan the same crates. State writes are compare-and-swap either way.
  group: agent-checks
  cancel-in-progress: false

permissions: { }

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13
  # s3://bucket/prefix; each check's state is <prefix>/<check>/state.json.
  STATE: ${{ vars.AGENT_CHECKS_STATE_URI }}
  PR_LABEL: agent-checks
  DRY_RUN: ${{ inputs.dry_run == true || github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    # TEMPORARY: only the PR that adds this workflow runs the trial.
    if: github.event_name != 'pull_request' || github.head_ref == 'ji/quirky-curie-docl3a'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      # The state store's AWS role.
      id-token: write
    outputs:
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Refuse non-dry runs off the default branch
        if: env.DRY_RUN != 'true' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Only dry runs may start from $GITHUB_REF_NAME: PRs and state must come from the default branch."
          exit 1

      - name: Configure AWS credentials for the state store
        if: vars.AGENT_CHECKS_STATE_URI != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AGENT_CHECKS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_CHECKS_AWS_REGION || 'us-east-1' }}

      - name: Choose the state store
        run: |
          if [[ -n "$STATE" ]]; then
            echo "STATE_SPEC=$STATE" >> "$GITHUB_ENV"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::AGENT_CHECKS_STATE_URI is not set; this dry run plans from empty state."
            echo "STATE_SPEC=$RUNNER_TEMP/empty-state" >> "$GITHUB_ENV"
          else
            echo "::error::Set the AGENT_CHECKS_STATE_URI variable (s3://bucket/prefix)."
            exit 1
          fi

      - name: List agent-check pull requests and issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Open PRs are listed regardless of label: their branch names mark the crates in use.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,state,body,mergedAt,headRefName > open-prs.json
          gh pr list --repo "$GITHUB_REPOSITORY" --label "$PR_LABEL" --state closed --limit 500 \
            --json number,state,body,mergedAt,headRefName > closed-prs.json
          gh issue list --repo "$GITHUB_REPOSITORY" --label "$PR_LABEL" --state closed --limit 500 \
            --json number,state,stateReason,body,comments > closed-issues.json
          jq -s 'add' open-prs.json closed-prs.json closed-issues.json > github.json

      - name: Plan
        id: plan
        env:
          CHECK: ${{ inputs.check }}
          SHARD: ${{ inputs.shard }}
          MAX_SHARDS: ${{ inputs.max_shards }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(plan --state "$STATE_SPEC" --github github.json --out plan.json)
          [[ -n "$CHECK" ]] && args+=(--check "$CHECK")
          [[ -n "$SHARD" ]] && args+=(--shard "$SHARD")
          [[ -n "$MAX_SHARDS" ]] && args+=(--max-shards "$MAX_SHARDS")
          [[ "$FORCE" == "true" ]] && args+=(--force)
          if [[ "$EVENT" == "pull_request" ]]; then
            # TEMPORARY trial: two small crates for each check.
            args+=(--force --shard vortex-compute --shard vortex-mask --max-shards 2)
          fi
          python3 scripts/agent_checks.py "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: agent-checks-plan
          path: |
            plan.json
            github.json

  review:
    name: "Review ${{ matrix.check }}"
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      # Checks run in parallel; within a check, the reusable workflow runs one crate at a time.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.check_matrix) }}
    # A called workflow gets no more than these.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/agent-checks-review.yml
    with:
      check: ${{ matrix.check }}
      shards: ${{ matrix.shards }}
      dry_run: ${{ inputs.dry_run == true || github.event_name == 'pull_request' }}
    secrets: inherit

  record:
    name: Record state
    needs: [plan, review]
    # Record whatever finished, including after partial review failures. Shards that failed hand
    # over no state update and are offered again next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.dry_run != true && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: agent-checks-plan
          path: plan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: agent-checks-state-*
          path: updates
          merge-multiple: true

      - name: Configure AWS credentials for the state store
        if: vars.AGENT_CHECKS_STATE_URI != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.AGENT_CHECKS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AGENT_CHECKS_AWS_REGION || 'us-east-1' }}

      - name: Record
        run: |
          shopt -s nullglob
          # Compare-and-swap per check document, retried on conflict, so overlapping writers
          # never lose each other's updates.
          python3 scripts/agent_checks.py record --state "$STATE" \
            --plan plan/plan.json --github plan/github.json updates/*.json
