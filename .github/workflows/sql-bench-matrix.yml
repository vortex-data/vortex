name: SQL Benchmark Matrix

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      matrix_preset:
        required: true
        type: string
        description: "Named benchmark matrix to run"
      machine_type:
        required: false
        type: string
        default: c8gd.metal-24xl

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      benchmark_matrix: ${{ steps.resolve.outputs.benchmark_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false
      - name: Resolve benchmark matrix
        id: resolve
        shell: bash
        env:
          MATRIX_PRESET: ${{ inputs.matrix_preset }}
        run: |
          set -Eeuo pipefail

          matrix="$(uv run --project bench-orchestrator vx-bench matrix "$MATRIX_PRESET" | python3 -c 'import json,sys; print(json.dumps((lambda rows: [dict(x, id="tpcds-nvme-"+str(sf), name="TPC-DS SF="+str(sf)+" on NVME", scale_factor=float(sf)) for x in rows if x["id"] == "tpcds-nvme" for sf in (10,30)] + [x for x in rows if x["id"] == "clickbench-nvme"])(json.load(sys.stdin))))')"
          echo "benchmark_matrix=$matrix" >> "$GITHUB_OUTPUT"

  bench:
    needs: [resolve-matrix]
    timeout-minutes: 120
    env:
      FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
      # Makes python output nicer
      COLUMNS: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.benchmark_matrix) }}

    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=bench-dedicated/family={1}/image=ubuntu24-full-arm64-pre-v2/tag={2}{3}', github.run_id, inputs.machine_type, matrix.id, (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ inputs.mode == 'pr' && '0' || '1' }}
      - uses: ./.github/actions/setup-prebuild
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-sccache: ${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && 'true' || 'false' }}
      - name: Install uv
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false

      - name: Install DuckDB
        uses: ./.github/actions/setup-duckdb

      - uses: ./.github/actions/system-info

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: bench-binaries
          run-id: 40607756797
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/release_debug/
      - name: Make binaries executable
        shell: bash
        run: chmod +x target/release_debug/*

      - name: Generate data
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          uv run --project bench-orchestrator vx-bench prepare-data "${{ matrix.subcommand }}" \
            --formats-json '${{ toJSON(matrix.data_formats) }}' \
            ${{ matrix.scale_factor && format('--opt scale-factor={0}', matrix.scale_factor) || '' }}

      - name: Setup benchmark environment
        run: sudo bash scripts/setup-benchmark.sh

      - name: Download published scan baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: bench-binaries
          run-id: 40604183269
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/coarse-baseline

      - name: Make coarse baseline executable
        run: chmod +x target/coarse-baseline/datafusion-bench

      - name: Repeat retained file handle guards
        shell: bash
        env:
          TOKIO_WORKER_THREADS: "8"
          DATAFUSION_EXECUTION_TARGET_PARTITIONS: "8"
          RUST_LOG: warn
        run: python3 scripts/profile-coarse-scans.py "${{ matrix.scale_factor }}"

      - name: Upload scan comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scan-filehandle-repeat-${{ matrix.id }}
          path: scan-*

