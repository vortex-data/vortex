name: SQL Benchmark Matrix

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      matrix_preset:
        required: true
        type: string
        description: "Named benchmark matrix to run"
      benchmarks:
        required: false
        type: string
        default: ""
        description: "Benchmarks to keep from the preset, each optionally with queries (tpch-nvme:q1-4); empty runs all of it"
      pr_number:
        required: false
        type: string
        default: ""
        description: "PR to comment on, for runs without a pull_request event; empty uses the event's PR"
      machine_type:
        required: false
        type: string
        default: c8gd.metal-24xl

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      benchmark_matrix: ${{ steps.resolve.outputs.benchmark_matrix }}
      comment_groups: ${{ steps.resolve.outputs.comment_groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false
      - name: Resolve benchmark matrix
        id: resolve
        shell: bash
        env:
          MATRIX_PRESET: ${{ inputs.matrix_preset }}
          BENCHMARKS: ${{ inputs.benchmarks }}
        run: |
          set -Eeuo pipefail

          matrix="$(uv run --project bench-orchestrator vx-bench matrix "$MATRIX_PRESET" --only "$BENCHMARKS")"
          echo "benchmark_matrix=$matrix" >> "$GITHUB_OUTPUT"
          # A case runs as one entry per scan when it covers every scan; its PR comment collects
          # the entries of its `group` into one table. A run of some queries comments separately.
          groups="$(jq -c '[group_by(.group)[] | {group: .[0].group, name: .[0].group_name, ids: map(.id), queries: (.[0].queries // "")}]' <<<"$matrix")"
          echo "comment_groups=$groups" >> "$GITHUB_OUTPUT"

  build:
    timeout-minutes: 60
    env:
      FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-bench/tag=build{1}', github.run_id, (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
      - parallel:
          - uses: ./.github/actions/assert-cpu
            if: github.repository == 'vortex-data/vortex'
          - uses: ./.github/actions/setup-prebuild
            with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              enable-sccache: ${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && 'true' || 'false' }}
      - name: Build binaries
        shell: bash
        env:
          RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
        run: |
          packages=(--bin data-gen --bin datafusion-bench --bin duckdb-bench --bin vx)
          if [ "${{ inputs.mode }}" != "pr" ]; then
            packages+=(--bin lance-bench)
          fi
          cargo build "${packages[@]}" --profile release_debug
      # upload-artifact would zip these with single-threaded zlib, which took 89s. Multi-threaded
      # zstd is much faster, and the tar keeps the executable bits.
      - name: Package binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target/release_debug
          files=(data-gen datafusion-bench duckdb-bench vx)
          # lance-bench is not built for PRs.
          if [ -f lance-bench ]; then
            files+=(lance-bench)
          fi
          # duckdb-bench loads libduckdb.so through an absolute rpath into vortex-duckdb's build
          # cache, so it must be unpacked at the same path. That cache sits two levels above the
          # build script's OUT_DIR, and the cargo build-dir layout decides where that is: search
          # for it rather than hard-code it.
          mapfile -t libduckdb < <(find build -path '*/vortex-duckdb-cache/duckdb-lib-*/libduckdb.so')
          if [ "${#libduckdb[@]}" -eq 0 ]; then
            echo "::error::libduckdb.so not found under target/release_debug/build"
            exit 1
          fi
          files+=("${libduckdb[@]}")
          tar -I 'zstd -T0 -3' -cf "$GITHUB_WORKSPACE/bench-binaries.tar.zst" "${files[@]}"
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: bench-binaries
          path: bench-binaries.tar.zst
          compression-level: 0
          if-no-files-found: error

  # The debuginfo upload takes several minutes. Running it in its own job keeps it off the path
  # to the bench jobs; Polar Signals matches debuginfo to profiles by build ID whenever it lands.
  upload-debuginfo:
    needs: build
    if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-medium/image=ubuntu26-full-arm64-pre-v2/extras=s3-cache/tag=upload-debuginfo', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          # Wires up the RunsOn artifact proxy that download-artifact uses.
          - uses: runs-on/action@v2
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: bench-binaries
      - name: Unpack binaries
        shell: bash
        run: |
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          mkdir -p target/release_debug
          tar -C target/release_debug --zstd -xf bench-binaries.tar.zst
          rm bench-binaries.tar.zst
      - name: Pre-upload SQL benchmark debuginfo to Polar Signals
        uses: ./.github/actions/upload-parca-debuginfo
        continue-on-error: true
        with:
          paths: |
            target/release_debug/datafusion-bench
            target/release_debug/duckdb-bench
            ${{ inputs.mode != 'pr' && 'target/release_debug/lance-bench' || '' }}
          polarsignals-cloud-token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
          project-id: "e5d846e1-b54c-46e7-9174-8bf055a3af56"

  bench:
    needs: [resolve-matrix, build]
    timeout-minutes: 120
    env:
      FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
      # Makes python output nicer
      COLUMNS: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.benchmark_matrix) }}

    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=bench-dedicated/family={1}/image=ubuntu26-full-arm64-pre-v2/tag={2}{3}', github.run_id, inputs.machine_type, matrix.id, (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }}
              fetch-depth: ${{ inputs.mode == 'pr' && '0' || '1' }}
      # Everything data generation needs is independent, so install it all at once.
      - parallel:
          - uses: ./.github/actions/setup-prebuild
            with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              enable-sccache: ${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && 'true' || 'false' }}
          - name: Install uv
            uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
            with:
              sync: false
          - name: Install DuckDB
            uses: ./.github/actions/setup-duckdb
          - uses: ./.github/actions/system-info
          - name: Download binaries
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
            with:
              name: bench-binaries
          - name: Setup AWS CLI
            if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
            with:
              role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
              aws-region: us-east-1
              # Expand session window, otherwise some large scale runs time out.
              role-duration-seconds: 7200

      - name: Unpack binaries
        shell: bash
        run: |
          command -v zstd >/dev/null || { sudo apt-get update && sudo apt-get install -y zstd; }
          mkdir -p target/release_debug
          tar -C target/release_debug --zstd -xf bench-binaries.tar.zst
          rm bench-binaries.tar.zst

      # Base data that vx-bench caches (statpopgen, sorted ClickBench) is restored
      # from, or saved to, an S3 cache. Fork PRs have no AWS credentials and always regenerate.
      - name: Generate data
        shell: bash
        env:
          AWS_REGION: "us-east-1"
          RUST_BACKTRACE: full
          S3_CACHE: ${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && 's3://vortex-ci-benchmark-datasets/data-gen-cache/' || '' }}
        run: |
          uv run --project bench-orchestrator vx-bench prepare-data "${{ matrix.subcommand }}" \
            --formats-json '${{ toJSON(matrix.data_formats) }}' \
            ${S3_CACHE:+--s3-cache "$S3_CACHE"} \
            ${{ matrix.row_group_rows && format('--opt row-group-rows={0}', matrix.row_group_rows) || '' }} \
            ${{ matrix.scale_factor && format('--opt scale-factor={0}', matrix.scale_factor) || '' }}

      # setup-benchmark.sh pins every running process to the housekeeping CPUs, so it waits for
      # the upload rather than throttling it.
      - parallel:
          - name: Upload data
            if: matrix.remote_key != null && (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false)
            shell: bash
            env:
              AWS_REGION: "us-east-1"
              REMOTE_STORAGE: "s3://vortex-ci-benchmark-datasets/${{ github.ref_name }}/${{ github.run_id }}/${{ inputs.matrix_preset }}/${{ matrix.remote_key }}/"
            run: |
              aws s3 rm --recursive "$REMOTE_STORAGE"
              aws s3 cp --recursive "${{ matrix.local_dir }}" "$REMOTE_STORAGE"
          - name: Setup Polar Signals
            if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
            uses: polarsignals/gh-actions-ps-profiling@cd2cb45af81fbe1ca629c2ac479348207598160e  # v0.9.0
            # Profiling is observability only, so a flaky agent download must not fail the benchmark.
            continue-on-error: true
            with:
              polarsignals_cloud_token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
              labels: "branch=${{ github.ref_name }};gh_run_id=${{ github.run_id }};commit_sha=${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }};benchmark=${{ matrix.id }}"
              project_uuid: "e5d846e1-b54c-46e7-9174-8bf055a3af56"
              job_name: "${{ matrix.id }}"
              profiling_frequency: 199
              extra_args: "--debuginfo-strip=false"
              parca_agent_version: "0.49.0"

      - name: Setup benchmark environment
        run: sudo bash scripts/setup-benchmark.sh

      # The run steps pass the same row groups as "Generate data". A fork PR runs an S3 entry
      # here, on local data, and a benchmark that expects other row groups removes that data.
      - name: Run ${{ matrix.name }} benchmark
        if: matrix.remote_key == null || github.event.pull_request.head.repo.fork == true
        shell: bash
        env:
          OTEL_SERVICE_NAME: "vortex-bench"
          OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
          OTEL_EXPORTER_OTLP_ENDPOINT: "${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}"
          OTEL_EXPORTER_OTLP_HEADERS: "${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}"
          OTEL_RESOURCE_ATTRIBUTES: "bench-name=${{ matrix.id }}"
        run: |
          bash scripts/bench-taskset.sh uv run --project bench-orchestrator vx-bench run "${{ matrix.subcommand }}" \
            --targets-json '${{ toJSON(matrix.targets) }}' \
            --output results.json \
            --ingest-jsonl results.ingest.jsonl \
            --no-build \
            ${{ matrix.iterations && format('--iterations {0}', matrix.iterations) || '' }} \
            ${{ matrix.queries && format('--queries {0}', matrix.queries) || '' }} \
            ${{ matrix.row_group_rows && format('--opt row-group-rows={0}', matrix.row_group_rows) || '' }} \
            ${{ matrix.scale_factor && format('--opt scale-factor={0}', matrix.scale_factor) || '' }}

      - name: Run ${{ matrix.name }} benchmark (remote)
        if: matrix.remote_key != null && (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false)
        shell: bash
        env:
          AWS_REGION: "us-east-1"
          OTEL_SERVICE_NAME: "vortex-bench"
          OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
          OTEL_EXPORTER_OTLP_ENDPOINT: "${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && secrets.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}"
          OTEL_EXPORTER_OTLP_HEADERS: "${{ (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && secrets.OTEL_EXPORTER_OTLP_HEADERS || '' }}"
          OTEL_RESOURCE_ATTRIBUTES: "bench-name=${{ matrix.id }}"
          REMOTE_STORAGE: "s3://vortex-ci-benchmark-datasets/${{ github.ref_name }}/${{ github.run_id }}/${{ inputs.matrix_preset }}/${{ matrix.remote_key }}/"
        run: |
          bash scripts/bench-taskset.sh uv run --project bench-orchestrator vx-bench run "${{ matrix.subcommand }}" \
            --targets-json '${{ toJSON(matrix.targets) }}' \
            --output results.json \
            --ingest-jsonl results.ingest.jsonl \
            --no-build \
            ${{ matrix.iterations && format('--iterations {0}', matrix.iterations) || '' }} \
            ${{ matrix.queries && format('--queries {0}', matrix.queries) || '' }} \
            ${{ matrix.row_group_rows && format('--opt row-group-rows={0}', matrix.row_group_rows) || '' }} \
            --opt remote-data-dir="$REMOTE_STORAGE" \
            ${{ matrix.scale_factor && format('--opt scale-factor={0}', matrix.scale_factor) || '' }}

      # Formats that no query reads, written after the queries so they cannot affect them, only
      # for the file sizes that "Capture file sizes" records.
      - name: Write size-only formats
        if: matrix.remote_key == null && matrix.records_data && join(matrix.size_formats, ',') != ''
        shell: bash
        run: |
          uv run --project bench-orchestrator vx-bench write-size-formats "${{ matrix.subcommand }}" \
            --formats-json '${{ toJSON(matrix.size_formats) }}' \
            ${{ matrix.scale_factor && format('--opt scale-factor={0}', matrix.scale_factor) || '' }}

      # The `file_size` records join the run's ingest records: develop runs store them in the
      # benchmarks database (the `file_sizes` table), and PR runs fetch them back as the baseline.
      - parallel:
          # Every entry of a case generates the same data, so only the case's default entry records it.
          - name: Capture file sizes
            if: matrix.remote_key == null && matrix.records_data
            shell: bash
            run: |
              uv run --no-project scripts/capture-file-sizes.py \
                vortex-bench/data \
                --benchmark ${{ matrix.subcommand }} \
                --dataset-dir ${{ matrix.dataset_dir }} \
                --commit ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }} \
                -o sizes.json \
                --ingest-jsonl sizes.ingest.jsonl
              cat sizes.json >> results.json
              cat sizes.ingest.jsonl >> results.ingest.jsonl
          # Footer stats and layout trees of a sample of the dataset's Vortex files: every file is
          # dumped, then one file of every table is kept, plus more partitions weighted by size up to a
          # line budget. Observability only, so it never fails the benchmark or holds up its job.
          - name: Dump sampled file trees
            if: ${{ !cancelled() && matrix.remote_key == null && matrix.records_data }}
            continue-on-error: true
            timeout-minutes: 20
            shell: bash
            run: |
              uv run --no-project scripts/sample-file-trees.py \
                vortex-bench/data/${{ matrix.dataset_dir }} \
                --vx target/release_debug/vx \
                --seed ${{ inputs.mode == 'pr' && github.event.pull_request.head.sha || github.sha }} \
                -o file-trees

      - name: Upload sampled file trees
        if: ${{ !cancelled() && matrix.remote_key == null && matrix.records_data }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: file-trees-${{ inputs.matrix_preset }}-${{ matrix.id }}
          path: file-trees/
          retention-days: 5
          if-no-files-found: ignore

      # The `comment` job compares and comments once per case, over every entry of the case.
      # The results go in a directory named after the entry, because download-artifact extracts
      # a lone matching artifact straight into its path, without the artifact's name.
      - name: Stage results for the PR comment
        if: ${{ !cancelled() && inputs.mode == 'pr' }}
        shell: bash
        env:
          ENTRY_ID: ${{ matrix.id }}
        run: |
          set -Eeuo pipefail
          mkdir -p "pr-comment-results/${ENTRY_ID}"
          for file in results.json results.ingest.jsonl; do
            if [[ -f "$file" ]]; then cp "$file" "pr-comment-results/${ENTRY_ID}/"; fi
          done
      - name: Upload results for the PR comment
        if: ${{ !cancelled() && inputs.mode == 'pr' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sql-results-${{ inputs.matrix_preset }}--${{ matrix.group }}--${{ matrix.id }}
          path: pr-comment-results/
          retention-days: 5
          if-no-files-found: ignore

      # v4 (Postgres) ingest -- the REQUIRED benchmark-results pipeline feeding the live
      # benchmarks website (see develop-bench.yml for the full rationale); a failure here fails the
      # job. Gated on inputs.mode == 'develop' + the ingest-role ARN var (the assume-role
      # input that MUST exist for OIDC to succeed). post-ingest.py mints the RDS IAM token
      # (boto3) from the assumed GitHubBenchmarkIngestRole; sslmode=verify-full validates
      # the cert. No "Install uv" step here: this job already installed the uv binary
      # in its "Install uv" step above, and the ingest runs `uv run --no-project --with`,
      # which needs nothing beyond the binary.
      - name: Configure AWS credentials for v4 ingest (OIDC)
        if: inputs.mode == 'develop' && vars.GH_BENCH_INGEST_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.GH_BENCH_INGEST_ROLE_ARN }}
          aws-region: ${{ vars.RDS_BENCH_REGION }}
      - name: Ingest results to v4 Postgres
        if: inputs.mode == 'develop' && vars.GH_BENCH_INGEST_ROLE_ARN != ''
        shell: bash
        env:
          RDS_BENCH_INSTANCE_ENDPOINT: ${{ vars.RDS_BENCH_INSTANCE_ENDPOINT }}
          RDS_BENCH_DB_NAME: ${{ vars.RDS_BENCH_DB_NAME }}
          AWS_REGION: ${{ vars.RDS_BENCH_REGION }}
        run: |
          set -Eeuo pipefail
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o "${RUNNER_TEMP}/rds-global-bundle.pem"
          DSN="postgresql://bench_ingest@${RDS_BENCH_INSTANCE_ENDPOINT}:5432/${RDS_BENCH_DB_NAME}?sslmode=verify-full&sslrootcert=${RUNNER_TEMP}/rds-global-bundle.pem"
          uv run --no-project --with 'psycopg[binary]' --with boto3 --with xxhash \
            scripts/post-ingest.py results.ingest.jsonl \
            --postgres "${DSN}" \
            --commit-sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --region "${AWS_REGION}"

      - name: Alert incident.io
        if: failure() && inputs.mode == 'develop'
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
          alert-title: "${{ matrix.name }} SQL benchmark failed on develop"
          deduplication-key: ci-sql-bench-${{ matrix.id }}-failure

  # Merge every bench job's sampled file trees into one artifact, one directory per job, so a run
  # has a single zip to download.
  merge-file-trees:
    needs: bench
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=amd64-ci-small/image=ubuntu26-full-x64-pre-v2/tag=merge-file-trees{1}', github.run_id, (inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false) && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      # `extras=s3-cache` points the artifact API at the RunsOn proxy, which only this action wires
      # up; without it the merge cannot list the bench jobs' artifacts.
      - uses: runs-on/action@v2
        if: inputs.mode != 'pr' || github.event.pull_request.head.repo.fork == false
      - name: Merge sampled file trees
        continue-on-error: true
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: file-trees-${{ inputs.matrix_preset }}
          pattern: file-trees-${{ inputs.matrix_preset }}-*
          separate-directories: true
          delete-merged: true
          retention-days: 5

  # One comment per case: the entries of a case run on machines of their own, one per Vortex scan,
  # and their results are compared here against one baseline, so the comment shows every scan side
  # by side and names any entry that did not report.
  comment:
    needs: [resolve-matrix, bench]
    if: ${{ !cancelled() && inputs.mode == 'pr' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-matrix.outputs.comment_groups) }}
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=amd64-ci-small/image=ubuntu26-full-x64-pre-v2/tag=comment-{1}{2}', github.run_id, matrix.group, github.event.pull_request.head.repo.fork == false && '/extras=s3-cache' || '')
          || 'ubuntu-latest' }}
    steps:
      # `extras=s3-cache` points the artifact API at the RunsOn proxy, which only this action wires up.
      - uses: runs-on/action@v2
        if: github.event.pull_request.head.repo.fork == false
      # The baseline is the newest develop commit reachable from the PR head, which needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: sql-results-${{ inputs.matrix_preset }}--${{ matrix.group }}--*
          path: entries
      - name: Merge results
        id: merge
        shell: bash
        env:
          IDS: ${{ toJSON(matrix.ids) }}
        run: |
          set -Eeuo pipefail
          : > results.json
          : > results.ingest.jsonl
          missing=()
          while read -r id; do
            # Each artifact holds a directory named after its entry. download-artifact puts each
            # artifact in a directory of the artifact's name, except a lone match, which it
            # extracts straight into `entries`.
            dir="entries/sql-results-${{ inputs.matrix_preset }}--${{ matrix.group }}--${id}/${id}"
            [[ -d "$dir" ]] || dir="entries/${id}"
            if [[ -s "$dir/results.ingest.jsonl" ]]; then
              cat "$dir/results.ingest.jsonl" >> results.ingest.jsonl
              cat "$dir/results.json" >> results.json 2>/dev/null || true
            else
              missing+=("\`${id}\`")
            fi
          done < <(jq -r '.[]' <<<"$IDS")
          echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          echo "reported=$([[ -s results.ingest.jsonl ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # A fork PR's job has no OIDC token, so pr-bench-report.yml reads its baseline.
      - name: Fetch baseline from the benchmarks database
        if: steps.merge.outputs.reported == 'true' && github.event.pull_request.head.repo.fork != true
        uses: ./.github/actions/fetch-bench-baseline
        with:
          role-arn: ${{ vars.GH_BENCH_READ_ROLE_ARN }}
          region: ${{ vars.RDS_BENCH_REGION }}
          endpoint: ${{ vars.RDS_BENCH_INSTANCE_ENDPOINT }}
          database: ${{ vars.RDS_BENCH_DB_NAME }}
      - name: Compare results
        shell: bash
        env:
          MISSING: ${{ steps.merge.outputs.missing }}
          REPORTED: ${{ steps.merge.outputs.reported }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeu -o pipefail -x
          : > comment.md
          if [[ -n "$MISSING" ]]; then
            echo "# 🚨🚨🚨❌❌❌ SQL BENCHMARK FAILED ❌❌❌🚨🚨🚨" >> comment.md
            echo >> comment.md
            echo "Benchmark \`${{ matrix.name }}\` (${{ inputs.matrix_preset }}) has entries that did not report: ${MISSING}. Check the [workflow run](${RUN_URL}) for details." >> comment.md
            echo >> comment.md
          fi
          if [[ "$REPORTED" == "true" ]]; then
            uv run --no-project scripts/compare-benchmark-jsons.py base.ingest.jsonl results.json \
              "${{ matrix.name }}${{ matrix.queries && format(' (queries {0})', matrix.queries) || '' }}" \
              --pr-records results.ingest.jsonl >> comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      # A fork PR's job has no OIDC token, so pr-bench-report.yml reads its baseline and comments.
      - name: Upload report for pr-bench-report.yml
        if: github.event.pull_request.head.repo.fork == true
        uses: ./.github/actions/upload-fork-bench-report
        with:
          benchmark-name: ${{ matrix.name }}
          comment-tag: bench-pr-comment-${{ matrix.group }}-${{ inputs.matrix_preset }}${{ matrix.queries && format('-q{0}', matrix.queries) || '' }}
          matrix-preset: ${{ inputs.matrix_preset }}
          missing-entries: ${{ steps.merge.outputs.missing }}
      # A manual run on a branch without an open PR has nowhere to comment; its job summary has the table.
      - name: Comment PR
        if: github.event.pull_request.head.repo.fork == false && (inputs.pr_number != '' || github.event.pull_request.number)
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3
        with:
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          file-path: comment.md
          # There is exactly one comment per comment-tag. If a comment with this tag already exists,
          # this action will *update* the comment instead of posting a new comment. The preset is
          # part of the tag because presets overlap on benchmark ids (`pr` and `pr-compact` share
          # nine) and can run concurrently, so a preset-less tag would let them clobber each other.
          comment-tag: bench-pr-comment-${{ matrix.group }}-${{ inputs.matrix_preset }}${{ matrix.queries && format('-q{0}', matrix.queries) || '' }}
