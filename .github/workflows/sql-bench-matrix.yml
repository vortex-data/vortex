name: SQL Benchmark Matrix

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      matrix_preset:
        required: true
        type: string
      machine_type:
        required: false
        type: string
        default: c8gd.metal-24xl

jobs:
  download-probe:
    timeout-minutes: 10
    runs-on: >-
      ${{ format('runs-on={0}/runner=bench-dedicated/family=c8gd.8xlarge/image=ubuntu24-full-arm64-pre-v2/tag=download-probe', github.run_id) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Probe four unchanged ClickBench shards
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/probe-clickbench-download.py 2>&1 | tee scan-download-log.txt
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: clickbench-download-probe
          path: |
            scan-download-log.txt
            scan-download-provenance.json
