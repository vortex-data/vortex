name: CUDA

# Concurrency control:
# - PRs: new commits on a feature branch will cancel in-progress (outdated) runs.
# - Push to develop: runs queue sequentially, never cancelled.
# - `workflow_dispatch`: groups by branch and queues if run on develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch: { }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TY_VERSION: 0.0.98

jobs:
  changes:
    name: "Detect CUDA changes"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      run-cuda-san: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cuda == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            cuda:
              - "vortex-cuda/**"
              - "vortex-python/Cargo.toml"
              - "vortex-python/python/vortex/__init__.py"
              - "vortex-python/pyproject.toml"
              - "vortex-python/src/**"
              - "vortex-python/test/test_cuda.py"
              - "vortex-python-abi/**"
              - "vortex-python-cuda/**"
              - "vortex-test/**"
              - "pyproject.toml"
              - "uv.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/cuda.yaml"
              - ".github/actions/check-rebuild/**"
              - ".github/actions/setup-rust/**"
              - ".github/actions/setup-sccache/**"
              - ".github/actions/setup-protoc/**"
              - ".github/runs-on.yml"

  cuda-build-lint:
    needs: [changes]
    if: >-
      always() && github.repository == 'vortex-data/vortex' &&
      needs.changes.outputs.run-cuda-san == 'true'
    name: "CUDA build & lint"
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}/region=${{ vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || 'us-east-1' }}/runner=gpu/extras=s3-cache/tag=cuda-build
    steps:
      - parallel:
          - uses: runs-on/action@v2
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-sccache: "true"
      - uses: ./.github/actions/check-rebuild
        with:
          command: >-
            cargo build --profile ci --locked --all-features --all-targets
            -p vortex-cuda -p vortex-cuda-ffi -p vortex-cub -p vortex-nvcomp
            -p gpu-scan-cli -p vortex-test-e2e-cuda -p vortex-python-cuda
      - name: Verify generated CUDA FFI header is up to date
        run: git --no-pager diff --exit-code -- vortex-cuda/ffi/cinclude/vortex_cuda.h
      - name: Clippy CUDA crates
        run: |
          cargo clippy --profile ci --locked --all-features --all-targets \
            -p vortex-cuda \
            -p vortex-cuda-ffi \
            -p vortex-cub \
            -p vortex-nvcomp \
            -p gpu-scan-cli \
            -p vortex-test-e2e-cuda \
            -p vortex-python-cuda \
            -- -D warnings

  cuda-test:
    needs: [changes]
    if: >-
      always() && github.repository == 'vortex-data/vortex' &&
      needs.changes.outputs.run-cuda-san == 'true'
    name: "CUDA tests"
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}/region=${{ vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || 'us-east-1' }}/runner=gpu/extras=s3-cache/tag=cuda-tests
    steps:
      - parallel:
          - uses: runs-on/action@v2
            with:
              sccache: s3
          - name: Display NVIDIA SMI details
            run: |
              nvidia-smi
              nvidia-smi -L
              nvidia-smi -q -d Memory
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - parallel:
          - uses: ./.github/actions/setup-rust
            with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              enable-sccache: "true"
          - name: Install uv
            uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
            with:
              sync: false
      - parallel:
          - name: Rust Tests
            env:
              FLAT_LAYOUT_INLINE_ARRAY_NODE: true
            run: |
              cargo test --tests \
                --profile ci \
                --locked \
                -p vortex-file \
                -p vortex-cuda \
                -p vortex-cuda-ffi \
                -p vortex-cub \
                -p vortex-nvcomp \
                -p vortex-test-e2e-cuda \
                -p vortex-python-cuda \
                --all-features \
                --no-fail-fast \
                --target x86_64-unknown-linux-gnu
          - name: Python CUDA extension checks
            env:
              MATURIN_PEP517_ARGS: "--profile ci"
            run: |
              uv sync --all-packages --extra cuda
              uvx ty@$TY_VERSION check vortex-python vortex-python-cuda
              uv run --all-packages --extra cuda pytest --benchmark-disable vortex-python/test/test_cuda.py vortex-python-cuda/test
