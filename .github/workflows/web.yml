---

name: Vortex Web

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request: { }
  push:
    branches: [develop]

permissions:
  contents: read

defaults:
  run:
    working-directory: vortex-web

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            web:
              - "vortex-web/**"
              - ".github/workflows/web.yml"

  check:
    name: Check & Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: vortex-web/package-lock.json
      - run: npm ci
      - run: npm run wasm
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build-storybook

  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: vortex-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vortex-explorer
          path: vortex-web/dist/

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: vortex-explorer
          path: dist
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=vortex-explorer --branch=${{ github.head_ref || github.ref_name }}
