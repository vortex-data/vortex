---

name: Vortex Web

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

defaults:
  run:
    working-directory: vortex-web

# The docs workflows build and deploy the Explorer (web-build.yml), because
# one Vercel project serves both.
jobs:
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            web:
              - "vortex-web/**"
              - ".github/workflows/web.yml"

  check:
    name: Check & Lint
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3
      # Storybook and Vite run on Node, and Bun runs their scripts with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run wasm
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build-storybook
