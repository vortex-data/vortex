name: PR Title

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review]

permissions: { }

jobs:
  check_title:
    name: Validate PR Title
    if: github.event.pull_request.draft != true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title length and prefix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it to 72 or fewer."
            status=1
          fi
          # Conventional-commit style prefixes such as `feat:`, `fix(array):`, `fix[array]:`
          # or `duckdb:`. The changelog/* label already categorizes the PR.
          if [[ "$TITLE" =~ ^[A-Za-z0-9_-]+(\([^)]*\)|\[[^]]*\])?!?:\  ]]; then
            echo "::error::Drop the '${BASH_REMATCH[0]}' prefix from the PR title; the changelog/* label categorizes the PR."
            status=1
          fi
          exit "$status"
