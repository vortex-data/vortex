name: Close Fixed Fuzzer Issues

on:
  schedule:
    - cron: "0 0 * * *"  # every night at midnight UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without closing issues (retest only)"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read
  actions: read

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13

jobs:
  close-fixed:
    name: "Retest ${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        target: [file_io, file_corruption, file_session, array_ops, compress_roundtrip, row_encode, fsst_like, arrow_roundtrip, variant_file, wire_safety]
        include:
          - target: compress_gpu
            runner: gpu
            extra_features: cuda
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/extras=s3-cache/tag=fuzzer-cleanup-{2}', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (matrix.runner != 'gpu' && contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-central-1') || 'us-east-1'), matrix.runner || 'arm64-medium', matrix.target)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-prebuild
        if: matrix.runner != 'gpu'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}

      - uses: ./.github/actions/setup-rust
        if: matrix.runner == 'gpu'
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}

      - uses: ./.github/actions/setup-fuzz-llvm

      - uses: ./.github/actions/setup-fuzz-linker

      - name: Install cargo-fuzz
        uses: taiki-e/cache-cargo-install-action@66c9585ef5ca780ee69399975a5e911f47905995
        with:
          tool: cargo-fuzz

      - name: Retest and close fixed fuzzer issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 .github/scripts/close_fixed_fuzzer_issues.py
          --target ${{ matrix.target }}
          ${{ matrix.extra_features && format('--features {0}', matrix.extra_features) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
