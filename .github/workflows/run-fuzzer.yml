name: Run Fuzzer

on:
  workflow_call:
    inputs:
      fuzz_target:
        description: "The cargo fuzz binary target name (e.g., file_io, array_ops)"
        required: true
        type: string
      fuzz_name:
        description: "Display/storage name for this fuzz run. Defaults to fuzz_target if not set."
        required: false
        type: string
        default: ""
      max_time:
        description: "Maximum fuzzing time in seconds"
        required: false
        type: number
        default: 5400
      runner:
        description: "Runner name from .github-private runs-on.yml (e.g., arm64-fuzz, gpu)"
        required: false
        type: string
        default: "arm64-fuzz"
      extra_features:
        description: "Extra cargo features to enable (e.g., cuda)"
        required: false
        type: string
        default: ""
      extra_env:
        description: "Extra environment variables to set (space-separated KEY=VALUE pairs)"
        required: false
        type: string
        default: ""
      jobs:
        description: "Number of parallel fuzzing jobs (libfuzzer -fork=N)."
        required: false
        type: number
        default: 1
      fuzzer_artifact:
        description: "Precompiled fuzzer artifact. Builds locally when omitted."
        required: false
        type: string
        default: ""
    outputs:
      crashes_found:
        description: "Whether crashes were found"
        value: ${{ jobs.fuzz.outputs.crashes_found }}
      first_crash_name:
        description: "Name of the first crash file"
        value: ${{ jobs.fuzz.outputs.first_crash_name }}
      artifact_url:
        description: "URL of the uploaded crash artifacts"
        value: ${{ jobs.fuzz.outputs.artifact_url }}
    secrets:
      R2_FUZZ_ACCESS_KEY_ID:
        required: true
      R2_FUZZ_SECRET_ACCESS_KEY:
        required: true

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-02-05

jobs:
  fuzz:
    name: "Run ${{ inputs.fuzz_name || inputs.fuzz_target }}"
    env:
      FUZZ_NAME: ${{ inputs.fuzz_name || inputs.fuzz_target }}
    timeout-minutes: 180
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/disk=large/tag={2}-fuzz', github.run_id, inputs.runner, inputs.fuzz_name || inputs.fuzz_target)
          || 'ubuntu-latest' }}
    outputs:
      crashes_found: ${{ steps.check.outputs.crashes_found }}
      first_crash_name: ${{ steps.check.outputs.first_crash_name }}
      artifact_url: ${{ steps.upload_artifacts.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-prebuild
        if: >-
          inputs.fuzzer_artifact == '' &&
          github.repository == 'vortex-data/vortex' &&
          contains(fromJSON('["arm64-fuzz", "arm64-medium"]'), inputs.runner)
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          enable-sccache: "false"

      - uses: ./.github/actions/setup-rust
        if: >-
          inputs.fuzzer_artifact == '' &&
          (github.repository != 'vortex-data/vortex' ||
          !contains(fromJSON('["arm64-fuzz", "arm64-medium"]'), inputs.runner))
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          enable-sccache: "false"

      - name: Check LLVM toolchain
        id: llvm-toolchain
        if: inputs.fuzzer_artifact == ''
        shell: bash
        run: |
          if command -v clang >/dev/null && command -v llvm-symbolizer >/dev/null; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install llvm
        if: inputs.fuzzer_artifact == '' && steps.llvm-toolchain.outputs.installed != 'true'
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm

      - name: Install cargo-fuzz
        if: inputs.fuzzer_artifact == ''
        uses: taiki-e/cache-cargo-install-action@66c9585ef5ca780ee69399975a5e911f47905995
        with:
          tool: cargo-fuzz

      - name: Download precompiled fuzzer
        if: inputs.fuzzer_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.fuzzer_artifact }}

      - name: Extract precompiled fuzzer
        if: inputs.fuzzer_artifact != ''
        run: tar -xf cpu-fuzzers.tar.zst

      - name: Restore corpus
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: |
          CORPUS_KEY="${FUZZ_NAME}_corpus.tar.zst"
          CORPUS_DIR="fuzz/corpus/${FUZZ_NAME}"
          CORPUS_ETAG_FILE="$RUNNER_TEMP/${FUZZ_NAME}.etag"

          # Try to download corpus
          if python3 scripts/s3-download.py \
            "s3://vortex-fuzz-corpus/$CORPUS_KEY" "$CORPUS_KEY" \
            --etag-output "$CORPUS_ETAG_FILE"; then
            echo "Downloaded corpus successfully"
            tar -xf "$CORPUS_KEY"
          else
            echo "Corpus unavailable; creating an empty local corpus with create-only protection"
            mkdir -p "$CORPUS_DIR"
            printf 'CREATE_ONLY\n' > "$CORPUS_ETAG_FILE"
          fi

      - name: Run fuzzing target
        id: fuzz
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          CORPUS_DIR="fuzz/corpus/${FUZZ_NAME}"
          CORPUS_KEY="${FUZZ_NAME}_corpus.tar.zst"
          CORPUS_ETAG_FILE="$RUNNER_TEMP/${FUZZ_NAME}.etag"
          mkdir -p "fuzz/artifacts/${FUZZ_NAME}"

          LAST_CHECKPOINT_COUNT=$(find "$CORPUS_DIR" -type f | wc -l)
          checkpoint_loop() {
            local current_count
            while sleep 900; do
              current_count=$(find "$CORPUS_DIR" -type f | wc -l)
              if [ "$current_count" -ne "$LAST_CHECKPOINT_COUNT" ]; then
                echo "Checkpointing $current_count corpus entries for $FUZZ_NAME"
                if scripts/checkpoint-fuzz-corpus.sh \
                  "$CORPUS_DIR" "$CORPUS_KEY" "$CORPUS_ETAG_FILE"; then
                  LAST_CHECKPOINT_COUNT=$current_count
                else
                  echo "::warning::Unable to checkpoint the $FUZZ_NAME corpus"
                fi
              fi
            done
          }
          checkpoint_loop &
          CHECKPOINT_PID=$!
          stop_checkpoint_loop() {
            kill "$CHECKPOINT_PID" 2>/dev/null || true
            wait "$CHECKPOINT_PID" 2>/dev/null || true
          }
          trap stop_checkpoint_loop EXIT

          FEATURES_FLAG=""
          if [ -n "${{ inputs.extra_features }}" ]; then
            FEATURES_FLAG="--features ${{ inputs.extra_features }}"
          fi
          FORK_FLAG=""
          if [ "${{ inputs.jobs }}" -gt 1 ]; then
            FORK_FLAG="-fork=${{ inputs.jobs }}"
          fi

          set +e
          if [ -n "${{ inputs.fuzzer_artifact }}" ]; then
            env ${{ inputs.extra_env }} RUST_BACKTRACE=1 \
              "$GITHUB_WORKSPACE/fuzz-binaries/$FUZZ_NAME" "$CORPUS_DIR" \
              $FORK_FLAG -max_total_time=${{ inputs.max_time }} -rss_limit_mb=0 \
              -artifact_prefix="fuzz/artifacts/${FUZZ_NAME}/" \
              2>&1 | tee fuzz_output.log
          else
            env ${{ inputs.extra_env }} RUST_BACKTRACE=1 \
              cargo +$NIGHTLY_TOOLCHAIN fuzz run --release --debug-assertions \
              $FEATURES_FLAG \
              ${{ inputs.fuzz_target }} "$CORPUS_DIR" -- \
              $FORK_FLAG -max_total_time=${{ inputs.max_time }} -rss_limit_mb=0 \
              2>&1 | tee fuzz_output.log
          fi
          FUZZ_STATUS=${PIPESTATUS[0]}
          set -e

          stop_checkpoint_loop
          trap - EXIT
          exit "$FUZZ_STATUS"
        continue-on-error: true

      - name: Check for crashes
        id: check
        run: |
          # Find actual crash files, not just the directory structure
          FIRST_CRASH=$(find fuzz/artifacts -type f \( -name "crash-*" -o -name "leak-*" -o -name "timeout-*" -o -name "oom-*" \) 2>/dev/null | head -1 || true)

          if [ -n "$FIRST_CRASH" ]; then
            echo "crashes_found=true" >> $GITHUB_OUTPUT
            echo "first_crash=$FIRST_CRASH" >> $GITHUB_OUTPUT
            echo "first_crash_name=$(basename $FIRST_CRASH)" >> $GITHUB_OUTPUT

            # Count all crashes for reporting
            CRASH_COUNT=$(find fuzz/artifacts -type f \( -name "crash-*" -o -name "leak-*" -o -name "timeout-*" -o -name "oom-*" \) | wc -l)
            echo "crash_count=$CRASH_COUNT" >> $GITHUB_OUTPUT
            echo "Found $CRASH_COUNT crash(es), will process first: $(basename $FIRST_CRASH)"
          else
            echo "crashes_found=false" >> $GITHUB_OUTPUT
            echo "crash_count=0" >> $GITHUB_OUTPUT
            echo "No crashes found"
          fi

      - name: Reproduce crash for full output
        if: steps.check.outputs.crashes_found == 'true' && inputs.jobs > 1
        run: |
          if [ -n "${{ inputs.fuzzer_artifact }}" ]; then
            env ${{ inputs.extra_env }} RUST_BACKTRACE=1 \
              "$GITHUB_WORKSPACE/fuzz-binaries/$FUZZ_NAME" \
              "${{ steps.check.outputs.first_crash }}" \
              2>&1 | tee fuzz_output.log || true
          else
            FEATURES_FLAG=""
            if [ -n "${{ inputs.extra_features }}" ]; then
              FEATURES_FLAG="--features ${{ inputs.extra_features }}"
            fi
            env ${{ inputs.extra_env }} RUST_BACKTRACE=1 \
              cargo +$NIGHTLY_TOOLCHAIN fuzz run --release --debug-assertions \
              $FEATURES_FLAG \
              ${{ inputs.fuzz_target }} \
              "${{ steps.check.outputs.first_crash }}" \
              2>&1 | tee fuzz_output.log || true
          fi

      - name: Archive crash artifacts
        id: upload_artifacts
        if: steps.check.outputs.crashes_found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ env.FUZZ_NAME }}-crash-artifacts
          path: fuzz/artifacts
          retention-days: 180

      - name: Archive fuzzer output log
        if: steps.check.outputs.crashes_found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ env.FUZZ_NAME }}-logs
          path: fuzz_output.log
          retention-days: 90

      - name: Persist corpus
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: |
          CORPUS_KEY="${FUZZ_NAME}_corpus.tar.zst"
          CORPUS_DIR="fuzz/corpus/${FUZZ_NAME}"
          CORPUS_ETAG_FILE="$RUNNER_TEMP/${FUZZ_NAME}.etag"
          scripts/checkpoint-fuzz-corpus.sh \
            "$CORPUS_DIR" "$CORPUS_KEY" "$CORPUS_ETAG_FILE"

      - name: Fail job if fuzzing failed
        if: steps.fuzz.outcome == 'failure' || steps.check.outputs.crashes_found == 'true'
        run: exit 1
