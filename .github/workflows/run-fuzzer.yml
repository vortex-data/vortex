name: Run Fuzzer

on:
  workflow_call:
    inputs:
      fuzz_target:
        description: "The cargo fuzz binary target name (e.g., file_io, array_ops)"
        required: true
        type: string
      fuzz_name:
        description: "Display/storage name for this fuzz run. Defaults to fuzz_target if not set."
        required: false
        type: string
        default: ""
      max_time:
        description: "Maximum fuzzing time in seconds"
        required: false
        type: number
        default: 5400
      cycle_hours:
        description: >-
          Hours between the caller's scheduled runs (its cron interval). Scheduled runs stop
          fuzzing 10 minutes before the next slot, so they never overlap it. 0 disables this.
        required: false
        type: number
        default: 0
      runner:
        description: "Runner name from .github-private runs-on.yml (e.g., arm64-fuzz, gpu)"
        required: false
        type: string
        default: "arm64-fuzz"
      extra_features:
        description: "Extra cargo features to enable (e.g., cuda)"
        required: false
        type: string
        default: ""
      extra_env:
        description: "Extra environment variables to set (space-separated KEY=VALUE pairs)"
        required: false
        type: string
        default: ""
      jobs:
        description: "Number of parallel fuzzing jobs (libfuzzer -fork=N)."
        required: false
        type: number
        default: 1
      fuzzer_artifact:
        description: "Precompiled fuzzer artifact. Builds locally when omitted."
        required: false
        type: string
        default: ""
      fuzzer_run_id:
        description: "Workflow run that uploaded fuzzer_artifact. Defaults to this run."
        required: false
        type: string
        default: ""
      rss_limit_mb:
        description: "libFuzzer RSS limit per fuzzing job in MB. 0 disables the limit."
        required: false
        type: number
        default: 0
      report:
        description: "Open an issue and start fix automation when a crash is found."
        required: false
        type: boolean
        default: true
    outputs:
      crashes_found:
        description: "Whether crashes were found"
        value: ${{ jobs.fuzz.outputs.crashes_found }}
      first_crash_name:
        description: "Name of the first crash file"
        value: ${{ jobs.fuzz.outputs.first_crash_name }}
      artifact_url:
        description: "URL of the uploaded crash artifacts"
        value: ${{ jobs.fuzz.outputs.artifact_url }}
    secrets:
      R2_FUZZ_ACCESS_KEY_ID:
        required: true
      R2_FUZZ_SECRET_ACCESS_KEY:
        required: true
      INCIDENT_IO_ALERT_TOKEN:
        required: false

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13

jobs:
  fuzz:
    name: "Run ${{ inputs.fuzz_name || inputs.fuzz_target }}"
    concurrency:
      # Exploration and minimization share this lock for each stored corpus.
      group: fuzz-corpus-${{ inputs.fuzz_name || inputs.fuzz_target }}
      cancel-in-progress: false
      queue: max
    env:
      FUZZ_NAME: ${{ inputs.fuzz_name || inputs.fuzz_target }}
      FUZZ_TARGET: ${{ inputs.fuzz_target }}
      EXTRA_ENV: ${{ inputs.extra_env }}
      FUZZ_JOBS: ${{ inputs.jobs }}
      MAX_TIME: ${{ inputs.max_time }}
      CYCLE_HOURS: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run')
            && inputs.cycle_hours || 0 }}
      RSS_LIMIT_MB: ${{ inputs.rss_limit_mb }}
    timeout-minutes: 180
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/tag={2}-fuzz', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-central-1') || 'us-east-1'), inputs.runner, inputs.fuzz_name || inputs.fuzz_target)
          || 'ubuntu-latest' }}
    outputs:
      crashes_found: ${{ steps.check.outputs.crashes_found }}
      first_crash_name: ${{ steps.check.outputs.first_crash_name }}
      artifact_url: ${{ steps.upload_artifacts.outputs.artifact-url }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-fuzz-llvm

      # Building or downloading the fuzzer and restoring the corpus touch different files.
      - parallel:
          - name: Build or restore fuzzer
            if: inputs.fuzzer_artifact == ''
            uses: ./.github/actions/build-fuzzers
            with:
              toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
              runner: ${{ inputs.runner }}
              fuzz_target: ${{ inputs.fuzz_target }}
              extra_features: ${{ inputs.extra_features }}
          - name: Download precompiled fuzzer
            if: inputs.fuzzer_artifact != ''
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
            with:
              name: ${{ inputs.fuzzer_artifact }}
              run-id: ${{ inputs.fuzzer_run_id || github.run_id }}
              github-token: ${{ github.token }}
          - name: Restore corpus
            shell: bash
            env:
              AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
              AWS_REGION: "us-east-1"
              AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
            run: .github/scripts/restore-fuzz-corpus.sh explore

      - name: Extract precompiled fuzzer
        if: inputs.fuzzer_artifact != ''
        run: |
          tar -xf cpu-fuzzers.tar.zst
          rm cpu-fuzzers.tar.zst

      - name: Run fuzzing target
        id: fuzz
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: .github/scripts/run-fuzzer.sh
        continue-on-error: true

      - name: Check for crashes
        id: check
        run: .github/scripts/check-fuzz-crashes.sh

      - name: Reproduce crash for full output
        if: steps.check.outputs.crashes_found == 'true'
        env:
          FIRST_CRASH: ${{ steps.check.outputs.first_crash }}
        run: .github/scripts/reproduce-fuzz-crash.sh

      - name: Archive crash artifacts
        id: upload_artifacts
        if: steps.check.outputs.crashes_found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ env.FUZZ_NAME }}-crash-artifacts
          path: fuzz/artifacts
          retention-days: 180

      - name: Archive fuzzer output log
        if: always() && steps.fuzz.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ env.FUZZ_NAME }}-logs
          path: fuzz_output.log
          retention-days: ${{ steps.check.outputs.crashes_found == 'true' && 90 || 7 }}

      - name: Persist corpus
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: >-
          .github/scripts/checkpoint-fuzz-corpus.sh
          "fuzz/corpus/$FUZZ_NAME" "${FUZZ_NAME}_corpus.tar.zst" "$RUNNER_TEMP/${FUZZ_NAME}.etag"

      - name: Fail job if fuzzing failed
        if: steps.fuzz.outcome == 'failure' || steps.check.outputs.crashes_found == 'true'
        run: exit 1

  report:
    name: "Report ${{ inputs.fuzz_name || inputs.fuzz_target }} failures"
    needs: fuzz
    if: always() && inputs.report && needs.fuzz.outputs.crashes_found == 'true'
    permissions:
      issues: write
      contents: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/report-fuzz-crash.yml
    with:
      fuzz_target: ${{ inputs.fuzz_target }}
      crash_file: ${{ needs.fuzz.outputs.first_crash_name }}
      artifact_url: ${{ needs.fuzz.outputs.artifact_url }}
      artifact_name: ${{ inputs.fuzz_name || inputs.fuzz_target }}-crash-artifacts
      logs_artifact_name: ${{ inputs.fuzz_name || inputs.fuzz_target }}-logs
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      incident_io_alert_token: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}

  attempt-fix:
    name: "Attempt fix for ${{ inputs.fuzz_name || inputs.fuzz_target }} crash"
    needs: report
    # Without a status function, `if` adds an implicit success(), which checks
    # all upstream jobs. The fuzz job fails when it finds a crash, so success()
    # is always false here.
    if: ${{ !cancelled() && needs.report.outputs.issue_created == 'true' }}
    permissions:
      # The reusable workflow downloads the crash artifact (actions: read) and
      # comments on the issue with GITHUB_TOKEN. It pushes the fix branch and
      # opens the pull request with a GitHub App token, not with GITHUB_TOKEN.
      actions: read
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/fuzzer-fix-automation.yml
    with:
      issue_number: ${{ needs.report.outputs.issue_number }}
    secrets: inherit
