# Dispatches benchmark workflows when benchmark labels are added to pull requests.
# This is a separate workflow so that non-benchmark label events don't create
# phantom check suites that obscure in-progress benchmark runs on the PR.

name: PR Benchmark Dispatch
run-name: >-
  PR #${{ github.event.pull_request.number }} benchmark:
  ${{ github.event.label.name }}

on:
  pull_request:
    types: [labeled]
    branches: ["develop"]

permissions:
  contents: read

jobs:
  remove-all-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-all'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-all"

  all-random-access-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-random-access.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  all-compression-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-compress.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  all-string-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-string.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  all-sql-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-sql.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      BENCH_REVALIDATE_TOKEN: ${{ secrets.BENCH_REVALIDATE_TOKEN }}
      INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
    with:
      matrix_preset: "pr-all"

  remove-random-access-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-random-access'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-random-access"

  random-access-bench:
    needs: remove-random-access-label
    uses: ./.github/workflows/pr-bench-random-access.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  remove-compress-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-compress'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-compress"

  compression-bench:
    needs: remove-compress-label
    uses: ./.github/workflows/pr-bench-compress.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  remove-string-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-string'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-string"

  string-bench:
    needs: remove-string-label
    uses: ./.github/workflows/pr-bench-string.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}

  remove-gpu-compress-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-gpu-compress'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-gpu-compress"

  gpu-compress-bench:
    needs: remove-gpu-compress-label
    uses: ./.github/workflows/pr-bench-gpu-compress.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments

  remove-sql-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-sql'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-sql"

  sql-bench:
    needs: remove-sql-label
    uses: ./.github/workflows/pr-bench-sql.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      BENCH_REVALIDATE_TOKEN: ${{ secrets.BENCH_REVALIDATE_TOKEN }}
      INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
    with:
      matrix_preset: "pr"

  remove-sql-compact-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-sql-compact'
    permissions:
      pull-requests: write  # for label removal
    steps:
      - name: Remove benchmark label
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "action/bench-sql-compact"

  sql-compact-bench:
    needs: remove-sql-compact-label
    uses: ./.github/workflows/pr-bench-sql.yml
    permissions:
      contents: read
      pull-requests: write  # for PR comments
      id-token: write  # enables AWS-GitHub OIDC
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      BENCH_REVALIDATE_TOKEN: ${{ secrets.BENCH_REVALIDATE_TOKEN }}
      INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
    with:
      matrix_preset: "pr-compact"
