# Dispatches benchmark workflows when benchmark labels are added to pull requests.
# This is a separate workflow so that non-benchmark label events don't create
# phantom check suites that obscure in-progress benchmark runs on the PR.

name: PR Benchmark Dispatch
run-name: >-
  PR #${{ github.event.pull_request.number }} benchmark:
  ${{ github.event.label.name }}

on:
  pull_request:
    types: [labeled]
    branches: ["develop"]

permissions:
  actions: write
  contents: read
  pull-requests: write  # for label removal and PR comments
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  # polarsignals/gh-actions-ps-profiling upserts one PR comment found by its marker, but parallel
  # benchmark jobs that start profiling together each find none and create duplicates. Create it
  # once here, before any profiled benchmark job starts, so they all update the same comment.
  ensure-profiling-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.fork == false && contains(fromJSON('[
        "action/bench-all",
        "action/bench-random-access",
        "action/bench-random-access-s3",
        "action/bench-compress",
        "action/bench-string",
        "action/bench-sql",
        "action/bench-sql-compact",
        "action/bench-sql-extended"
      ]'), github.event.label.name)
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        # Without the comment the action falls back to creating its own, so never block benchmarks.
        continue-on-error: true
        with:
          script: |
            const marker = "<!-- polar-signals-profiling-comment -->";
            const params = { ...context.repo, issue_number: context.payload.pull_request.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            if (!comments.some((comment) => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                ...params,
                body: `${marker}\n## Polar Signals Profiling Results\n\nWaiting for profiled benchmark jobs to start.\n`,
              });
            }

  remove-all-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-all'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-all
          fail_on_error: true

  all-random-access-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-random-access.yml
    secrets: inherit

  all-random-access-s3-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-random-access-s3.yml
    secrets: inherit

  all-compression-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-compress.yml
    secrets: inherit

  all-string-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-string.yml
    secrets: inherit

  all-sql-bench:
    needs: remove-all-label
    uses: ./.github/workflows/pr-bench-sql.yml
    secrets: inherit
    with:
      matrix_preset: "pr-all"

  remove-random-access-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-random-access'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-random-access
          fail_on_error: true

  random-access-bench:
    needs: remove-random-access-label
    uses: ./.github/workflows/pr-bench-random-access.yml
    secrets: inherit

  remove-random-access-s3-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-random-access-s3'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-random-access-s3
          fail_on_error: true

  random-access-s3-bench:
    needs: remove-random-access-s3-label
    uses: ./.github/workflows/pr-bench-random-access-s3.yml
    secrets: inherit

  remove-compress-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-compress'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-compress
          fail_on_error: true

  compression-bench:
    needs: remove-compress-label
    uses: ./.github/workflows/pr-bench-compress.yml
    secrets: inherit

  remove-string-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-string'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-string
          fail_on_error: true

  string-bench:
    needs: remove-string-label
    uses: ./.github/workflows/pr-bench-string.yml
    secrets: inherit

  remove-gpu-compress-label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.label.name == 'action/bench-gpu-compress'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-gpu-compress
          fail_on_error: true

  gpu-compress-bench:
    needs: remove-gpu-compress-label
    uses: ./.github/workflows/pr-bench-gpu-compress.yml
    secrets: inherit

  remove-sql-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-sql'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-sql
          fail_on_error: true

  sql-bench:
    needs: remove-sql-label
    uses: ./.github/workflows/pr-bench-sql.yml
    secrets: inherit
    with:
      matrix_preset: "pr"

  remove-sql-compact-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-sql-compact'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-sql-compact
          fail_on_error: true

  sql-compact-bench:
    needs: remove-sql-compact-label
    uses: ./.github/workflows/pr-bench-sql.yml
    secrets: inherit
    with:
      matrix_preset: "pr-compact"

  remove-sql-extended-label:
    needs: ensure-profiling-comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && github.event.label.name == 'action/bench-sql-extended'
    steps:
      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0  # v1
        if: github.event.pull_request.head.repo.full_name == 'vortex-data/vortex'
        with:
          labels: action/bench-sql-extended
          fail_on_error: true

  sql-extended-bench:
    needs: remove-sql-extended-label
    uses: ./.github/workflows/pr-bench-sql.yml
    secrets: inherit
    with:
      matrix_preset: "pr-full"
