# Runs after every commit to `develop` (or in other words, _after_ every pull request merges).

name: Benchmarks

on:
  push:
    branches: [develop]

permissions:
  id-token: write  # enables AWS-GitHub OIDC
  actions: read
  contents: write

jobs:
  commit-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6
        with:
          role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
          aws-region: us-east-1
      - name: Upload Commit Metadata
        shell: bash
        run: |
          set -Eeu -o pipefail -x

          sudo apt-get update && sudo apt-get install -y jq
          bash scripts/commit-json.sh > new-commit.json
          bash scripts/cat-s3.sh vortex-ci-benchmark-results commits.json new-commit.json

  # Rust micro-benchmarks (random access, compression). Matrix resolved from the `micro` profile.
  bench:
    uses: ./.github/workflows/bench-core.yml
    secrets: inherit
    with:
      mode: "develop"
      profile: "micro"

  sql:
    uses: ./.github/workflows/sql-benchmarks.yml
    secrets: inherit
    with:
      mode: "develop"
      profile: "develop"
