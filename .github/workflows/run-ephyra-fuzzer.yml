name: Run ephyra fuzzer

# Random ephyra search for one target in fuzz/tests/<target>_ephyra.rs, the counterpart of
# run-fuzzer.yml for libFuzzer targets. One worker per core searches with its own seed, streaming
# progress to the log. Failures are shrunk, saved as replayable plans and filed as issues.

on:
  workflow_call:
    inputs:
      target:
        description: "Target name: the test <target> in fuzz/tests/<target>_ephyra.rs"
        required: true
        type: string
      max_minutes:
        description: "Search budget in minutes, before shrinking"
        required: false
        type: number
        default: 150
      runner:
        description: "Runner name from .github-private runs-on.yml"
        required: false
        type: string
        default: "arm64-fuzz"
      report:
        description: "Open issues for failures."
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Optimized code with the assertions and overflow checks that a debug build has.
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"

jobs:
  fuzz:
    name: "Run ${{ inputs.target }} (ephyra)"
    concurrency:
      # Queue behind a run still in progress instead of fuzzing the same target twice at once.
      group: fuzz-ephyra-${{ inputs.target }}
      cancel-in-progress: false
    timeout-minutes: 200
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/tag={2}_ephyra-fuzz', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-central-1') || 'us-east-1'), inputs.runner, inputs.target)
          || 'ubuntu-latest' }}
    env:
      FUZZ_NAME: ${{ inputs.target }}_ephyra
      TEST_NAME: ${{ inputs.target }}
      BUDGET_MINUTES: ${{ inputs.max_minutes }}
      # The default shrink budget (10,000 steps, 60 s) stops long before a minimal plan. Shrinking
      # runs after the search budget, and the job timeout leaves room for it.
      EPHYRA_SHRINK_MAX_STEPS: "2000000"
      EPHYRA_SHRINK_TIMEOUT_MS: "600000"
      EPHYRA_FAILURES: "3"
    outputs:
      failed: ${{ steps.run.outcome == 'failure' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Runs after each Fuzz Build often test the same commit, so the binary is cached by commit.
      - name: Restore property binary
        id: binary
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ephyra-bin
          key: ephyra-bin-v2-${{ inputs.target }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - uses: ./.github/actions/setup-prebuild
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          components: ""
          enable-sccache: "false"

      - name: Build property binary
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          exe=$(cargo test --locked --release -p vortex-fuzz --features ephyra \
            --test "$FUZZ_NAME" --no-run --message-format=json \
            | python3 -c 'import json, os, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("target", {}).get("name") == os.environ["FUZZ_NAME"] and m.get("executable"):
                  print(m["executable"])')
          mkdir -p ephyra-bin
          cp "$exe" "ephyra-bin/$FUZZ_NAME"

      - name: Save property binary
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ephyra-bin
          key: ephyra-bin-v2-${{ inputs.target }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Fuzz
        id: run
        run: >-
          .github/scripts/run-ephyra-fuzz.sh "$PWD/ephyra-bin/$FUZZ_NAME" "$TEST_NAME"
          "$((BUDGET_MINUTES * 60 * 1000))" "$(nproc)" "fuzz/artifacts/$FUZZ_NAME"

      - name: Summarize
        if: always() && hashFiles('ephyra-report.jsonl') != ''
        run: >-
          python3 .github/scripts/ephyra_report.py summary "${{ inputs.target }}" ephyra-report.jsonl
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ inputs.target }}-ephyra
          path: |
            ephyra-report.jsonl
            ephyra-work/
            fuzz/artifacts/${{ inputs.target }}_ephyra/
          if-no-files-found: ignore
          retention-days: ${{ steps.run.outcome == 'failure' && 90 || 7 }}

  report:
    name: "Report ${{ inputs.target }} (ephyra) failures"
    needs: fuzz
    if: always() && inputs.report && needs.fuzz.outputs.failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.target }}-ephyra
          path: report

      - name: Open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ ! -s report/ephyra-report.jsonl ]; then
            echo "::warning::No ephyra report: the job failed before the search ran."
            exit 0
          fi
          python3 .github/scripts/ephyra_report.py issues "$TARGET" report/ephyra-report.jsonl \
            --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --commit "$GITHUB_SHA" \
            --crash-dir "report/fuzz/artifacts/${TARGET}_ephyra"
