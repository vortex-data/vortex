name: Release Checks

# Checks that run before a release instead of on every pull request. Release Tag calls this
# workflow with the commit to release and tags the commit only if every job here passes.
# Every job checks out `inputs.ref`: without it, a job checks out the commit that the run started
# from, the tip of `develop`.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13

jobs:
  python-wheel-build:
    name: "Python (wheel build)"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-ci-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=python-wheel-build', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - parallel:
          - uses: ./.github/actions/setup-prebuild
            with:
              enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}
          - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
            with:
              version: 0.17.0
          - name: Install uv
            uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
            with:
              sync: false
              prune-cache: false
      # The cache key includes the rustc version, so it waits for setup-prebuild to pin the toolchain.
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          save-if: ${{ github.ref_name == 'develop' }}
      - name: Ensure wheel and sdist can be built on Linux - PyVortex
        shell: bash
        run: |
          dist_dir=$(mktemp -d "${RUNNER_TEMP}/python-dist.XXXXXX")

          uv venv
          # Build the wheel from the sdist, reusing cached dependencies outside its temporary source tree.
          uv tool run maturin@1.15.0 build --interpreter python3.11 --zig --sdist \
            --target-dir "${GITHUB_WORKSPACE}/target" --out "$dist_dir"

          shopt -s nullglob
          wheels=("$dist_dir"/*.whl)
          sdists=("$dist_dir"/*.tar.gz)

          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "Expected one wheel and one sdist:"
            ls "$dist_dir"
            exit 1
          else
            echo "Generated one wheel and one sdist"
          fi
        working-directory: vortex-python/

  rust-publish-dry-run:
    name: "Rust publish dry-run"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-xsmall/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=rust-publish-dry-run', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}
      - name: Install cargo-edit
        uses: taiki-e/cache-cargo-install-action@66c9585ef5ca780ee69399975a5e911f47905995
        with:
          tool: cargo-edit@0.13.10
      - name: Set Version
        run: |
          # This is mostly a dummy version, we don't actually publish anything but it cannot exist in crates.io
          cargo set-version --workspace 0.100000.0
      - name: Test Release
        run: |
          cargo publish --dry-run --no-verify --allow-dirty --workspace

  compat-check:
    name: "Compat check"
    uses: ./.github/workflows/compat-validation.yml
    with:
      mode: last
      ref: ${{ inputs.ref }}

  rust-test-musl:
    name: "Rust tests (linux-musl)"
    timeout-minutes: 90
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-large/image=ubuntu26-full-x64-pre-v2/tag=rust-build-musl', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    container:
      image: ghcr.io/rust-lang/rust:1-alpine3.24
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # -crt-static makes build-script binaries dynamically linked so bindgen
      # (custom-labels, a transitive dep of vortex-io) can dlopen libclang; a
      # fully static musl build script panics with "Dynamic loading not supported".
      RUSTFLAGS: "-A warnings -C target-feature=-crt-static"
    steps:
      # Exclusions:
      #   - CUDA crates have no CUDA toolkit / musl target (as in the wasm build).
      #   - vortex-duckdb and its dependents can't build standalone for musl: its
      #     build.rs has no prebuilt DuckDB for musl. The DuckDB extension builds it
      #     against a musl DuckDB it compiles itself, so it is exercised there instead.
      - name: Install Alpine packages
        # tzdata provides /usr/share/zoneinfo; without it Alpine has no timezone
        # database and datetime tests fail with "failed to find time zone `UTC`".
        run: |
          apk add --no-cache build-base clang clang-dev llvm-dev cmake make perl \
            pkgconf protobuf protobuf-dev openssl-dev zstd-dev git curl ca-certificates \
            python3 python3-dev tar tzdata bash

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install nextest
        shell: bash
        # Prebuilt static musl nextest binary; building it from source would
        # roughly double the cold-cache compile time of this job.
        run: |
          curl -LsSf https://get.nexte.st/latest/linux-musl | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Run workspace tests for x86_64-unknown-linux-musl
        shell: bash
        run: |
          cargo nextest run --cargo-profile ci --locked --workspace --no-fail-fast \
            --exclude vortex-cuda --exclude vortex-cub --exclude vortex-nvcomp \
            --exclude gpu-scan-cli --exclude vortex-test-e2e-cuda --exclude vortex-python-cuda \
            --exclude vortex-duckdb --exclude duckdb-bench --exclude vortex-sqllogictest \
            --exclude vortex-bench --exclude lance-bench --exclude datafusion-bench --exclude vortex-datafusion \
            --exclude compress-bench --exclude random-access-bench

  check-min-deps:
    name: "Check build with minimal dependencies"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-ci-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=rust-min-deps', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - run: cargo minimal-versions check --direct --workspace --ignore-private

  rust-msrv:
    name: "Rust (MSRV)"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-ci-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=rust-msrv', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    env:
      RUSTFLAGS: "-A warnings"
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Check publishable crates against the MSRV
        run: cargo hack --rust-version --no-dev-deps --ignore-private check --profile ci --all-features

  # One job for all Windows checks: a Windows instance takes 85-105s to boot, and
  # the pool keeps only one instance hot.
  windows:
    name: "Windows (x64)"
    timeout-minutes: 45
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/pool=windows-x64-pre/extras=s3-cache', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'windows-latest' }}
    env:
      # Cargo 1.100 passes rustc one `-L dependency=` per crate in its new build-dir layout, so
      # large crates exceed the Windows command line limit. Cargo falls back to an argfile, but
      # sccache expands it and fails with os error 206 (mozilla/sccache#2397). Keep the old layout
      # until sccache passes an argfile to rustc on Windows.
      __CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT: "1"
      NEXTEST_WINDOWS_ARGS: >-
        --cargo-profile ci --locked --workspace --all-features
        --exclude vortex-bench
        --exclude vortex-python
        --exclude vortex-fuzz --exclude vortex-cuda --exclude vortex-cuda-ffi
        --exclude vortex-nvcomp --exclude vortex-cub --exclude vortex-test-e2e-cuda --exclude vortex-python-cuda
        --exclude duckdb-bench
        --exclude lance-bench --exclude datafusion-bench --exclude random-access-bench
        --exclude compress-bench --exclude xtask --exclude vortex-datafusion
        --exclude gpu-scan-cli
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
          - name: Setup (Windows)
            run: |
              echo "C:\rust\cargo\bin" >> $env:GITHUB_PATH
              $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
              echo "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV
      - parallel:
          - uses: ./.github/actions/setup-prebuild
            with:
              enable-sccache: "true"
          - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
            with:
              python-version: "3.15"
          - name: Restore Cargo registry
            id: cargo-registry
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: |
                ${{ env.CARGO_HOME }}/registry/index
                ${{ env.CARGO_HOME }}/registry/cache
                ${{ env.CARGO_HOME }}/git/db
                ${{ env.CARGO_HOME }}/git/checkouts
              key: cargo-registry-v1-windows-x64-${{ hashFiles('Cargo.lock') }}
              restore-keys: cargo-registry-v1-windows-x64-

      - name: Assemblers emit reproducible code
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $ml64 = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\ml64.exe" |
            Sort-Object -Descending | Select-Object -First 1
          if (-not $ml64) { throw "ml64.exe not found" }
          echo "VORTEX_ML64=$ml64" >> $env:GITHUB_ENV
          echo "CC_MASM_ASM_x86_64_pc_windows_msvc=$env:pythonLocation\python.exe $env:GITHUB_WORKSPACE\scripts\ml64_reproducible.py" >> $env:GITHUB_ENV
          echo "NASMENV=--reproducible" >> $env:GITHUB_ENV

      - name: Build Rust Tests (Windows)
        id: build-tests
        env: &windows-test-env
          # Stable proc-macro DLL contents let dependent crates reuse sccache entries.
          # duckdb_static.lib is built with /MT and thus requires crt-static
          RUSTFLAGS: "-C link-arg=/Brepro -C target-feature=+crt-static"
        run: cargo nextest run --no-run @($env:NEXTEST_WINDOWS_ARGS -split ' ')

      - name: Run Rust Tests (Windows)
        id: tests
        if: ${{ !cancelled() && steps.build-tests.outcome == 'success' }}
        env: *windows-test-env
        run: cargo nextest run --no-fail-fast @($env:NEXTEST_WINDOWS_ARGS -split ' ')

      - name: Save Cargo registry
        if: ${{ !cancelled() && steps.cargo-registry.outputs.cache-hit != 'true' && (steps.build-tests.outcome == 'success' || steps.build-tests.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
            ${{ env.CARGO_HOME }}/git/checkouts
          key: ${{ steps.cargo-registry.outputs.cache-primary-key }}

      # The test outputs fill the default disk, and the wheel build cannot reuse
      # them: it uses other RUSTFLAGS and its own target directory.
      - name: Delete the Rust test outputs
        if: ${{ !cancelled() && (steps.build-tests.outcome == 'success' || steps.build-tests.outcome == 'failure') }}
        shell: cmd
        run: if exist target\ci rmdir /s /q target\ci

      # Mirrors the wheel build in package.yml, which spells the Windows interpreter
      # `python` because maturin has no `python3.11` executable to resolve there.
      - name: Build wheel
        id: wheel
        # Build the wheel also when a Rust test fails, but not when the setup failed.
        if: ${{ !cancelled() && (steps.build-tests.outcome == 'success' || steps.build-tests.outcome == 'failure') }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          command: build
          maturin-version: 1.16.0
          target: x86_64-pc-windows-msvc
          args: >
            --profile ci
            --manifest-path vortex-python/Cargo.toml
            --out dist
            --interpreter python
        env:
          # Keep this constant to avoid pyo3 invalidating itself
          PYO3_ENVIRONMENT_SIGNATURE: "cpython3"
          # Also applies to host proc-macro links when Cargo receives an explicit target.
          LINK: /Brepro

      # The Rust tests exclude vortex-python, so this is the only check that the
      # win_amd64 wheel imports and can round-trip a file. Runs outside the checkout so
      # the repo-root `vortex/` crate directory cannot shadow the installed package.
      - name: Import and round-trip the wheel
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import pyarrow as pa

          import vortex as vx

          table = pa.table({"a": [1, 2, 3], "b": ["x", "y", "z"]})
          vx.io.write(table, "smoke.vortex")
          # Vortex reads utf8 back as string_view, so compare column-wise rather than by table.
          round_tripped = vx.open("smoke.vortex").to_arrow().read_all()
          assert round_tripped.column_names == table.column_names
          assert round_tripped.column("a").to_pylist() == [1, 2, 3]
          assert round_tripped.column("b").to_pylist() == ["x", "y", "z"]
          print("vortex", vx.__version__, "round-tripped a file on Windows")
          PY

      - name: sccache stats
        if: always() && github.repository == 'vortex-data/vortex'
        run: sccache --show-stats

  # Runs the crates with hand-written SIMD kernels on EC2 instance families chosen for
  # their CPU features, so that every runtime-dispatched kernel tier is exercised:
  #   c6a (AMD Zen 3): AVX2 and BMI2, no AVX-512
  #   c6i (Intel Ice Lake): AVX-512 F/BW/VBMI2/VPOPCNTDQ
  #   c8g (Graviton4, Neoverse V2): SVE2 with BITPERM
  # `VORTEX_EXPECT_CPU_FEATURES` lists every feature the instance must have; vortex-array-macros'
  # `cpu_features` test fails if any of them is missing or any other known feature (e.g.
  # AVX-512 on the avx2 entry) is detected.
  rust-test-cpu-features:
    name: "Rust tests (cpu-features, ${{ matrix.config.name }})"
    if: github.repository == 'vortex-data/vortex'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: avx2
            runner: amd64-ci-medium
            family: c6a.2xlarge
            image: ubuntu26-full-x64-pre-v2
            expect: "sse2,popcnt,bmi1,bmi2,avx,avx2"
          - name: avx512
            runner: amd64-ci-medium
            family: c6i.2xlarge
            image: ubuntu26-full-x64-pre-v2
            expect: "sse2,popcnt,bmi1,bmi2,avx,avx2,avx512f,avx512bw,avx512vbmi2,avx512vpopcntdq"
          - name: sve
            runner: arm64-medium
            family: c8g.2xlarge
            image: ubuntu26-full-arm64-pre-v2
            expect: "neon,sve,sve2,sve2-bitperm"
    runs-on: >-
      runs-on=${{ github.run_id }}/region=${{ vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1' }}/runner=${{ matrix.config.runner }}/family=${{ matrix.config.family }}/spot=price-capacity-optimized/image=${{ matrix.config.image }}/extras=s3-cache/tag=rust-test-cpu-features-${{ matrix.config.name }}
    env:
      VORTEX_EXPECT_CPU_FEATURES: ${{ matrix.config.expect }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      # Print the detected features and fail fast if the instance is not the expected tier.
      - name: Check CPU features
        run: |
          cargo nextest run --cargo-profile ci --locked --no-capture \
            -p vortex-array-macros --test cpu_features
      - name: Rust Tests
        run: |
          cargo nextest run --cargo-profile ci --locked --no-fail-fast \
            -p vortex-buffer -p vortex-mask -p vortex-array

  rust-test-sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # We don't run memory sanitizer as it provides many false positives
          # for std
          - sanitizer: asan
            sanitizer_flags: "-Zsanitizer=address,leak"
          - sanitizer: tsan
            sanitizer_flags: "-Zsanitizer=thread"
    name: "Rust tests (${{ matrix.sanitizer }})"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=rust-test-sanitizer', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: "symbolize=1:check_initialization_order=1:detect_leaks=1:leak_check_at_exit=1"
      LSAN_OPTIONS: "report_objects=1"
      ASAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      MSAN_OPTIONS: "symbolize=1"
      MSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      TSAN_OPTIONS: "symbolize=1:suppressions=${{ github.workspace }}/vortex-ffi/tsan_suppressions.txt"
      TSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      VORTEX_SKIP_SLOW_TESTS: "1"
      # VortexError backtrace capture is very slow under the sanitizers.
      RUST_LIB_BACKTRACE: "0"
      # -Cunsafe-allow-abi-mismatch=sanitizer: libraries like compiler_builtins
      # unset -Zsanitizer flag and we should allow that.
      RUSTFLAGS: "-A warnings -Cunsafe-allow-abi-mismatch=sanitizer -C debuginfo=2 -C opt-level=0 -C strip=none"
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install Rust nightly toolchain
        run: |
          rustup toolchain install $NIGHTLY_TOOLCHAIN
          rustup component add --toolchain $NIGHTLY_TOOLCHAIN rust-src rustfmt clippy llvm-tools-preview
      - name: Build tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN build --tests --locked --all-features \
            --target x86_64-unknown-linux-gnu -Zbuild-std \
            -p vortex-buffer -p vortex-fastlanes -p vortex-fsst -p vortex-alp -p vortex-array

      - name: Run tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN nextest run --locked --all-features --no-fail-fast \
            --target x86_64-unknown-linux-gnu -Zbuild-std \
            -p vortex-buffer -p vortex-fastlanes -p vortex-fsst -p vortex-alp -p vortex-array

        # cargo nextest reports less sanitizer issues than cargo test
        # --tests skips doctests: rustdoc ignores RUSTFLAGS (it uses RUSTDOCFLAGS),
        # so doctests would build vortex-ffi without -Zsanitizer and mismatch the
        # sanitizer-built deps.
      - name: Run vortex-ffi tests with sanitizer
        run: |
          RUSTFLAGS="${RUSTFLAGS} ${{ matrix.sanitizer_flags }}" \
          cargo +$NIGHTLY_TOOLCHAIN test --locked \
            --target x86_64-unknown-linux-gnu --no-fail-fast -Zbuild-std \
            -p vortex-ffi --tests -- --no-capture

  rust-ffi-test-sanitizer:
    strategy:
      fail-fast: false
      matrix:
        include:
          # We don't run memory sanitizer as it's clang-only and provides many
          # false positives for Catch2
          - sanitizer: asan
          - sanitizer: tsan
    name: "Rust/C++ FFI tests (${{ matrix.sanitizer }})"
    # Allow cold builds of Rust's sanitizer-instrumented standard library.
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: "symbolize=1:check_initialization_order=1:detect_leaks=1:leak_check_at_exit=1"
      LSAN_OPTIONS: "report_objects=1"
      ASAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      MSAN_OPTIONS: "symbolize=1"
      MSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      TSAN_OPTIONS: "symbolize=1:suppressions=${{ github.workspace }}/vortex-ffi/tsan_suppressions.txt"
      TSAN_SYMBOLIZER_PATH: "/usr/bin/llvm-symbolizer"
      VORTEX_SKIP_SLOW_TESTS: "1"
      # Symbolizing error backtrace in debug .so is slow
      RUST_LIB_BACKTRACE: 0
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu26-full-x64-pre-v2/tag=rust-ffi-test-sanitizer', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: "rust-src, rustfmt, clippy, llvm-tools-preview"
      - name: Build FFI library, tests, and examples
        working-directory: vortex-ffi
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY_TOOLCHAIN }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_LINKER_TYPE=MOLD \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DVORTEX_SANITIZER=${{ matrix.sanitizer }} \
            -DVORTEX_SANITIZE_RUST_STD=ON \
            -DVORTEX_BUILD_TESTS=ON \
            -DVORTEX_BUILD_EXAMPLES=ON
          cmake --build build --parallel "$(nproc)"
      - name: Run tests
        run: |
          set -o pipefail
          ./vortex-ffi/build/test/vortex_ffi_test
      - name: Run examples
        run: |
          set -o pipefail

          ./vortex-ffi/build/examples/write_sample file.vortex
          ./vortex-ffi/build/examples/write_sample file2.vortex
          ./vortex-ffi/build/examples/dtype '*.vortex'
          ./vortex-ffi/build/examples/scan '*.vortex'
          ./vortex-ffi/build/examples/scan_to_arrow '*.vortex'

  miri:
    name: "Rust tests (miri)"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu26-full-x64-pre-v2/tag=rust-miri', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-disable-isolation -Zmiri-env-forward=RUST_BACKTRACE
      RUSTFLAGS: "-A warnings"
      RUST_BACKTRACE: full
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install nightly with miri
        run: rustup toolchain install $NIGHTLY_TOOLCHAIN --component rust-src,rustfmt,clippy,miri
      - name: Run Miri
        run: cargo +$NIGHTLY_TOOLCHAIN miri nextest run --no-fail-fast -p vortex-buffer -p vortex-ffi

  build-rust:
    name: "Rust build (${{matrix.config.name}})"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag={2}', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'), matrix.config.runner, matrix.config.name)
          || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "all-features"
            runner: amd64-ci-large
            args: "--all-features --all-targets"
          - name: "with tokio dispatcher"
            runner: amd64-ci-small
            # Only build the crates that have the tokio features, not re-building other crates with no-default-features
            args: "--no-default-features --features tokio --all-targets -p vortex -p vortex-io -p vortex-file -p vortex-layout"
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      # Feature-unification errors appear at type check. Codegen and linking add most of the
      # time and sccache cannot cache links; the test jobs link the workspace already.
      - uses: ./.github/actions/check-rebuild
        with:
          command: "cargo hack check --profile ci --locked ${{matrix.config.args}} --ignore-private"
      - name: "Make sure no files changed after build"
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: sccache stats
        if: always() && github.repository == 'vortex-data/vortex'
        run: sccache --show-stats

  rust-lint-no-default:
    name: "Rust (lint, no default)"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-ci-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=rust-lint-no-default', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Rust Lint - Clippy No Default Features
        shell: bash
        run: |
          cargo hack --no-dev-deps --ignore-private clippy --profile ci --no-default-features -- -D warnings

  rust-test-linux-arm64:
    name: "Rust tests (linux-arm64)"
    if: github.repository == 'vortex-data/vortex'
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}/region=${{ vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1' }}/runner=arm64-ci-test/image=ubuntu26-full-arm64-pre-v2/extras=s3-cache/tag=rust-test-linux-arm64
    steps:
      - parallel:
          - uses: runs-on/action@v2
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Rust Tests
        run: |
          cargo nextest run --cargo-profile ci --locked --workspace --all-features --no-fail-fast --exclude vortex-bench --exclude xtask --exclude vortex-sqllogictest
      - uses: ./.github/actions/check-rebuild
        with:
          command: "cargo test --profile ci --locked --workspace --all-features --no-run --exclude vortex-bench --exclude xtask --exclude vortex-sqllogictest"
