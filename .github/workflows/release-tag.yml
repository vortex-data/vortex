name: Release Tag

# Step 1 of a release: tag a commit on `develop` with the version of the draft release.
# Step 2 is the Release Binaries workflow, which takes the tag that this workflow creates.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit on develop to release (full or abbreviated SHA)"
        required: true
        type: string
      tag:
        description: "Tag of the draft release to use; leave empty to use the only draft release"
        required: false
        type: string
        default: ""

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Listing draft releases requires write access.
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Resolve commit and draft release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ inputs.commit }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]] || {
            echo "Commit must be a hexadecimal SHA, got '$COMMIT'" >&2
            exit 1
          }
          sha=$(gh api "repos/$GH_REPO/commits/$COMMIT" --jq .sha)

          status=$(gh api "repos/$GH_REPO/compare/$sha...develop" --jq .status)
          [[ "$status" == "ahead" || "$status" == "identical" ]] || {
            echo "Commit $sha is not on develop (compare status: $status)" >&2
            exit 1
          }

          drafts=$(gh release list --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName]')
          if [[ -z "$TAG" ]]; then
            count=$(jq length <<< "$drafts")
            [[ "$count" -eq 1 ]] || {
              echo "Expected exactly one draft release, found $count: $drafts. Set the tag input." >&2
              exit 1
            }
            TAG=$(jq -r '.[0]' <<< "$drafts")
          else
            jq -e --arg tag "$TAG" 'index($tag) != null' <<< "$drafts" > /dev/null || {
              echo "No draft release has tag $TAG. Draft releases: $drafts" >&2
              exit 1
            }
          fi
          git check-ref-format "refs/tags/$TAG"

          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Release checks go here as jobs that need `prepare`, check out
  # `needs.prepare.outputs.sha`, and are listed in the `needs` of `tag`.

  tag:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Creating the ref fails if the tag appeared while the checks ran.
          gh api "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA" > /dev/null
          {
            echo "Created tag \`$RELEASE_TAG\` at \`$RELEASE_SHA\`."
            echo "Next, run the Release Binaries workflow with tag \`$RELEASE_TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
