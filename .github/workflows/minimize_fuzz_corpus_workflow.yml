name: Minimize Fuzz Corpus

on:
  workflow_call:
    inputs:
      fuzz_target:
        description: "The cargo fuzz target name (e.g., file_io, array_ops, compress_roundtrip)"
        required: true
        type: string
      fuzz_name:
        description: "Display/storage name. Defaults to fuzz_target."
        required: false
        type: string
        default: ""
      runner:
        description: "Runner name from .github-private runs-on.yml"
        required: false
        type: string
        default: "arm64-medium"
      extra_features:
        description: "Extra cargo features to enable (e.g., cuda)"
        required: false
        type: string
        default: ""
      extra_env:
        description: "Extra environment variables for the fuzzer"
        required: false
        type: string
        default: ""
      shards:
        description: "Concurrent minimization shards (use one for GPU)"
        required: false
        type: number
        default: 8
      fuzzer_artifact:
        description: "Precompiled CPU fuzzers; builds locally when omitted"
        required: false
        type: string
        default: ""
    secrets:
      R2_FUZZ_ACCESS_KEY_ID:
        required: true
      R2_FUZZ_SECRET_ACCESS_KEY:
        required: true

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-09-10

jobs:
  minimize:
    name: "Minimize ${{ inputs.fuzz_name || inputs.fuzz_target }}"
    concurrency:
      group: fuzz-corpus-${{ inputs.fuzz_name || inputs.fuzz_target }}
      cancel-in-progress: false
      queue: max
    env:
      FUZZ_NAME: ${{ inputs.fuzz_name || inputs.fuzz_target }}
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/volume=200gb/tag={2}-minimize', github.run_id, inputs.runner, inputs.fuzz_name || inputs.fuzz_target)
          || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - name: Bail if not on develop
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Corpus minimization should only run on the develop branch (current: ${{ github.ref }})"
          exit 1

      - uses: runs-on/action@v2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-fuzz-llvm

      - name: Build or restore fuzzer
        if: inputs.fuzzer_artifact == ''
        uses: ./.github/actions/build-fuzzers
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          runner: ${{ inputs.runner }}
          fuzz_target: ${{ inputs.fuzz_target }}
          extra_features: ${{ inputs.extra_features }}

      - name: Download precompiled fuzzers
        if: inputs.fuzzer_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.fuzzer_artifact }}

      - name: Extract precompiled fuzzers
        if: inputs.fuzzer_artifact != ''
        run: |
          tar -xf cpu-fuzzers.tar.zst
          rm cpu-fuzzers.tar.zst

      - name: Restore corpus
        id: corpus
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: .github/scripts/restore-fuzz-corpus.sh minimize

      - name: Minimize corpus
        if: steps.corpus.outputs.found == 'true'
        shell: bash
        env:
          FUZZ_TARGET: ${{ inputs.fuzz_target }}
          EXTRA_ENV: ${{ inputs.extra_env }}
          MINIMIZE_SHARDS: ${{ inputs.shards }}
        run: .github/scripts/minimize-fuzz-corpus.sh

      - name: Persist corpus
        if: steps.corpus.outputs.found == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FUZZ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FUZZ_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
          AWS_ENDPOINT_URL: "https://01e9655179bbec953276890b183039bc.r2.cloudflarestorage.com"
        run: >-
          .github/scripts/checkpoint-fuzz-corpus.sh
          "fuzz/corpus/$FUZZ_NAME" "${FUZZ_NAME}_corpus.tar.zst" "$RUNNER_TEMP/${FUZZ_NAME}.etag" minimize

      - name: Upload minimization log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ inputs.fuzz_name || inputs.fuzz_target }}-minimization-log
          path: |
            fuzz-minimize.log
            fuzz/minimize/${{ env.FUZZ_NAME }}/**/*.log
            fuzz/artifacts/${{ env.FUZZ_NAME }}/
          if-no-files-found: ignore
          retention-days: 14
