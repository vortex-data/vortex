# Runs benchmarks on `develop`, dispatched every three hours by `develop-bench-trigger.yml`
# whenever new commits have landed on `develop` (or manually via `workflow_dispatch` on `develop`).
# `develop-bench-on-merge.yml` also dispatches it with `sha` set for each merged PR labelled
# `action/bench-on-merge`, so that PR's merge commit gets results of its own.

name: Develop Benchmarks
# The trigger workflows find runs of a given commit by this title as well as by `head_sha`, which
# is develop HEAD at dispatch time rather than `inputs.sha`.
run-name: Develop Benchmarks${{ inputs.sha && format(' for {0}', inputs.sha) || '' }}

# Runs for a given commit get a group of their own, so a labelled PR's run is never replaced by
# a scheduled run waiting in the shared develop group.
concurrency:
  group: develop-bench-${{ inputs.sha || github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on develop to benchmark; empty benchmarks develop HEAD"
        required: false
        type: string
        default: ""

permissions:
  id-token: write  # enables AWS-GitHub OIDC
  actions: read
  contents: write

jobs:
  # Resolves the commit to benchmark, refusing any that is not on develop so that results are
  # never ingested for a commit outside develop's history.
  resolve:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -Eeuo pipefail
          if [ -z "${INPUT_SHA}" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA, got '${INPUT_SHA}'"
            exit 1
          fi
          status="$(gh api "repos/${GH_REPO}/compare/${INPUT_SHA}...${GITHUB_SHA}" --jq '.status')"
          if [ "${status}" != "ahead" ] && [ "${status}" != "identical" ]; then
            echo "::error::${INPUT_SHA} is not on develop (compare status: ${status})"
            exit 1
          fi
          echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 60
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-bench/extras=s3-cache/tag={1}', github.run_id, matrix.benchmark.id)
          || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - id: random-access-bench
            build_args: "--features lance"
          - id: compress-bench
            build_args: "--features lance"
          - id: string-bench
            build_args: ""
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ needs.resolve.outputs.sha }}
      - parallel:
          - uses: ./.github/actions/assert-cpu
            if: github.repository == 'vortex-data/vortex'
          - uses: ./.github/actions/setup-prebuild
            with:
              repo-token: ${{ secrets.GITHUB_TOKEN }}
              enable-sccache: ${{ github.repository == 'vortex-data/vortex' && 'true' || 'false' }}
      - name: Build binary
        shell: bash
        env:
          RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
        run: |
          cargo build --bin ${{ matrix.benchmark.id }} --profile release_debug ${{ matrix.benchmark.build_args }}
      - name: Upload benchmark binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ matrix.benchmark.id }}-binary
          path: target/release_debug/${{ matrix.benchmark.id }}

  # The debuginfo upload takes minutes. Running it in its own job keeps it off the path to the
  # bench job; Polar Signals matches debuginfo to profiles by build ID whenever it lands.
  upload-debuginfo:
    needs: [resolve, build]
    if: github.repository == 'vortex-data/vortex'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        benchmark: [random-access-bench, compress-bench, string-bench]
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region=us-east-1/runner=arm64-fuzz/image=ubuntu26-full-arm64-pre-v2/extras=s3-cache/tag=upload-debuginfo-{1}', github.run_id, matrix.benchmark)
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          # Wires up the RunsOn artifact proxy that download-artifact uses.
          - uses: runs-on/action@v2
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ needs.resolve.outputs.sha }}
      - name: Download benchmark binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ matrix.benchmark }}-binary
          path: target/release_debug/
      - name: Pre-upload benchmark debuginfo to Polar Signals
        uses: ./.github/actions/upload-parca-debuginfo
        continue-on-error: true
        with:
          paths: |
            target/release_debug/${{ matrix.benchmark }}
          polarsignals-cloud-token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
          project-id: "e5d846e1-b54c-46e7-9174-8bf055a3af56"

  bench:
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    timeout-minutes: 120
    # An `nvme_region` entry runs in the first region of `BENCH_NVME_REGIONS`, as the SQL NVMe
    # entries do; the others stay in us-east-1. The us-east-1 build reaches every region, because
    # GitHub holds the artifacts. See the `runs-on` comment in sql-bench-matrix.yml.
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/region={3}/runner=bench-dedicated/family=c8gd.metal-24xl/image=ubuntu26-full-arm64-pre-v2/extras=s3-cache/tag={1}{2}', github.run_id, matrix.benchmark.id, matrix.benchmark.variant_id, matrix.benchmark.nvme_region && fromJSON(vars.BENCH_NVME_REGIONS || '["us-east-1"]')[0] || 'us-east-1')
          || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # With the SQL hosts below, a run holds at most six metal hosts at once by default. See
      # `max-parallel` in sql-bench-matrix.yml.
      max-parallel: 2
      matrix:
        benchmark:
          - id: random-access-bench
            name: Random Access
            build_args: "--features lance"
            v4_ingest: true
          # Same benchmark, reading the data from S3 instead of local NVMe.
          - id: random-access-bench
            variant_id: "-s3"
            name: Random Access (S3)
            build_args: "--features lance"
            v4_ingest: true
            remote_data_dir: s3://vortex-public-benchmark-fixtures/random-access/v1/
          # Compression and String Encoding read no data from S3, so they need no host next to
          # the us-east-1 buckets.
          - id: compress-bench
            name: Compression
            build_args: "--features lance"
            v4_ingest: true
            nvme_region: true
          - id: string-bench
            name: String Encoding
            v4_ingest: true
            nvme_region: true
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
            with:
              ref: ${{ needs.resolve.outputs.sha }}

      # Every install and download below is independent of the others.
      - parallel:
          - name: Install DuckDB
            uses: ./.github/actions/setup-duckdb
          - uses: ./.github/actions/system-info
          - name: Download benchmark binary
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
            with:
              name: ${{ matrix.benchmark.id }}-binary
              path: target/release_debug/
          - name: Setup Polar Signals
            uses: polarsignals/gh-actions-ps-profiling@cd2cb45af81fbe1ca629c2ac479348207598160e  # v0.9.0
            # Profiling is observability only, so a flaky agent download must not fail the benchmark.
            continue-on-error: true
            with:
              polarsignals_cloud_token: ${{ secrets.POLAR_SIGNALS_API_KEY }}
              labels: "branch=${{ github.ref_name }};gh_run_id=${{ github.run_id }};commit_sha=${{ needs.resolve.outputs.sha }};benchmark=${{ matrix.benchmark.id }}"
              project_uuid: "e5d846e1-b54c-46e7-9174-8bf055a3af56"
              job_name: "${{ matrix.benchmark.id }}"
              profiling_frequency: 199
              extra_args: "--debuginfo-strip=false"
              parca_agent_version: "0.49.0"
          - name: Setup AWS CLI
            if: matrix.benchmark.remote_data_dir == null
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
            with:
              role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
              aws-region: us-east-1
          - name: Install uv for LitData
            if: matrix.benchmark.id == 'random-access-bench' && matrix.benchmark.remote_data_dir == null
            uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
            with:
              sync: false
          # Parquet and LitData do not depend on Vortex code, so they are cached; LitData alone is
          # about 80% of data generation time. Vortex, Arrow IPC and Lance are written every run.
          # The key covers the dataset generators, the crates that write and seed the Parquet files,
          # and the LitData conversion. Keep the litdata version in sync with the Install LitData step.
          - name: Compute benchmark data cache key
            id: data-cache-key
            if: matrix.benchmark.id == 'random-access-bench' && matrix.benchmark.remote_data_dir == null
            shell: bash
            run: |
              set -Eeu -o pipefail
              crates=$(awk '/^\[\[package\]\]/ { name = "" }
                /^name = / { name = $3 }
                /^version = / && name ~ /^"(parquet|arrow-.*|rand.*)"$/ { print name, $3 }' Cargo.lock \
                | sort | sha256sum | cut -c1-16)
              echo "crates=$crates" >> "$GITHUB_OUTPUT"

      # These need the binary, uv, or the cache key from the group above.
      - parallel:
          - name: Make benchmark binary executable
            shell: bash
            run: chmod +x target/release_debug/${{ matrix.benchmark.id }}
          - name: Install LitData
            # LitData is Python-only, so random-access-bench times it through
            # scripts/litdata-random-access.py, run by the interpreter named in LITDATA_PYTHON.
            if: matrix.benchmark.id == 'random-access-bench' && matrix.benchmark.remote_data_dir == null
            shell: bash
            run: |
              set -Eeu -o pipefail -x

              uv venv --python 3.12 .venv-litdata
              uv pip install --python .venv-litdata \
                --index-strategy unsafe-best-match \
                --extra-index-url https://download.pytorch.org/whl/cpu \
                litdata==0.2.76 torch pyarrow numpy
              echo "LITDATA_PYTHON=$PWD/.venv-litdata/bin/python" >> "$GITHUB_ENV"
          - name: Restore benchmark data
            id: data-cache
            if: matrix.benchmark.id == 'random-access-bench' && matrix.benchmark.remote_data_dir == null
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: |
                vortex-bench/data/taxi/taxi.parquet
                vortex-bench/data/random_access/*/*.parquet
                vortex-bench/data/random_access/*/*.litdata
              key: >-
                random-access-data-v1-local-litdata0.2.76-${{ steps.data-cache-key.outputs.crates }}-${{
                  hashFiles(
                    'vortex-bench/src/datasets/**',
                    'vortex-bench/src/random_access/**',
                    'vortex-bench/src/utils/parquet.rs',
                    'scripts/litdata-random-access.py',
                    'benchmarks/random-access-bench/src/litdata.rs') }}
          # string-bench reads most of its columns from Hugging Face, which rate limits
          # unauthenticated downloads. The key covers the sources and row caps in lib.rs and the
          # shared Parquet writer settings, whose layout version decides when a file is stale.
          - name: Restore string-bench data
            id: string-data-cache
            if: matrix.benchmark.id == 'string-bench'
            uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: vortex-bench/data/string-bench/*.parquet
              key: >-
                string-bench-data-v1-${{ hashFiles(
                  'benchmarks/string-bench/src/lib.rs',
                  'vortex-bench/src/utils/parquet.rs') }}

      # Download and convert all benchmark data up front, so the benchmark step below only
      # contains timed runs. The data is written with the same settings the benchmark uses.
      - name: Generate ${{ matrix.benchmark.name }} data
        if: matrix.benchmark.remote_data_dir == null
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          bench="${{ matrix.benchmark.id }}"
          python3 "scripts/${bench%-bench}-split.py" --prepare-data

      # Save the data cache before setup-benchmark.sh pins processes to the housekeeping CPUs.
      - parallel:
          - name: Save benchmark data
            if: >-
              matrix.benchmark.id == 'random-access-bench' && matrix.benchmark.remote_data_dir == null
              && steps.data-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: |
                vortex-bench/data/taxi/taxi.parquet
                vortex-bench/data/random_access/*/*.parquet
                vortex-bench/data/random_access/*/*.litdata
              key: ${{ steps.data-cache.outputs.cache-primary-key }}
          - name: Save string-bench data
            if: matrix.benchmark.id == 'string-bench' && steps.string-data-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
            with:
              path: vortex-bench/data/string-bench/*.parquet
              key: ${{ steps.string-data-cache.outputs.cache-primary-key }}

      - name: Setup benchmark environment
        run: sudo bash scripts/setup-benchmark.sh

      - name: Run ${{ matrix.benchmark.name }} benchmark (per-combination)
        if: matrix.benchmark.id == 'random-access-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
          AWS_REGION: "us-east-1"
          AWS_SKIP_SIGNATURE: ${{ matrix.benchmark.remote_data_dir != null }}
        run: |
          python3 scripts/random-access-split.py --emit-ingest-records \
            ${{ matrix.benchmark.remote_data_dir && format('--remote-data-dir {0}', matrix.benchmark.remote_data_dir) || '' }}

      - name: Run ${{ matrix.benchmark.name }} benchmark (per-dataset)
        if: matrix.benchmark.id == 'compress-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
        run: |
          python3 scripts/compress-split.py --formats arrow-ipc,parquet,lance,vortex --emit-ingest-records

      - name: Run ${{ matrix.benchmark.name }} benchmark (per-column-encoder)
        if: matrix.benchmark.id == 'string-bench'
        shell: bash
        env:
          RUST_BACKTRACE: full
          FLAT_LAYOUT_INLINE_ARRAY_NODE: "1"
        run: |
          python3 scripts/string-split.py

      # v4 (Postgres) ingest -- the REQUIRED benchmark-results pipeline feeding the live
      # benchmarks website for suites that emit v4 records; a failure here fails the job.
      # Also gated on the ingest-role ARN var (the assume-role input that MUST exist for
      # OIDC to succeed). post-ingest.py mints the RDS IAM token internally (boto3) from
      # the assumed GitHubBenchmarkIngestRole; sslmode=verify-full validates the cert.
      #
      # `sync: false` -- the ingest runs `uv run --no-project --with`, which needs only
      # the uv binary, never the synced workspace. A full sync would rebuild
      # vortex-python via sccache->S3, which fails under the ingest-role creds
      # (rds-db:connect only) and is pure waste here.
      - name: Install uv for v4 ingest
        if: vars.GH_BENCH_INGEST_ROLE_ARN != '' && matrix.benchmark.v4_ingest
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false
      - name: Configure AWS credentials for v4 ingest (OIDC)
        if: vars.GH_BENCH_INGEST_ROLE_ARN != '' && matrix.benchmark.v4_ingest
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: ${{ vars.GH_BENCH_INGEST_ROLE_ARN }}
          aws-region: ${{ vars.RDS_BENCH_REGION }}
      - name: Ingest results to v4 Postgres
        if: vars.GH_BENCH_INGEST_ROLE_ARN != '' && matrix.benchmark.v4_ingest
        shell: bash
        env:
          RDS_BENCH_INSTANCE_ENDPOINT: ${{ vars.RDS_BENCH_INSTANCE_ENDPOINT }}
          RDS_BENCH_DB_NAME: ${{ vars.RDS_BENCH_DB_NAME }}
          AWS_REGION: ${{ vars.RDS_BENCH_REGION }}
        run: |
          set -Eeuo pipefail
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o "${RUNNER_TEMP}/rds-global-bundle.pem"
          DSN="postgresql://bench_ingest@${RDS_BENCH_INSTANCE_ENDPOINT}:5432/${RDS_BENCH_DB_NAME}?sslmode=verify-full&sslrootcert=${RUNNER_TEMP}/rds-global-bundle.pem"
          uv run --no-project --with 'psycopg[binary]' --with boto3 --with xxhash \
            scripts/post-ingest.py results.ingest.jsonl \
            --postgres "${DSN}" \
            --commit-sha "${{ needs.resolve.outputs.sha }}" \
            --branch "${{ github.ref_name }}" \
            --region "${AWS_REGION}"

      - name: Alert incident.io
        if: failure()
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
          alert-title: "${{ matrix.benchmark.name }} benchmark failed on develop"
          deduplication-key: ci-bench-${{ matrix.benchmark.id }}-failure

  sql:
    needs: resolve
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/sql-bench-matrix.yml
    secrets: inherit
    with:
      mode: "develop"
      commit_sha: ${{ needs.resolve.outputs.sha }}
      matrix_preset: "develop"
      max_parallel: ${{ fromJSON(vars.BENCH_MAX_PARALLEL || '4') }}

  # Tell the benchmarks website that new results exist, once per run, after every benchmark job
  # of the run has ingested its results. `always()` runs it even when a benchmark job failed, so
  # the results that other jobs ingested still appear.
  refresh-site:
    needs: [bench, sql]
    if: ${{ always() && github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/refresh-bench-site.yml
    secrets:
      BENCH_REVALIDATE_TOKEN: ${{ secrets.BENCH_REVALIDATE_TOKEN }}
