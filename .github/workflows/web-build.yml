name: Build Vortex Explorer

# The docs' Vercel project serves the Explorer: under /explorer/ on the docs
# and their previews, and at the root of explore.vortex.dev (see
# docs/vercel-output-config.json). So the artifact holds an explorer/
# directory, which the deploy merges into the docs build.
on:
  workflow_call:
    outputs:
      artifact-id:
        description: "Explorer artifact for this build"
        value: ${{ jobs.build.outputs.artifact-id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        working-directory: vortex-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install wasm-pack
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3
      # Vite runs on Node, and Bun runs its scripts with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Put the build under explorer/
        run: mkdir site && mv dist site/explorer
      - name: Upload build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: vortex-explorer-${{ github.run_attempt }}
          path: vortex-web/site
          if-no-files-found: error
          retention-days: 7
