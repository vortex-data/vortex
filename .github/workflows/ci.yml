name: Linters and Tests

# Concurrency control:
# - PRs: new commits on a feature branch will cancel in-progress (outdated) runs.
# - Push to develop: runs queue sequentially, never cancelled.
# - `workflow_dispatch`: groups by branch and queues if run on develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
on:
  push:
    branches: [develop]
  pull_request: { }
  workflow_dispatch: { }

permissions:
  actions: read
  contents: read
  checks: write  # audit-check creates checks
  issues: write  # audit-check creates issues

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NIGHTLY_TOOLCHAIN: nightly-2026-02-05

jobs:
  duckdb-mirror:
    name: "Mirror DuckDB to R2"
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/duckdb-r2.yml
    secrets: inherit

  duckdb-ready:
    name: "DuckDB libraries available in R2"
    needs: duckdb-mirror
    if: "!cancelled()"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify DuckDB mirror
        if: needs.duckdb-mirror.result == 'failure'
        run: |
          echo "DuckDB mirror failed; downstream builds would 404"
          exit 1

  lint-toml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: spiraldb/actions/.github/actions/lint-toml@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6

  validate-workflow-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Validate YAML file
        run: |
          # Lint the workflows and yamllint's configuration file.
          yamllint \
            --strict \
            -c .yamllint.yaml \
            .github/

  python-lint:
    name: "Python (lint)"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=python-lint', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      # Use uvx for ruff to avoid building the Rust extension (saves ~4.5 min)
      - name: Python Lint - Format
        run: uvx ruff format --check .
      - name: Python Lint - Ruff
        run: uvx ruff check .
      # PyRight needs the project for type information, so use uv run
      - name: Python Lint - PyRight
        env:
          MATURIN_PEP517_ARGS: "--profile ci"
        run: |
          uv sync --all-packages
          uv run basedpyright vortex-python

  python-test:
    name: "Python (test)"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-large/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=python-test', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      RUST_LOG: "info,maturin=off,uv=debug"
      MATURIN_PEP517_ARGS: "--profile ci"
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"

      - name: Pytest - Vortex
        run: |
          uv run --all-packages pytest --benchmark-disable -n auto test/
        working-directory: vortex-python/

      # The datasets integration relies on private `datasets` APIs, so exercise the oldest
      # supported release in addition to the locked one.
      - name: Pytest - Vortex (datasets 4.x floor)
        run: |
          uv run --all-packages --with 'datasets==4.0.0' --with 'huggingface-hub<1' \
            pytest --benchmark-disable test/test_hf_datasets.py
        working-directory: vortex-python/

      - name: Doctest - PyVortex
        run: |
          uv run --all-packages make doctest
        working-directory: docs/

      - name: Ensure docs build - PyVortex
        run: |
          uv run --all-packages make html
        working-directory: docs/

      # Keep this last: setup-benchmark.sh confines everything except the wrapped
      # benchmark to the housekeeping CPUs, so any step after it runs on few cores.
      - name: Setup benchmark environment
        run: sudo bash scripts/setup-benchmark.sh

      - name: Pytest Benchmarks - Vortex
        run: |
          bash ../scripts/bench-taskset.sh uv run --all-packages pytest --benchmark-only benchmark/
        working-directory: vortex-python/

  # Pins the measurement_id hash that scripts/post-ingest.py uses as the primary key of every
  # benchmarks-database fact row. The golden vectors are a frozen artifact (see the note inside
  # the JSON); this job fails if a change to scripts/_measurement_id.py drifts the hash, which
  # would break ON CONFLICT idempotency against the rows already in production.
  measurement-id-golden:
    name: "measurement_id golden vectors"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # sync: false — the test runs via `uv run --no-project` and needs no workspace
      # packages; the default `uv sync` builds the vortex-data Rust extension (~6 min).
      - uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false
      - name: Pytest - measurement_id golden vectors
        run: |
          uv run --no-project --with pytest --with xxhash \
            pytest scripts/tests/test_measurement_id.py

  python-cuda-test:
    name: "Python CUDA (test)"
    if: github.repository == 'vortex-data/vortex'
    runs-on: runs-on=${{ github.run_id }}/runner=gpu/extras=s3-cache/tag=python-cuda-test
    timeout-minutes: 30
    env:
      RUST_LOG: "info,maturin=off,uv=debug"
      MATURIN_PEP517_ARGS: "--profile ci"
    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          components: cargo
          enable-sccache: "true"
      - name: Pin rustup proxy to repository toolchain
        run: |
          TOOLCHAIN="$(grep '^channel' rust-toolchain.toml | cut -d '"' -f 2)"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install uv
        uses: spiraldb/actions/.github/actions/setup-uv@a746510eafaa926484c354541cfc49b2ec06cc63  # 0.18.6
        with:
          sync: false

      - name: Pytest - PyVortex CUDA bridge
        run: |
          uv run --extra cuda \
            pytest --benchmark-disable ../vortex-python-cuda/test/test_native_bridge.py
        working-directory: vortex-python/

  rust-docs:
    name: "Rust (docs)"
    needs: duckdb-ready
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-small/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=rust-docs', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Docs
        env:
          # required to make sure docs build for features
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
        run: |
          # Build docs for the whole workspace (aside from vortex-python that is having hard time with the python-docs syntax),
          # including all private docs.
          cargo doc --profile ci --no-deps --document-private-items --workspace --exclude vortex-python --exclude vortex-python-cuda
          # nextest doesn't support doc tests, so we run it here
          cargo test --profile ci --doc --workspace --all-features --exclude vortex-jni --exclude vortex-ffi --exclude xtask --exclude vortex-python-cuda --no-fail-fast

  build-rust:
    name: "Rust build (${{matrix.config.name}})"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag={2}', github.run_id, matrix.config.runner, matrix.config.name)
          || 'ubuntu-latest' }}
    env:
      # disable lints for build, they will be caught in Rust lint job.
      RUSTFLAGS: "-A warnings"
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "all-features"
            runner: amd64-large
            args: "--all-features --all-targets"
          - name: "default features"
            runner: amd64-large
            args: "--all-targets"
          - name: "with tokio dispatcher"
            runner: amd64-small
            # Only build the crates that have the tokio features, not re-building other crates with no-default-features
            args: "--no-default-features --features tokio --all-targets -p vortex -p vortex-io -p vortex-file -p vortex-layout"
          - name: "wasm32 with default features"
            runner: amd64-medium
            target: wasm32-unknown-unknown
            env:
              rustflags: "RUSTFLAGS='-A warnings --cfg getrandom_backend=\"unsupported\"'"
            args: "--target wasm32-unknown-unknown --exclude vortex --exclude vortex-cuda --exclude vortex-cub --exclude vortex-nvcomp --exclude vortex-datafusion --exclude vortex-duckdb --exclude vortex-tui --exclude vortex-zstd --exclude vortex-test-e2e-cuda --exclude vortex-python-cuda --exclude vortex-sqllogictest --exclude vortex-parquet-variant"
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install wasm32 target
        if: matrix.config.target == 'wasm32-unknown-unknown'
        run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/check-rebuild
        with:
          command: "${{matrix.config.env.rustflags}} cargo hack build --profile ci --locked ${{matrix.config.args}} --ignore-private"
      - name: "Make sure no files changed after build"
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  check-min-deps:
    name: "Check build with minimal dependencies"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=rust-min-deps', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - run: cargo minimal-versions check --direct --workspace --ignore-private

  rust-lint:
    name: "Rust (lint)"
    needs: duckdb-ready
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-large/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=rust-lint', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install nightly for fmt
        run: rustup toolchain install $NIGHTLY_TOOLCHAIN --component rustfmt
      - name: Rust Lint - Format
        id: fmt
        continue-on-error: true
        run: cargo +$NIGHTLY_TOOLCHAIN fmt --all --check
      - name: Rustc check
        id: check
        continue-on-error: true
        run: RUSTFLAGS="-D warnings" cargo check --profile ci --locked --all-features --all-targets
      - name: Rustc check (release)
        id: check-release
        continue-on-error: true
        run: RUSTFLAGS="-D warnings" cargo check --locked --all-features --all-targets --release
      - name: Rust Lint - Clippy All Features
        id: clippy-all
        continue-on-error: true
        run: cargo clippy --profile ci --locked --all-features --all-targets -- -D warnings
      - name: Rust Lint - Clippy Default Features
        id: clippy-default
        continue-on-error: true
        run: cargo clippy --profile ci --locked --all-targets -- -D warnings
      - name: Check lint results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const failed = Object.entries({
              fmt: '${{ steps.fmt.outcome }}',
              check: '${{ steps.check.outcome }}',
              'check-release': '${{ steps.check-release.outcome }}',
              'clippy-all': '${{ steps.clippy-all.outcome }}',
              'clippy-default': '${{ steps.clippy-default.outcome }}',
            }).filter(([, o]) => o === 'failure').map(([n]) => n);
            if (!failed.length) return;

            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const url = jobs.find(j => j.name === context.job)?.check_run_url;
            if (url) {
              await github.rest.checks.update({
                ...context.repo,
                check_run_id: Number(url.split('/').pop()),
                output: { title: `${failed.join(', ')} - failing`, summary: '' },
              });
            }
            core.setFailed(`Lint failed: ${failed.join(', ')}`);

  cpp-lint:
    name: "C/C++ (lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: C/C++ Lint - clang-format
        run: |
          git ls-files lang/cpp vortex-cuda vortex-duckdb vortex-ffi \
            | grep -E '\.(cpp|hpp|cu|cuh|h)$' \
            | grep -v 'arrow/reference/arrow_c_device\.h$' \
            | grep -v 'kernels/src/bit_unpack_.*\.cu$' \
            | grep -v 'kernels/src/bit_unpack_.*_lanes\.cuh$' \
            | xargs clang-format --dry-run --Werror --style=file

  rust-lint-no-default:
    name: "Rust (lint, no default)"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=rust-lint-no-default', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Rust Lint - Clippy No Default Features
        shell: bash
        run: |
          cargo hack --no-dev-deps --ignore-private clippy --profile ci --no-default-features -- -D warnings

  rust-test-windows:
    name: "Rust tests (windows-x64)"
    needs: duckdb-ready
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/pool=windows-x64-pre/extras=s3-cache', github.run_id)
          || 'windows-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup (Windows)
        run: |
          echo "C:\rust\cargo\bin" >> $env:GITHUB_PATH
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Rust Tests (Windows)
        run: |
          cargo nextest run --cargo-profile ci --locked --workspace --all-features --no-fail-fast `
            --exclude vortex-bench `
            --exclude vortex-python --exclude vortex-duckdb `
            --exclude vortex-fuzz --exclude vortex-cuda --exclude vortex-cuda-ffi `
            --exclude vortex-nvcomp --exclude vortex-cub --exclude vortex-test-e2e-cuda --exclude vortex-python-cuda `
            --exclude duckdb-bench `
            --exclude lance-bench --exclude datafusion-bench --exclude random-access-bench `
            --exclude compress-bench --exclude xtask --exclude vortex-datafusion `
            --exclude gpu-scan-cli --exclude vortex-sqllogictest

      - name: sccache stats
        if: always() && github.repository == 'vortex-data/vortex'
        run: sccache --show-stats

      - name: Alert incident.io
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
          alert-title: "Rust tests (windows-x64) failed on develop"
          deduplication-key: ci-rust-test-windows-x64-failure

  rust-test-linux-arm64:
    name: "Rust tests (linux-arm64)"
    needs: duckdb-ready
    if: github.repository == 'vortex-data/vortex'
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}/runner=arm64-medium/image=ubuntu24-full-arm64-pre-v2/extras=s3-cache/tag=rust-test-linux-arm64
    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Rust Tests
        run: |
          cargo nextest run --cargo-profile ci --locked --workspace --all-features --no-fail-fast --exclude vortex-bench --exclude xtask --exclude vortex-sqllogictest
      - uses: ./.github/actions/check-rebuild
        with:
          command: "cargo test --profile ci --locked --workspace --all-features --no-run --exclude vortex-bench --exclude xtask --exclude vortex-sqllogictest"

      - name: Alert incident.io
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
          alert-title: "Rust tests (linux-arm64) failed on develop"
          deduplication-key: ci-rust-test-linux-arm64-failure

  btrblocks-golden:
    name: "Rust (btrblocks golden corpus)"
    timeout-minutes: 10
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=btrblocks-golden', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      # The golden suite pins the compressor's decisions per feature variant, and the
      # variants are mutually exclusive at compile time: the `default` variant only exists
      # without `unstable_encodings` (which changes ALL_SCHEMES), so the `--all-features`
      # workspace test jobs cannot run it. Run each feature combination explicitly.
      - name: Golden corpus (default features)
        run: |
          cargo nextest run --cargo-profile ci --locked --no-fail-fast -p vortex-btrblocks --test golden
      - name: Golden corpus (unstable_encodings)
        run: |
          cargo nextest run --cargo-profile ci --locked --no-fail-fast -p vortex-btrblocks --test golden \
            --features unstable_encodings
      - name: Golden corpus (compact, unstable_encodings + zstd + pco)
        run: |
          cargo nextest run --cargo-profile ci --locked --no-fail-fast -p vortex-btrblocks --test golden \
            --features unstable_encodings,zstd,pco

  build-java:
    name: "Java"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/pool=amd64-medium-pre-v2/extras=s3-cache/tag=java', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - run: ./gradlew javadoc
        working-directory: ./java
      - run: ./gradlew check
        working-directory: ./java

  license-check-and-audit-check:
    name: License Check and Audit Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check ${{ matrix.checks }}

  cxx-api:
    name: "C++ API"
    timeout-minutes: 5
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=cxx-build', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install Rust nightly toolchain
        run: |
          rustup toolchain install $NIGHTLY_TOOLCHAIN
          rustup component add --toolchain $NIGHTLY_TOOLCHAIN rust-src rustfmt clippy llvm-tools-preview
      - name: Build FFI library (asan)
        run: |
          RUSTFLAGS="-A warnings -Cunsafe-allow-abi-mismatch=sanitizer \
                -C debuginfo=2 -C opt-level=0 -C strip=none -Zexternal-clangrt \
                -Zsanitizer=address,leak" \
          cargo +$NIGHTLY_TOOLCHAIN build --locked --no-default-features \
            --target x86_64-unknown-linux-gnu -Zbuild-std \
            -p vortex-ffi
      - name: Build C++ tests and examples (asan)
        run: |
          mkdir -p build
          cmake -S lang/cpp -Bbuild -DSANITIZER=asan -DBUILD_TESTS=1 -DBUILD_EXAMPLES=1 -DTARGET_TRIPLE="x86_64-unknown-linux-gnu"
          cmake --build build --parallel $(nproc)
      - name: Run C++ tests
        run: |
          build/tests/vortex_cxx_test
      - name: Run C++ examples
        run: |
          cd build/examples
          ./writer people0.vortex
          ./writer people1.vortex
          ./writer me.vortex

          ./scan '*.vortex'
          ./dtype me.vortex

          ./reader

  sqllogic-test:
    name: "SQL logic tests"
    needs: duckdb-ready
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=sql-logic-test', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Run sqllogictest tests
        run: |
          ./vortex-sqllogictest/slt/tpch/generate_data.sh
          cargo nextest run --cargo-profile ci -p vortex-sqllogictest
      - uses: ./.github/actions/check-rebuild
        with:
          command: "cargo nextest run --cargo-profile ci -p vortex-sqllogictest --no-run"
          message-format-flag: "--cargo-message-format"

  wasm-integration:
    name: "WASM integration smoke test"
    timeout-minutes: 30
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=wasm-integration', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
          targets: "wasm32-wasip1"
      - name: Install wasm32-wasip1 target
        run: rustup target add wasm32-wasip1
      - name: Setup Wasmer
        shell: bash
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH
      - run: cargo build --profile ci --target wasm32-wasip1
        working-directory: ./wasm-test
      - run: wasmer run ./target/wasm32-wasip1/ci/wasm-test.wasm
        working-directory: ./wasm-test

  generated-files:
    name: "Check generated source files are up to date"
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=generated-files', github.run_id)
          || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install nightly for cbindgen macro expansion
        run: rustup toolchain install $NIGHTLY_TOOLCHAIN
      - name: "regenerate all .fbs/.proto Rust code"
        run: |
          cargo run --profile ci -p xtask -- generate-fbs
          cargo run --profile ci -p xtask -- generate-proto
      - name: "regenerate FFI header file"
        run: |
          cargo +$NIGHTLY_TOOLCHAIN build --profile ci -p vortex-ffi
      - name: "Make sure no files changed after regenerating"
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: "Checkout develop flatbuffers"
        working-directory: vortex-flatbuffers/
        run: |
          cp -R flatbuffers flatbuffers.HEAD
          git fetch origin develop --depth 1
          git checkout origin/develop -- flatbuffers
      - name: "Verify flatbuffer back-compat"
        working-directory: vortex-flatbuffers/
        run: |
          find flatbuffers/ -type f -name "*.fbs" | sed 's/^flatbuffers\///' | xargs -I{} -n1 flatc -I flatbuffers.HEAD --conform-includes flatbuffers --conform flatbuffers/{} flatbuffers.HEAD/{}

  ffi-c-test:
    name: "C API test build"
    timeout-minutes: 10
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu24-full-x64-pre-v2/extras=s3-cache/tag=cxx-build', github.run_id)
          || 'ubuntu-latest' }}
    steps:
      - uses: runs-on/action@v2
        if: github.repository == 'vortex-data/vortex'
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: "regenerate FFI header file"
        run: |
          cargo +$NIGHTLY_TOOLCHAIN build --profile ci -p vortex-ffi
      - name: Build and run C++ unit tests
        run: |
          cd vortex-ffi
          mkdir build
          cmake -Bbuild -DRUST_BUILD_PROFILE=ci
          cmake --build build -j $(nproc)
          ctest --test-dir build -j $(nproc)
