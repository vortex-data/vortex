name: Report Fuzz Crash

on:
  workflow_call:
    inputs:
      fuzz_target:
        required: true
        type: string
      fuzz_name:
        required: false
        type: string
      artifact_url:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      logs_artifact_name:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit:
        required: true
        type: string
    outputs:
      issue_number:
        description: "The issue number that was created or commented on"
        value: ${{ jobs.report.outputs.issue_number }}
      issue_created:
        description: "Whether this run created a new issue, rather than matching an existing one"
        value: ${{ jobs.report.outputs.issue_created }}
      fix_issue_number:
        description: "An issue that needs a fix attempt, or empty if no reported issue needs one"
        value: ${{ jobs.report.outputs.fix_issue_number }}
    secrets:
      gh_token:
        required: true
      # incident.io alert source token from Alerts > Alert sources > Custom HTTP.
      incident_io_alert_token:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue_number: ${{ steps.report.outputs.issue_number }}
      issue_created: ${{ steps.report.outputs.issue_created }}
      fix_issue_number: ${{ steps.report.outputs.fix_issue_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download fuzzer logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.logs_artifact_name }}
          path: ./logs

      - name: Download crash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ./crash_artifacts

      - name: Install Python dependencies
        run: pip install -e .github/scripts

      - name: Create or comment on issues
        id: report
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          REPO: ${{ github.repository }}
          FUZZ_TARGET: ${{ inputs.fuzz_target }}
          FUZZ_NAME: ${{ inputs.fuzz_name || inputs.fuzz_target }}
          BRANCH: ${{ inputs.branch }}
          COMMIT: ${{ inputs.commit }}
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: .github/scripts/report-fuzz-crashes.sh

      - name: Claude analysis (optional)
        id: claude_analysis
        # The CI federation rule trusts only the default branch.
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          steps.report.outputs.issue_created == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc  # v1.0.276
        with:
          # A called workflow sees the caller's OIDC subject, so `vortex-claude-ci`
          # matches here too and no secret needs passing down.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_CI }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          github_token: ${{ secrets.gh_token }}
          show_full_output: true
          prompt: |
            `new_crash_info.json` has the fields extracted from a fuzzer crash: panic_location,
            crash_location, panic_message, error_variant, stack_frames, stack_trace_raw
            and debug_output. If you need more context, read the start of
            `logs/fuzz_output.log`. The file can be very large, so read only the first
            200 lines.

            The repository is checked out at the fuzzed commit. Read the code at the
            crash location before you explain the cause.

            Write a short root cause analysis to `claude_analysis.txt`. Tell what the
            crash is, with its error type and location, and why it probably occurs.
            Say whether the library or the fuzz harness under `fuzz/` looks at fault.
            If a fix direction is clear, include it. The text goes into a comment on a
            GitHub issue, so write only plain prose, without headers or other
            Markdown.
          claude_args: |
            --model claude-opus-5-5
            --permission-mode default
            --effort medium
            --max-turns 20
            --allowedTools "Read,Write,Grep,Glob,Bash(cat:*),Bash(jq:*),Bash(head:*),Bash(xxd:*)"

      - name: Post Claude analysis
        if: hashFiles('claude_analysis.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
          ISSUE_NUMBER: ${{ steps.report.outputs.issue_number }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}"
          --body-file claude_analysis.txt

      - name: Alert incident.io on validation failure
        if: failure() && steps.report.outputs.validation_failed == 'true'
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.incident_io_alert_token }}
          alert-title: "Fuzzer crash report failed: missing required variables"
          alert-description: |
            The fuzz_report pipeline failed because required variables were missing: ${{ steps.report.outputs.missing_variables }}.
            The fuzzer found a crash but could not file a GitHub issue.
          deduplication-key: fuzz-report-validation-${{ inputs.fuzz_target }}
          custom-fields: |
            {
              "fuzz_target": "${{ inputs.fuzz_target }}",
              "missing_variables": "${{ steps.report.outputs.missing_variables }}",
              "branch": "${{ inputs.branch }}",
              "commit": "${{ inputs.commit }}"
            }
