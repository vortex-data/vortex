name: Report Fuzz Crash

on:
  workflow_call:
    inputs:
      fuzz_target:
        required: true
        type: string
      fuzz_name:
        required: false
        type: string
      crash_file:
        required: true
        type: string
      artifact_url:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      logs_artifact_name:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit:
        required: true
        type: string
    outputs:
      issue_number:
        description: "The issue number that was created or commented on"
        value: ${{ jobs.report.outputs.issue_number }}
      issue_created:
        description: "Whether this run created a new issue, rather than matching an existing one"
        value: ${{ jobs.report.outputs.issue_created }}
    secrets:
      gh_token:
        required: true
      # incident.io alert source token from Alerts > Alert sources > Custom HTTP.
      incident_io_alert_token:
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue_number: ${{ steps.report.outputs.issue_number }}
      issue_created: ${{ steps.report.outputs.issue_created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download fuzzer logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.logs_artifact_name }}
          path: ./logs

      - name: Download crash artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ./crash_artifacts

      - name: Install Python dependencies
        run: pip install -e .github/scripts

      - name: Extract crash info
        id: extract
        run: |
          python3 -m fuzz_report extract \
            logs/fuzz_output.log \
            --crash-dir crash_artifacts \
            --crash-name "${{ inputs.crash_file }}" \
            -o crash_info.json

          # Validate that extraction found a real crash.
          error_variant=$(jq -r '.error_variant' crash_info.json)
          panic_message=$(jq -r '.panic_message' crash_info.json)
          echo "error_variant=$error_variant"
          echo "panic_message=$panic_message"
          if [ "$error_variant" = "unknown" ] && [ "$panic_message" = "unknown" ]; then
            echo "::notice::No crash info found in fuzzer output — nothing to report."
            echo "crash_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "crash_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no crash found
        if: steps.extract.outputs.crash_found != 'true'
        run: |
          echo "No parseable crash in fuzzer output — skipping remaining steps."
          exit 1

      - name: Fetch existing fuzzer issues
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --label fuzzer \
            --state open \
            --json number,title,body,url \
            --limit 100 > fuzzer_issues.json

      - name: Check for duplicates
        id: dedup
        run: |
          python3 -m fuzz_report check-duplicate \
            crash_info.json \
            fuzzer_issues.json \
            -o dedup_result.json

      - name: Claude analysis (optional)
        id: claude_analysis
        if: |
          steps.dedup.outputs.duplicate != 'true' ||
          steps.dedup.outputs.confidence != 'exact'
        continue-on-error: true
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b  # v1.0.247
        with:
          # A called workflow sees the caller's OIDC subject, so `vortex-claude-ci`
          # matches here too and no secret needs passing down.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_CI }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          github_token: ${{ secrets.gh_token }}
          show_full_output: true
          prompt: |
            `crash_info.json` has the fields extracted from a fuzzer crash: panic_location,
            crash_location, panic_message, error_variant, stack_frames, stack_trace_raw
            and debug_output. If you need more context, read the start of
            `logs/fuzz_output.log`. The file can be very large, so read only the first
            200 lines.

            Write a short root cause analysis to `claude_analysis.txt`. Tell what the
            crash is, with its error type and location, and why it probably occurs.
            If a fix direction is clear, include it. The text goes into a section of a
            GitHub issue template, so write only plain prose, without headers or other
            Markdown.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 5
            --allowedTools "Read,Write,Grep,Glob,Bash(cat:*),Bash(jq:*),Bash(head:*),Bash(xxd:*)"

      - name: Create or comment on issue
        id: report
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          python3 -m fuzz_report report \
            crash_info.json \
            --repo "${{ github.repository }}" \
            --dedup-result dedup_result.json \
            --claude-analysis claude_analysis.txt \
            -v "FUZZ_TARGET=${{ inputs.fuzz_target }}" \
            -v "FUZZ_NAME=${{ inputs.fuzz_name || inputs.fuzz_target }}" \
            -v "CRASH_FILE=${{ inputs.crash_file }}" \
            -v "BRANCH=${{ inputs.branch }}" \
            -v "COMMIT=${{ inputs.commit }}" \
            -v "ARTIFACT_URL=${{ inputs.artifact_url }}"

      - name: Alert incident.io on validation failure
        if: failure() && steps.report.outputs.validation_failed == 'true'
        uses: ./.github/actions/alert-incident-io
        with:
          api-key: ${{ secrets.incident_io_alert_token }}
          alert-title: "Fuzzer crash report failed: missing required variables"
          alert-description: |
            The fuzz_report pipeline failed because required variables were missing: ${{ steps.report.outputs.missing_variables }}.
            The fuzzer found a crash but could not file a GitHub issue.
          deduplication-key: fuzz-report-validation-${{ inputs.fuzz_target }}
          custom-fields: |
            {
              "fuzz_target": "${{ inputs.fuzz_target }}",
              "missing_variables": "${{ steps.report.outputs.missing_variables }}",
              "branch": "${{ inputs.branch }}",
              "commit": "${{ inputs.commit }}"
            }
