name: cuDF C++ tests

on:
  pull_request:
    paths:
      - "vortex-cuda/cudf/**"
      - ".github/workflows/cudf-cpp.yml"
  push:
    branches: [develop]
    paths:
      - "vortex-cuda/cudf/**"
      - ".github/workflows/cudf-cpp.yml"
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'vortex-data/vortex'
    name: "cuDF C++ environment smoke"
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}/region=us-east-1/runner=gpu/extras=s3-cache/tag=cudf-cpp
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Show GPU driver
        run: nvidia-smi
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          pixi-version: v0.84.2
          manifest-path: vortex-cuda/cudf/pixi.toml
          locked: true
          cache: true
          cache-key: pixi-cudf-v1-
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}
      - name: Show pinned CUDA compiler
        run: pixi run --locked --manifest-path vortex-cuda/cudf/pixi.toml nvcc --version
      - name: Build and run cuDF smoke tests
        run: pixi run --locked --manifest-path vortex-cuda/cudf/pixi.toml test
