# Runs all benchmarks once for a pull request.
# Called from bench-dispatch.yml when the `action/benchmark` label is added.

name: PR Benchmarks

concurrency:
  # The group causes runs to queue instead of running in parallel.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  # Don't cancel benchmarks that are already running, instead just queue them up.
  cancel-in-progress: false

on:
  workflow_call: { }
  workflow_dispatch: { }

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  # Rust micro-benchmarks (random access, compression). Matrix resolved from the `micro` profile.
  bench:
    uses: ./.github/workflows/bench-core.yml
    secrets: inherit
    with:
      mode: "pr"
      profile: "micro"

  sql:
    uses: ./.github/workflows/sql-benchmarks.yml
    secrets: inherit
    with:
      mode: "pr"
      profile: "pr"
