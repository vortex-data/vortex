# Runs SQL benchmarks once for a pull request.
# Called from pr-bench-dispatch.yml when SQL benchmark labels are added.

name: PR SQL Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.matrix_preset || 'pr' }}-${{
      github.head_ref || github.run_id
    }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      matrix_preset:
        required: false
        type: string
        default: "pr"
    secrets:
      POLAR_SIGNALS_API_KEY:
        required: false
      OTEL_EXPORTER_OTLP_ENDPOINT:
        required: false
      OTEL_EXPORTER_OTLP_HEADERS:
        required: false
      BENCH_REVALIDATE_TOKEN:
        required: false
      INCIDENT_IO_ALERT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      matrix_preset:
        description: "SQL benchmark matrix to run"
        required: false
        type: choice
        default: "pr"
        options:
          - "pr"
          - "pr-compact"
          - "pr-all"
          - "pr-full"

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  sql:
    uses: ./.github/workflows/sql-bench-matrix.yml
    secrets:
      POLAR_SIGNALS_API_KEY: ${{ secrets.POLAR_SIGNALS_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      BENCH_REVALIDATE_TOKEN: ${{ secrets.BENCH_REVALIDATE_TOKEN }}
      INCIDENT_IO_ALERT_TOKEN: ${{ secrets.INCIDENT_IO_ALERT_TOKEN }}
    with:
      mode: "pr"
      matrix_preset: ${{ inputs.matrix_preset }}
