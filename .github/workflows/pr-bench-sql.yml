# Runs SQL benchmarks once for a pull request.
# Called from pr-bench-dispatch.yml when SQL benchmark labels are added, or dispatched by hand to run
# chosen benchmarks and queries, optionally posting the results to a pull request.

name: PR SQL Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.matrix_preset || 'pr' }}-${{
      inputs.benchmarks || 'all' }}-${{ inputs.queries || 'all' }}-${{
      inputs.pr_number || github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      matrix_preset:
        required: false
        type: string
        default: "pr"
      benchmarks:
        required: false
        type: string
        default: ""
      queries:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      matrix_preset:
        description: "SQL benchmark matrix to run"
        required: false
        type: choice
        default: "pr"
        options:
          - "pr"
          - "pr-compact"
          - "pr-all"
          - "pr-full"
      benchmarks:
        description: "Comma-separated benchmark IDs from the preset, e.g. polarsignals,tpch-nvme; empty runs all"
        required: false
        type: string
        default: ""
      queries:
        description: "Query numbers to run in each benchmark, e.g. 1,3,5-7; empty runs every query"
        required: false
        type: string
        default: ""
      pr_number:
        description: "Pull request to benchmark and post results to; empty benchmarks the selected branch without commenting"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  # A dispatched run benchmarks pr_number's head and runs with this repository's secrets, so the
  # pull request must not come from a fork. Fork pull requests use the label path instead.
  resolve-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve pull request
        id: pr
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -Eeuo pipefail

          pr_number="${PR_NUMBER//[[:space:]]/}"
          pr_number="${pr_number#\#}"
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a pull request number; got '$PR_NUMBER'"
            exit 1
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::PR #$pr_number comes from $head_repo; add a benchmark label to it instead"
            exit 1
          fi
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Benchmarking PR #$pr_number at $head_sha"

  sql:
    needs: resolve-pr
    uses: ./.github/workflows/sql-bench-matrix.yml
    secrets: inherit
    with:
      mode: "pr"
      matrix_preset: ${{ inputs.matrix_preset }}
      benchmarks: ${{ inputs.benchmarks }}
      queries: ${{ inputs.queries }}
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      pr_head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
