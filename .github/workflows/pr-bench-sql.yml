# Runs SQL benchmarks once for a pull request.
# Called from pr-bench-dispatch.yml when SQL benchmark labels are added.

name: PR SQL Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.matrix_preset || 'pr' }}-${{
      github.head_ref || github.run_id
    }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      matrix_preset:
        required: false
        type: string
        default: "pr"
      profile_run_id:
        required: false
        type: string
        default: ""
      profile_source_sha:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      matrix_preset:
        description: "SQL benchmark matrix to run"
        required: false
        type: choice
        default: "pr"
        options:
          - "pr"
          - "pr-compact"
          - "pr-all"
          - "pr-full"
          - "scan-v2"
          - "scan-v2-profile"
      profile_run_id:
        description: "Existing scan comparison run supplying profile binaries"
        required: false
        type: string
        default: ""
      profile_source_sha:
        description: "Exact source SHA in the profile binary build manifest"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write  # for commenting on PRs
  id-token: write  # enables AWS-GitHub OIDC

jobs:
  sql:
    if: inputs.matrix_preset != 'scan-v2' && inputs.matrix_preset != 'scan-v2-profile'
    uses: ./.github/workflows/sql-bench-matrix.yml
    secrets: inherit
    with:
      mode: "pr"
      matrix_preset: ${{ inputs.matrix_preset }}

  scan-comparison:
    if: inputs.matrix_preset == 'scan-v2'
    uses: ./.github/workflows/scan-v2-comparison.yml
    secrets: inherit
    with:
      head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_ref: ${{ github.event.pull_request.base.sha || 'origin/develop' }}

  scan-profile:
    if: inputs.matrix_preset == 'scan-v2-profile'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/scan-v2-profile.yml
    secrets: inherit
    with:
      source_run_id: ${{ inputs.profile_run_id }}
      source_sha: ${{ inputs.profile_source_sha }}
