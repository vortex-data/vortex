name: S3 Model Benchmarks

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "TPC-H/TPC-DS scale factor; branch pushes exercise all queries at 0.01"
        type: string
        default: "10.0"
      iterations:
        description: "Per-query iterations (at least three)"
        type: number
        default: 5
      model:
        description: "Validate the pinned CI profile, or explicitly evaluate a newly learned candidate"
        type: choice
        options: [pinned, learned]
        default: pinned
  push:
    branches: ["ji/s3-simulated-benchmarks"]
    paths:
      - .github/workflows/s3-model-benchmarks.yml
      - .github/actions/s3-benchmark-task/action.yml
      - benchmarks/s3/**
      - benchmarks/*-bench/src/**
      - vortex-bench/src/**
      - Cargo.lock

permissions:
  contents: read
  id-token: write

concurrency:
  group: s3-model-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    timeout-minutes: 720
    runs-on: runs-on=${{ github.run_id }}/runner=bench-dedicated/family=c8gd.16xlarge/spot=false/image=ubuntu24-full-arm64-pre-v2/tag=s3-model-benchmarks/extras=s3-cache
    env:
      AWS_REGION: us-east-1
      REMOTE_ROOT: s3://vortex-ci-benchmark-datasets/s3-model-benchmarks/${{ github.run_id }}-${{ github.run_attempt }}
      BENCH_SCALE: ${{ inputs.scale || '0.01' }}
      BENCH_ITERATIONS: ${{ inputs.iterations || '3' }}
      BENCH_MODEL: ${{ inputs.model || 'pinned' }}
    steps:
      - uses: runs-on/action@v2
        with:
          sccache: s3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - uses: ./.github/actions/system-info
      - name: Build native clients, model and collector
        env:
          RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
        run: >-
          cargo build --locked --profile release_debug --bin data-gen --bin s3-measure
          --bin s3-simulate --bin datafusion-bench --bin duckdb-bench --bin lance-bench
          --bin random-access-bench --bin compress-bench
          --features random-access-bench/lance,compress-bench/lance
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
          aws-region: us-east-1
          role-duration-seconds: 7200
      - name: Verify region and create calibration fixtures
        run: |
          set -Eeuo pipefail
          test "$RUNS_ON_AWS_REGION" = "$AWS_REGION"
          region=$(curl --silent --show-error --head --max-time 20 https://vortex-ci-benchmark-datasets.s3.amazonaws.com/ |
            awk 'tolower($1) == "x-amz-bucket-region:" {gsub("\r", "", $2); print $2}')
          test "$region" = "$AWS_REGION"
          python3 benchmarks/s3/create_probe.py
          for object in 1 2 3 4; do
            aws s3 cp s3-probe.bin "$REMOTE_ROOT/probe/probe-$object.bin"
          done
      - name: calibrate
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: calibrate
      - name: prepare-tpch
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: prepare-tpch
          authenticate: "false"
      - name: upload-tpch
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: upload-tpch
      - name: sql-tpch-datafusion-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-datafusion-real
      - name: sql-tpch-datafusion-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-datafusion-simulated
          authenticate: "false"
      - name: sql-tpch-datafusion-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-datafusion-real-repeat
      - name: sql-tpch-duckdb-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-duckdb-real
      - name: sql-tpch-duckdb-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-duckdb-simulated
          authenticate: "false"
      - name: sql-tpch-duckdb-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-duckdb-real-repeat
      - name: sql-tpch-lance-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-lance-real
      - name: sql-tpch-lance-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-lance-simulated
          authenticate: "false"
      - name: sql-tpch-lance-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpch-lance-real-repeat
      - name: prepare-tpcds
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: prepare-tpcds
          authenticate: "false"
      - name: upload-tpcds
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: upload-tpcds
      - name: sql-tpcds-datafusion-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-datafusion-simulated
          authenticate: "false"
      - name: sql-tpcds-datafusion-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-datafusion-real-repeat
      - name: sql-tpcds-datafusion-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-datafusion-real
      - name: sql-tpcds-duckdb-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-duckdb-simulated
          authenticate: "false"
      - name: sql-tpcds-duckdb-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-duckdb-real-repeat
      - name: sql-tpcds-duckdb-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-duckdb-real
      - name: sql-tpcds-lance-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-lance-simulated
          authenticate: "false"
      - name: sql-tpcds-lance-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-lance-real-repeat
      - name: sql-tpcds-lance-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: sql-tpcds-lance-real
      - name: prepare-random
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: prepare-random
          authenticate: "false"
      - name: upload-random
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: upload-random
      - name: random-access-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: random-access-real
      - name: random-access-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: random-access-simulated
          authenticate: "false"
      - name: random-access-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: random-access-real-repeat
      - name: compress-real
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: compress-real
      - name: compress-simulated
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: compress-simulated
          authenticate: "false"
      - name: compress-real-repeat
        timeout-minutes: 115
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: compress-real-repeat
      - name: compare
        uses: ./.github/actions/s3-benchmark-task
        with:
          task: compare
          authenticate: "false"
      - name: Publish comparison when available
        if: always()
        run: |
          if [ -f s3-benchmarks/comparison.md ]; then
            cat s3-benchmarks/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve calibration, model, per-iteration results and endpoint counters
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: s3-model-benchmarks-${{ github.run_attempt }}
          path: s3-benchmarks/
          retention-days: 30
      - name: Refresh cleanup credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::245040174862:role/GitHubBenchmarkRole
          aws-region: us-east-1
      - name: Remove only this run's fixture prefix
        if: always()
        run: aws s3 rm --recursive "$REMOTE_ROOT/"
