name: Rust Instrumented

# Concurrency control:
# - Push to develop: runs queue sequentially, never cancelled.
# - `workflow_dispatch`: groups by branch and queues if run on develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
on:
  push:
    branches: [develop]
  workflow_dispatch: { }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NIGHTLY_TOOLCHAIN: nightly-2026-11-13

jobs:
  rust-coverage:
    name: "Rust tests (coverage) (${{ matrix.suite }})"
    # Coverage only runs on develop; PRs get the same tests uninstrumented in ci.yml.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      id-token: write
    strategy:
      matrix:
        include:
          - suite: tests
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-large/volume=200gb/image=ubuntu26-full-x64-pre-v2/tag=rust-coverage-suite-{1}', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'), matrix.suite)
          || 'ubuntu-latest' }}
    env:
      RUSTFLAGS: "-Cinstrument-coverage -A warnings"
      CARGO_INCREMENTAL: 0  # Disable incremental compilation to get accurate coverage
      # %8m merges counters online into a pool of 8 files per binary. A per-process (%p) file for
      # each nextest test process fills the runner disk.
      LLVM_PROFILE_FILE: "target/coverage/vortex-%8m.profraw"
      GRCOV_OUTPUT_FILE: "target/coverage/vortex.lcov"
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Ensure llvm-tools are installed
        run: |
          rustup component add llvm-tools || \
            rustup component add llvm-tools-preview

          # Verify llvm-profdata is accessible (grcov needs it for coverage merging)
          RUST_SYSROOT="$(rustc --print sysroot)"
          RUST_HOST="$(rustc --print host-tuple)"
          LLVM_TOOLS_BIN="${RUST_SYSROOT}/lib/rustlib/${RUST_HOST}/bin"
          LLVM_PROFDATA="${LLVM_TOOLS_BIN}/llvm-profdata"
          if [ ! -f "$LLVM_PROFDATA" ]; then
            echo "ERROR: llvm-profdata not found at $LLVM_PROFDATA"
            echo "Listing bin directory:"
            ls -la "$LLVM_TOOLS_BIN" || echo "Directory does not exist"
            exit 1
          fi
          echo "Found llvm-profdata at $LLVM_PROFDATA"

      - name: Rust Tests
        if: ${{ matrix.suite == 'tests' }}
        run: |
          cargo nextest run --locked --workspace --all-features --no-fail-fast --exclude vortex-python-cuda
      - name: Generate coverage report
        run: |
          RUST_SYSROOT="$(rustc --print sysroot)"
          RUST_HOST="$(rustc --print host-tuple)"
          LLVM_TOOLS_BIN="${RUST_SYSROOT}/lib/rustlib/${RUST_HOST}/bin"
          grcov . --binary-path target/debug/ -s . -t lcov --llvm --ignore-not-existing \
            --llvm-path "${LLVM_TOOLS_BIN}" \
            --threads $(nproc) \
            --ignore '../*' --ignore '/*' --ignore 'fuzz/*' --ignore 'vortex-bench/*' \
            --ignore 'home/*' --ignore 'xtask/*' --ignore 'target/*' --ignore 'vortex-error/*' \
            --ignore 'vortex-python/*' --ignore 'lang/java/vortex-jni-native/*' \
            --ignore 'vortex-tui/*' --ignore 'vortex-datafusion/examples/*' \
            --ignore 'vortex-ffi/examples/*' --ignore '*/arbitrary/*' --ignore '*/arbitrary.rs' \
            --ignore benchmarks/* --ignore 'vortex-test/*' \
            -o ${{ env.GRCOV_OUTPUT_FILE }}
          test -s ${{ env.GRCOV_OUTPUT_FILE }}
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          name: run-${{ matrix.suite }}
          files: ${{ env.GRCOV_OUTPUT_FILE }}
          disable_search: true
          flags: ${{ matrix.suite }}
          use_oidc: true

  cxx-coverage:
    name: "C++ API (coverage)"
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    env:
      # Symbolizing error backtrace in debug .so is slow
      RUST_LIB_BACKTRACE: 0
    permissions:
      id-token: write
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-medium/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=cxx-coverage', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"
      - name: Install lcov
        run: |
          if ! command -v lcov >/dev/null || ! dpkg-query -W libjson-xs-perl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lcov libjson-xs-perl
          fi
      - name: Build and test C++ API with coverage
        working-directory: lang/cpp
        run: ./gcov-report.sh
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          name: cxx-api
          files: lang/cpp/coverage.info
          disable_search: true
          flags: cxx-api
          use_oidc: true
