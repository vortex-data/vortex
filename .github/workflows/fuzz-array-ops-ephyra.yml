name: Fuzz array_ops (ephyra)

# Runs the `array_ops` fuzz target as an ephyra property (`fuzz/tests/array_ops_ephyra.rs`).
# Pull requests that touch the array fuzzer run a fixed-seed check, so a result depends only on the
# change. The daily run searches with a fresh seed, replays earlier failures first, and files
# each distinct failure as an issue. Failures shrink to a small plan and print an
# `EPHYRA_REPLAY=seed:iteration` line that reproduces them.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "fuzz/src/array/**"
      - "fuzz/tests/array_ops_ephyra.rs"
      - "fuzz/Cargo.toml"
      - ".github/scripts/ephyra_report.py"
      - ".github/workflows/fuzz-array-ops-ephyra.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: "Search budget in minutes"
        required: false
        type: number
        default: 45

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimized code with the assertions and overflow checks that a debug build has.
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"

jobs:
  ephyra:
    name: "Array Operations (ephyra)"
    if: github.event.pull_request.draft != true
    timeout-minutes: 90
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner=amd64-ci-large/image=ubuntu26-full-x64-pre-v2/extras=s3-cache/tag=fuzz-array-ops-ephyra', format('{0}/region={1}', github.run_id, vars.CI_REGION || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T1') && 'ap-northeast-1') || (contains(github.event.pull_request.updated_at || github.event.head_commit.timestamp, 'T2') && 'eu-west-2') || 'us-east-1'))
          || 'ubuntu-latest' }}
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      BUDGET_MINUTES: ${{ inputs.budget_minutes || 45 }}
      EPHYRA_FAILURES: "5"
      EPHYRA_REPORT_JSON: ${{ github.workspace }}/ephyra-report.jsonl
    steps:
      - parallel:
          - uses: runs-on/action@v2
            if: github.repository == 'vortex-data/vortex'
            with:
              sccache: s3
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-prebuild
        with:
          enable-sccache: "true"

      # Failures from earlier searches are replayed first. Pull requests skip them, so a known
      # failure does not fail an unrelated change; the daily run and its issues track those.
      - name: Restore regressions
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz/.ephyra/regressions
          key: ephyra-array-ops-${{ github.run_id }}
          restore-keys: ephyra-array-ops-

      - name: Build
        run: cargo test --locked --release -p vortex-fuzz --features ephyra --test array_ops_ephyra --no-run

      - name: Run property
        id: run
        run: |
          if [ "$IS_PR" = "true" ]; then
            # The same inputs on every run; the budget only guards against a hang.
            export EPHYRA_SEED=1 EPHYRA_TESTS=20000 EPHYRA_BUDGET_MS=600000 EPHYRA_REGRESSIONS=0
          else
            export EPHYRA_TESTS=100000000 EPHYRA_BUDGET_MS=$((BUDGET_MINUTES * 60 * 1000))
          fi
          cargo test --locked --release -p vortex-fuzz --features ephyra --test array_ops_ephyra \
            -- --nocapture 2>&1 | tee ephyra-output.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always() && hashFiles('ephyra-report.jsonl') != ''
        run: python3 .github/scripts/ephyra_report.py summary ephyra-report.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Save regressions
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fuzz/.ephyra/regressions
          key: ephyra-array-ops-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ephyra-array-ops
          path: |
            ephyra-output.log
            ephyra-report.jsonl
            fuzz/.ephyra/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ steps.run.outcome == 'failure' && 90 || 7 }}

  report:
    name: "Report ephyra failures"
    needs: ephyra
    if: always() && needs.ephyra.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: ephyra-array-ops
          path: report

      - name: Open or update issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s report/ephyra-report.jsonl ]; then
            echo "::warning::No ephyra report: the job failed before the property ran."
            exit 0
          fi
          python3 .github/scripts/ephyra_report.py issues report/ephyra-report.jsonl \
            --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL" --commit "$GITHUB_SHA"
