name: Build CPU Fuzzers

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner name from .github-private runs-on.yml"
        required: false
        type: string
        default: "arm64-medium"
    outputs:
      artifact_name:
        description: "Artifact containing the compiled CPU fuzzers"
        value: ${{ jobs.build.outputs.artifact_name }}

env:
  NIGHTLY_TOOLCHAIN: nightly-2026-09-10

jobs:
  build:
    name: "Build CPU fuzzers"
    concurrency:
      # Avoid two workflows compiling the same commit before either fills the cache.
      group: fuzz-build-${{ github.sha }}-${{ inputs.runner }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    runs-on: >-
      ${{ github.repository == 'vortex-data/vortex'
          && format('runs-on={0}/runner={1}/disk=large/tag=fuzz-build', github.run_id, inputs.runner)
          || 'ubuntu-latest' }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: runs-on/action@v2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/build-fuzzers
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          runner: ${{ inputs.runner }}

      - name: Package fuzzers
        run: tar -acf cpu-fuzzers.tar.zst fuzz-binaries

      - name: Set artifact name
        id: artifact
        shell: bash
        run: echo "name=cpu-fuzzers-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload fuzzers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: cpu-fuzzers.tar.zst
          compression-level: 0
          retention-days: 2
