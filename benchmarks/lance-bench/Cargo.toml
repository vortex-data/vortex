[package]
name = "lance-bench"
description = "Lance benchmark tool"
authors.workspace = true
categories.workspace = true
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
# `aws` registers Lance's s3:// object store provider, needed to benchmark against remote data.
lance = { version = "14", default-features = false, features = ["aws"] }
lance-datafusion = { version = "14", default-features = false }
lance-file = { version = "14", default-features = false }
lance-linalg = { version = "14", default-features = false }

anyhow = { workspace = true }
arrow-cast = { version = "58" }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive"] }
datafusion = { workspace = true, features = ["nested_expressions"] }
futures = { workspace = true }
glob = { workspace = true }
mimalloc = { workspace = true }
parquet = { version = "58" }
roaring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
vortex = { workspace = true, features = ["files", "tokio"] }
vortex-bench = { workspace = true }
vortex-index = { workspace = true }
vortex-index-ivf = { workspace = true }

[dev-dependencies]
# Plain criterion, not the workspace's CodSpeed-compatible one: the index benchmark compares Vortex
# with Lance on one machine, so it is excluded from CodSpeed (see scripts/codspeed_shards.py).
criterion = { package = "criterion", version = "0.7", default-features = false }
lance-index = { version = "14", default-features = false }

[lib]
test = false

[[bin]]
name = "lance-bench"
test = false

[[bench]]
name = "index_vs_lance"
harness = false

[lints]
workspace = true
