[package]
name = "lance-bench"
description = "Lance benchmark tool"
authors.workspace = true
categories.workspace = true
edition.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
# `aws` registers Lance's s3:// object store provider, needed to benchmark against remote data.
lance = { version = "13", default-features = false, features = ["aws"] }
lance-file = { version = "13", default-features = false }
lance-index = { version = "13", default-features = false }
lance-linalg = { version = "13", default-features = false }

anyhow = { workspace = true }
arrow-cast = { version = "58" }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
glob = { workspace = true }
mimalloc = { workspace = true }
parquet = { version = "58" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
rand = { workspace = true }
vortex = { workspace = true, features = ["files", "tokio"] }
vortex-bench = { workspace = true }
vortex-index = { workspace = true }
vortex-table = { workspace = true, features = ["index"] }

[lib]
test = false

[[bin]]
name = "lance-bench"
test = false

[[bin]]
name = "table-bench"
path = "src/bin/table_bench.rs"
test = false

[lints]
workspace = true
