# Cost of one candidate = compressed bytes / bandwidth + full decode time.
# Compress time is reported beside every result but is not part of the cost.
# `primary` is the preset used where a report needs one (regret detail, labels for feature models).

primary = "s3-scan"
sweep = [100e6, 250e6, 500e6, 1e9, 2e9, 4e9, 8e9, 16e9, 32e9]

[[preset]]
name = "size"
bandwidth = 100e6
meaning = "Archive on S3: bytes dominate"

[[preset]]
name = "s3-scan"
bandwidth = 1e9
meaning = "Analytic scans from object storage"

[[preset]]
name = "nvme"
bandwidth = 4e9
meaning = "Local disk"

[[preset]]
name = "memory"
bandwidth = 32e9
meaning = "Hot, cached data: decode speed dominates"
