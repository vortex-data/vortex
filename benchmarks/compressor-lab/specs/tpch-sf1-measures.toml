# TPC-H SF1 integer columns, for checking site features and quality measures end to end.
# Generated in-process, so no data files are needed.
name = "tpch-sf1-measures"
chunk_rows = 65536
dtypes = ["int"]
max_chunks_per_column = 2

[schemes]
exclude = ["vortex.int.pco"]

[search]
strategy = "forced_root"

[measure]
reps = 7
compress_reps = 3

[[sources]]
kind = "tpch"
name = "tpch-sf1"
scale_factor = 1.0
tables = ["lineitem", "orders", "partsupp", "customer"]
