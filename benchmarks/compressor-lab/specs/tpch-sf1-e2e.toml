# End-to-end integration test: TPC-H SF1 from local Parquet (generated by e2e/gen-tpch.sh) plus
# the in-process generator, integers only. Small enough to run on a laptop in minutes.
name = "tpch-sf1-e2e"
chunk_rows = 65536
dtypes = ["int"]
max_chunks_per_column = 4

[schemes]
exclude = ["vortex.int.pco"]

[search]
strategy = "forced_root"

[measure]
reps = 3
compress_reps = 1

[[sources]]
kind = "parquet"
name = "tpch-sf1-parquet"
path = "data/tpch-sf1/*.parquet"

[[sources]]
kind = "tpch"
name = "tpch-sf1-gen"
scale_factor = 1.0
tables = ["orders", "partsupp"]
