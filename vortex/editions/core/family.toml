doc = """
The serialized components available to the default file writer. Array memberships pin the
writer version compression schemes may produce. Every array ID still has one reader; an
incompatible serialized form must use a new ID. Every core edition freezes, and a frozen
edition carries a read-forever guarantee: a file written with it stays readable by every
later Vortex release. Stabilized non-plugin components and array writer-version upgrades are
adopted through preview before joining core. An edition may freeze in the release that cuts
it; after that release version is known, the declaration is backfilled with it as the
minimum. A frozen edition never changes.
