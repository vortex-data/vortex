syntax = "proto3";

package vortex.expr;

import "scalar.proto";
import "dtype.proto";

option java_package = "dev.vortex.proto";
option java_outer_classname = "ExprProtos";

// Captures a generic representation of expressions in Vortex.
// Expression deserializers can be registered with a Vortex session to handle parsing this into
// an in-memory expression for execution.
message Expr {
  string id = 1;
  repeated Expr children = 2;
  optional bytes metadata = 3;
}

// Captures a serialized aggregate function with its ID and options metadata.
message AggregateFn {
  string id = 1;
  optional bytes metadata = 2;
}

// Options for numeric aggregate functions (`vortex.sum`, `vortex.min`, `vortex.max`),
// controlling how NaN values in floating-point inputs are handled.
message NumericalAggregateOpts {
  bool skip_nans = 1;
}

// A declared lexicographic ordering, checked by `vortex.is_compound_sorted`.
message IsCompoundSortedOpts {
  repeated SortField fields = 1;

  message SortField {
    string name = 1;
    SortDirection direction = 2;
  }

  enum SortDirection {
    ASC = 0;
    DESC = 1;
  }
}

// Options for `vortex.literal`
message LiteralOpts {
  vortex.scalar.Scalar value = 1;
}

// Options for `vortex.pack`
message PackOpts {
  repeated string paths = 1;
  bool nullable = 2;
}

// Options for `vortex.getitem`
message GetItemOpts {
  string path = 1;
}

// Options for `vortex.variant_get`
message VariantGetOpts {
  repeated VariantPathElement path = 1;
  optional vortex.dtype.DType dtype = 2;
}

// Options for `vortex.variant_pack`
message VariantPackOpts {
  bool complete = 1;
  bool shredded_validity = 2;
}

message VariantPathElement {
  oneof element {
    string field = 1;
    uint64 index = 2;
  }
}

// Options for `vortex.json_to_variant`
message JsonToVariantOpts {
  repeated ShreddingSpecField shredding = 1;
}

// One (path, dtype) shredding directive for `vortex.json_to_variant`.
message ShreddingSpecField {
  repeated VariantPathElement path = 1;
  vortex.dtype.DType dtype = 2;
}

// How a type-specific comparison orders the values in its domain.
//
// The mode holds one order for each type with more than one useful order. Only the float order is
// required. A reader fails when the float order is absent, and when it finds an order that it does
// not know. So a reader that knows this field never compares in another order than the writer
// asked for. Readers that predate this field, which include 0.95.0 and earlier, drop the mode and
// compare floats in total order.
//
// To add the order of another type, add a variant to `TypeOrder.order`. The new entry is optional:
// when it is absent, the comparison orders that type as it did before the entry existed. A writer
// emits the entry only when the operands contain that type, so that the comparisons of other types
// stay readable. An older reader decodes the variant as an empty `TypeOrder` and fails.
message CompareMode {
  // One entry for each type. A type has at most one entry.
  repeated TypeOrder orders = 1;

  // The order of the values of one type.
  message TypeOrder {
    oneof order {
      // How a comparison orders float values.
      FloatOrder float = 1;
    }
  }

  enum FloatOrder {
    // `-0.0 = +0.0`, and NaN values order by sign and payload.
    ZerosEqual = 0;
    // The total order over the bit patterns: `-0.0 < +0.0`.
    TotalOrder = 1;
    // `-0.0 = +0.0`, and all NaN values are equal and greatest.
    Canonical = 2;
    // `-0.0 = +0.0`, and NaN is unordered.
    Ieee754 = 3;
  }
}

// Options for `vortex.compare`
message CompareOpts {
  CompareOp op = 1;
  // How the comparison orders values. Options written before the mode existed have none, and
  // compare in total order.
  CompareMode mode = 2;

  enum CompareOp {
    Eq = 0;
    NotEq = 1;
    Gt = 2;
    Gte = 3;
    Lt = 4;
    Lte = 5;
  }
}

// Options for `vortex.boolean`
message BooleanOpts {
  BooleanOp op = 1;

  enum BooleanOp {
    And = 0;
    Or = 1;
  }
}

// Options for `vortex.numeric`
message NumericOpts {
  NumericOp op = 1;

  enum NumericOp {
    Add = 0;
    Sub = 1;
    Mul = 2;
    Div = 3;
  }
}

// Options for the legacy `vortex.binary` function. Vortex no longer writes it. A reader converts
// it to `vortex.compare`, `vortex.boolean`, or `vortex.numeric`.
message BinaryOpts {
  BinaryOp op = 1;

  enum BinaryOp {
    Eq = 0;
    NotEq = 1;
    Gt = 2;
    Gte = 3;
    Lt = 4;
    Lte = 5;
    And = 6;
    Or = 7;
    Add = 8;
    Sub = 9;
    Mul = 10;
    Div = 11;
  }
}

message BetweenOpts {
  bool lower_strict = 1;
  bool upper_strict = 2;
}

message LikeOpts {
  bool negated = 1;
  bool case_insensitive = 2;
}

message ListContainsOpts {
  bool sql_null_semantics = 1;
  // How the needle and the elements compare. Options written before the mode existed have none,
  // and compare in total order.
  CompareMode compare_mode = 2;
}

message CastOpts {
  vortex.dtype.DType target = 1;
}

// Options for `vortex.change_time_unit`.
message ChangeTimeUnitOpts {
  // The target time unit, as the same code that the temporal dtype metadata stores.
  uint32 unit = 1;
  Rounding rounding = 2;

  enum Rounding {
    EXACT = 0;
    TOWARD_ZERO = 1;
    FLOOR = 2;
    NEAREST_TIES_AWAY_FROM_ZERO = 3;
  }
}

// Options for `vortex.convert_time_zone`.
message ConvertTimeZoneOpts {
  string time_zone = 1;
}

message FieldNames {
  repeated string names = 1;
}

message SelectOpts {
  oneof opts {
    FieldNames include = 1;
    FieldNames exclude = 2;
  }
}

// Options for `vortex.case_when`
// Encodes num_when_then_pairs and has_else into a single u32 (num_children).
// num_children = num_when_then_pairs * 2 + (has_else ? 1 : 0)
// has_else = num_children % 2 == 1
// num_when_then_pairs = num_children / 2
message CaseWhenOpts {
  uint32 num_children = 1;
}

// Options for `vortex.replace_time_zone`. Ambiguity policy is an expression child.
message ReplaceTimeZoneOpts {
  optional string time_zone = 1;
  bool null_on_non_existent = 2;
}
