[package]
name = "vortex-spatial"
description = "Spatial encodings and layouts for Vortex files"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
geo = { workspace = true }
geo-traits = { workspace = true }
geo-types = { workspace = true }
geoarrow = { workspace = true }
geoarrow-cast = { workspace = true }
prost = { workspace = true }
vortex-array = { workspace = true }
vortex-arrow = { workspace = true }
vortex-buffer = { workspace = true }
vortex-error = { workspace = true }
vortex-mask = { workspace = true }
vortex-session = { workspace = true }
wkb = { workspace = true }

[features]
# Exposes the `test_harness` module to benches; not part of the public API.
_test-harness = []

[dev-dependencies]
divan = { workspace = true }
mimalloc = { workspace = true }
rstest = { workspace = true }
vortex-array = { workspace = true, features = ["_test-harness"] }
vortex-layout = { workspace = true }
vortex-spatial = { path = ".", features = ["_test-harness"] }

[[bench]]
name = "envelope"
harness = false

[[bench]]
name = "predicate_bbox"
harness = false

[[bench]]
name = "binary_predicates"
harness = false

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "make_line"
harness = false

[[bench]]
name = "area"
harness = false

[[bench]]
name = "length"
harness = false

[[bench]]
name = "collect"
harness = false

[lints]
workspace = true
