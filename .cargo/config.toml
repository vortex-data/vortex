[target.'cfg(target_family="unix")']
rustflags = [
    "-C", "force-frame-pointers=yes",
]

[alias]
xtask = "run -p xtask --"
vx = "run -p vortex-tui --"

[publish]
# NOTE(aduffy): we run into frequent issues auto-releasing our workspace
# to crates.io, the default timeout = 60 seconds. Setting this to zero
# means that it will block indefinitely and this config override is
# necessary for using the -Zpublish-timeout setting.
# See https://doc.rust-lang.org/beta/cargo/reference/unstable.html#publish-timeout
timeout = 3600

# Environment variables for PyO3. Ensures reproducible builds and avoids spurious recompilations.
[env]
PYO3_ENVIRONMENT_SIGNATURE = { value = "cpython-3.11-64bit", force = true }
# Read by benchmarks marked `#[cpu_features]` (see the `vortex-bench-support` crate), which
# expands to code reading both with `env!`. VORTEX_BENCH_VARIANT names the run: the benchmark
# is skipped when it is "simulation", and runs otherwise. VORTEX_BENCH_PREFIX and
# VORTEX_BENCH_SUFFIX wrap the benchmark's name, so a CI leg can label the numbers it produced:
# the prefix is the `::` component the leg's benchmark filter selects on, and the suffix is on
# the leaf name, which is the part CodSpeed reports under.
#
# The values below are what a plain `cargo bench` wants: nothing skipped, names left bare. The
# per-feature-set jobs in `.github/workflows/codspeed.yml` set their own. None of them is `force`d,
# so the value those jobs export wins over the one here.
VORTEX_BENCH_VARIANT = "local"
VORTEX_BENCH_PREFIX = ""
VORTEX_BENCH_SUFFIX = ""

[cache.global-clean]
# Anything older than this duration will be deleted in the source cache.
max-src-age = "1 week"
# Anything older than this duration will be deleted in the compressed crate cache.
max-crate-age = "1 week"
# Any git checkout older than this duration will be deleted from the checkout cache.
max-git-co-age = "1 week"
# Any index older than this duration will be deleted from the index cache.
max-index-age = "1 month"
# Any git clone older than this duration will be deleted from the git cache.
max-git-db-age = "1 month"
