syntax = "proto3";

package vortex.json;

// Options for `vortex.json_text`.
message JsonTextOpts {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    DIRECTION_PARSE = 1;
    DIRECTION_FORMAT = 2;
  }

  Direction direction = 1;
}
