[package]
name = "vortex-compat"
authors = { workspace = true }
description = "Backward-compatibility fixture generation and checking for Vortex"
edition = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
publish = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "vortex-compat"
path = "src/main.rs"
test = false

[dependencies]
# Vortex crates
vortex = { workspace = true, features = ["files", "tokio", "zstd"] }
vortex-array = { workspace = true, features = ["_test-harness", "arbitrary"] }
vortex-arrow = { workspace = true }
vortex-buffer = { workspace = true }
vortex-edition = { workspace = true }
vortex-runend = { workspace = true, features = ["arbitrary"] }
vortex-error = { workspace = true }
vortex-session = { workspace = true }

# TPC-H generation
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
tpchgen = { workspace = true }
tpchgen-arrow = { workspace = true }

# ClickBench parquet reading + writing
arrow-select = { workspace = true }
bytes = { workspace = true }
parquet = { workspace = true }

# Async runtime
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# HTTP fetching (for ClickBench fixture setup)
reqwest = { workspace = true }

# CLI + serialization
arbitrary = { workspace = true }
base16ct = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
