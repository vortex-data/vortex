    "sequence.vortex",
    "sparse.vortex",
    "struct_nested.vortex",
    "tpch_lineitem.vortex",
    "tpch_orders.vortex",
    "zigzag.vortex",
    "zstd.vortex",
]

[[expected_failure]]
