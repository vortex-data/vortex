# Documented forward-compatibility failures, read by `compat.py forward`.
#
# Each entry tolerates the failures of `fixtures` written under `editions` and read with a released
# reader from `min_version` to `max_version` (inclusive), when the error contains `error`. Any other
# failure fails the check. So does a file an entry covers that reads correctly: once a failure is
# fixed, narrow or remove its entry. Each entry covers exactly the observed failures.
#
# Regenerate the observations with
#   uv run compat.py forward --expected-failures /dev/null --results failures.json

[[expected_failure]]
id = "sequence-full-i8-range-error"
reason = """The writer emits a vortex.sequence array of i8 spanning the full range (-128..127, 256 values).
Readers from 0.61.0 to 0.85.0 convert the length 256 into i8 to check the final value and reject
the array. 0.86.1 and later accept it. Diagnosed: encodings/sequence/src/array.rs now checks the
step count (len - 1) instead."""
error = "final value not expressible"
min_version = "0.61.0"
max_version = "0.85.0"
editions = [
    "core2025.06.0",
    "core2025.10.0",
    "core2026.08.0",
    "core2026.08.1",
    "core2026.08.2",
    "core2026.08.3",
]
fixtures = ["decimal_byte_parts_narrow_msp.vortex"]

[[expected_failure]]
id = "sequence-full-i8-range-panic"
reason = """The same full-range i8 vortex.sequence array as sequence-full-i8-range-error. Readers from
0.42.0 to 0.60.0 panic (`must fit`) instead of returning an error."""
error = "must fit"
min_version = "0.42.0"
max_version = "0.60.0"
editions = ["core2025.06.0", "core2025.10.0"]
fixtures = ["decimal_byte_parts_narrow_msp.vortex"]

[[expected_failure]]
id = "struct-layout-validity-child"
reason = """The struct layout writes a validity child for a nullable struct (slot 0, vortex-layout
src/layouts/struct_/mod.rs). Readers up to 0.54.0 expect one child per field."""
error = "Struct layout has 3 children, but dtype has 2 fields"
min_version = "0.36.0"
max_version = "0.54.0"
editions = ["core2025.05.0", "core2025.06.0", "core2025.10.0"]
fixtures = ["struct_nested.vortex"]

[[expected_failure]]
id = "stats-unsigned-int64value"
reason = """Releases 0.59.2 to 0.59.4 reject an unsigned integer value serialized as Int64Value, which the
writer emits for unsigned columns. Earlier and later releases accept it. Not yet diagnosed which
serialized value (statistics, zone maps, or encoding metadata) carries it."""
error = "expected signed integer ptype for Int64Value"
min_version = "0.59.2"
max_version = "0.59.4"
editions = ["core2025.06.0", "core2025.10.0"]
fixtures = [
    "bitpacked.vortex",
    "chunked.vortex",
    "clickbench_hits_5k.vortex",
    "datetimeparts.vortex",
    "pco.vortex",
    "rle.vortex",
