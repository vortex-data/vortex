[package]
name = "vortex-layout"
authors = { workspace = true }
categories = { workspace = true }
description = "Vortex layouts provide a way to perform lazy push-down scans over abstract storage"
edition = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dependencies]
arcref = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bit-vec = { workspace = true }
flatbuffers = { workspace = true }
futures = { workspace = true, features = ["alloc", "async-await", "executor"] }
itertools = { workspace = true }
kanal = { workspace = true }
moka = { workspace = true, features = ["future"] }
once_cell = { workspace = true, features = ["parking_lot"] }
parking_lot = { workspace = true }
paste = { workspace = true }
pin-project-lite = { workspace = true }
prost = { workspace = true }
rustc-hash = { workspace = true }
sketches-ddsketch = { workspace = true }
termtree = { workspace = true }
tokio = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true }
vortex-array = { workspace = true }
vortex-arrow = { workspace = true }
vortex-btrblocks = { workspace = true }
vortex-buffer = { workspace = true }
vortex-error = { workspace = true }
vortex-flatbuffers = { workspace = true, features = ["layout"] }
vortex-io = { workspace = true }
vortex-mask = { workspace = true }
vortex-metrics = { workspace = true }
vortex-runend = { workspace = true }
vortex-scan = { workspace = true }
vortex-sequence = { workspace = true }
vortex-session = { workspace = true }
vortex-utils = { workspace = true, features = ["dashmap"] }

[dev-dependencies]
divan = { workspace = true }
futures = { workspace = true, features = ["executor"] }
insta = { workspace = true }
rstest = { workspace = true }
temp-env = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
vortex-array = { path = "../vortex-array", features = ["_test-harness"] }
vortex-io = { path = "../vortex-io", features = ["tokio"] }

[features]
default = ["wasm-bindgen"]
_test-harness = []
tokio = ["dep:tokio", "vortex-error/tokio"]
# `moka` enables uuid's `v4`, which needs a randomness source on wasm32-unknown-unknown.
# Disable this to supply your own instead, by depending on uuid from your own manifest with
# one of `js`, `rng-getrandom` (plus a getrandom backend), or `rng-rand` enabled.
wasm-bindgen = ["dep:uuid"]

[[bench]]
name = "zone_map_prune"
harness = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"], optional = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["uuid"]
