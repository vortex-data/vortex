# Policy Bot configuration: https://github.com/palantir/policy-bot
#
# Frozen editions carry a read-forever guarantee, so the declarations and their exported
# records are held to a higher bar than the rest of the repository. CI enforces that frozen
# records never change (`cargo run -p xtask -- check-editions`); this policy enforces that
# the changes the check does allow — new editions, draft edits, freezes — are seen by two
# reviewers instead of one.

policy:
  approval:
    - edition declarations and records have two approvals

approval_rules:
  - name: edition declarations and records have two approvals
    description: >-
      Changes under vortex/editions/ or vortex-edition/src/declarations/ alter what the
      edition compatibility contract says, so they need a second approval.
    if:
      changed_files:
        paths:
          - "^vortex/editions/.*$"
          - "^vortex-edition/src/declarations/.*$"
    requires:
      count: 2
      permissions:
        - "write"
